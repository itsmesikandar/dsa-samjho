# 13. Quick revision
revision:
  summary:
    - "Deque: dono kinaron par add/remove O(1); ArrayDeque."
    - "Monotonic deque: order todne wale peeche se hatao, purane aage se."
    - "Window max: indexes, values ghatti; drop ≤ i − k; ans = nums[first]."
    - "Window max + min: do deques (max − min ≤ limit)."
    - "Negatives + sum ≥ k: prefix sums + pre badhte deque."
  cheatsheet: |
    ```kotlin
    val dq = ArrayDeque<Int>()          // indexes
    for (i in nums.indices) {
        if (dq.isNotEmpty() && dq.first() <= i - k) dq.removeFirst()
        while (dq.isNotEmpty() && nums[dq.last()] <= nums[i]) dq.removeLast()
        dq.addLast(i)
        if (i >= k - 1) res += nums[dq.first()]
    }
    ```
  quiz:
    - q: "Sliding window max ke deque mein values kaise rakhte hain?"
      options: ["Badhte order", "Ghatte order (aage = max)", "Random", "Sorted by index ulta"]
      answer: 1
      explain: "Aage wala hamesha window ka max."
    - q: "Window i − k + 1..i. Aage wala index kab hatao?"
      options: ["< i − k + 1 yaani ≤ i − k", "< i", "> i − k", "Kabhi nahi"]
      answer: 0
      explain: "Window se bahar."
    - q: "[1, 3, −1], k = 3 — pehli window ka max?"
      options: ["1", "3", "−1", "4"]
      answer: 1
      explain: "max(1, 3, −1) = 3."
    - q: "Sliding window max ki complexity (deque)?"
      options: ["O(n·k)", "O(n log n)", "O(n)", "O(k)"]
      answer: 2
      explain: "Har index max ek baar push aur pop."
    - q: "Negatives ke saath 'sum ≥ k sabse chhota' — kya chahiye?"
      options: ["Simple sliding window", "Prefix sums + monotonic deque", "Sorting", "Binary search hamesha"]
      answer: 1
      explain: "Window monotonic nahi rehta."

