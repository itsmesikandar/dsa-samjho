meta:
  id: monotonic-stack
  chapter: stack-queue
  title: Monotonic Stack
  subtitle: Stack jo hamesha sorted rehta hai — "next greater / previous smaller" O(n) mein
  level: intermediate
  minutes: 40
  prereqs: [stack]
  tags: [monotonic-stack, next-greater, histogram, stock-span]

# 1. Ye kya hai?
what:
  body: |
    **Monotonic stack** = aisa stack jiske items neeche se upar hamesha **badhte** (increasing) ya **ghatte** (decreasing) rehte hain. Naya item order todta hai to pehle top se woh items **pop** karo jo order tod rahe hain.

    Ye ek sawaal ka jawab sabke liye O(n) mein deta hai:

    | Sawaal | Stack ka order | Kab jawab milta hai |
    |---|---|---|
    | Right pehla **bada** | ghatta (decreasing) | pop hote time |
    | Right pehla **chhota** | badhta (increasing) | pop hote time |
    | Left pehla **bada** | ghatta | push se pehle top |
    | Left pehla **chhota** | badhta | push se pehle top |

    > [!yaad]
    > Har item **ek baar push, max ek baar pop** → andar `while` hone ke baad bhi O(n).
  analogy: |
    **Line mein khade log, har ek aage dekhta hai:** "Mujhse lamba pehla insaan kaun?" Jab tak koi lamba nahi aata, log wait karte hain (stack mein). Jaise hi ek lamba aata hai, uske peeche khade saare chhote log ek saath jawab paa jaate hain — "ye raha!" — aur line chhod dete hain.

# 2. Kyun chahiye?
why:
  body: |
    "Har element ke liye next greater" — brute force: har i se aage scan → **O(n²)**. n = 10⁵ → 10¹⁰ — TLE.

    Monotonic stack **O(n)**. Aur ye pattern bahut jagah:
    - Daily temperatures, stock span (finance).
    - Largest rectangle in histogram, maximal rectangle.
    - Trapping rain water (stack wala tareeka).
    - "Sum of subarray minimums" — har item kitne subarrays ka min hai.

    > [!socho]
    > Stack mein `[5, 3]` (neeche 5) hain, naya 4 aaya (next greater dhoondh rahe). 3 ko pop karo — kyun? Aur 5 ko kyun nahi?
    >
    > 3 ka jawab mil gaya (4 > 3). 5 ka nahi (4 < 5) — wo wait karega. Aur 4 push hoga: stack `[5, 4]` — ab bhi ghatta. Order kabhi nahi tootta.

# 3. Visual intro
visual:
  body: |
    Buildings: har ek ki chhat se right **pehli lambi building**. Narangi = wait mein (stack). Jaise hi lambi aati hai, peeche ki chhoti saari ek saath jawab paa leti hain.
  viz: { tracer: buildingsView }

# 4. Kaise kaam karta hai
how:
  body: |
    **Next Greater Element** (stack mein indexes, values ghatti hui):

    Har `i` par:
    1. Jab tak top ki value `< nums[i]`: `res[top] = nums[i]`, pop.
    2. `i` push (iska jawab baad mein).
    3. Aakhir mein stack mein bache → −1.

    `[2, 1, 2, 4, 3]` → `[4, 2, 4, −1, −1]`

    > [!tip]
    > `<` vs `<=` dhyaan se: barabar wala "greater" nahi hai, to `<` par pop. "Greater or equal" chahiye to `<=`. Duplicates wale test cases yahin pakadte hain.
  viz: { tracer: ngTrace }
  code: how

# 5. Operations table
operations:
  - op: "Next / previous greater ya smaller (sab items)"
    time: O(n)
    space: O(n)
    why: "Har index ek push, max ek pop."
  - op: "Brute force (har item aage scan)"
    time: O(n²)
    space: O(1)
    why: "Har i ke liye j > i."
  - op: "Circular array next greater"
    time: O(n)
    space: O(n)
    why: "Index 0..2n − 1, a[i % n]."
  - op: "Largest rectangle in histogram"
    time: O(n)
    space: O(n)
    why: "Pop par left/right wall dono pata."
  - op: "Online stock span (har naya din)"
    time: "O(1) amortized"
    space: O(n)
    why: "Chhote pichhle din pop, span jodo."
  - op: "Sum of subarray minimums"
    time: O(n)
    space: O(n)
    why: "Har item ke left/right chhote se uska 'kitne subarrays ka min'."

# 6. Code
code:
  - title: Previous smaller element (left pehla chhota)
    file: prev-smaller
    note: |
      "Left" wale sawaal mein jawab **push se pehle** milta hai: order todne wale (x se bade/barabar) pop karo, jo top par bacha wahi x ka left pehla chhota. Stack yahan **badhta** hua.

      Yaad rakhne ka tareeka: **right = pop hote time jawab**, **left = push se pehle top**.

# 7. Examples
examples:
  - id: next-greater-1
    level: easy
    title: Next Greater Element I
    source: { name: Next Greater Element I, platform: LeetCode, url: "https://leetcode.com/problems/next-greater-element-i/" }
    problem: |
      `nums1` ke har number ke liye: `nums2` mein **usi number ke right** pehla bada number (na ho to −1). `nums1` ke saare numbers `nums2` mein hain; sab distinct.

      Example: `nums1 = [4, 1, 2]`, `nums2 = [1, 3, 4, 2]` → `[−1, 3, −1]`
    intuition: |
      `nums2` par ek baar next greater nikaal lo (monotonic stack), result **HashMap** (value → next greater) mein. Phir `nums1` ke liye bas lookup.

      Values distinct hain isliye value hi key ban sakti hai (warna index rakhte).

      > [!tip]
      > "Kuch queries, ek base array" → base par ek baar precompute (stack), queries O(1) lookup.
    dryRun: |
      nums2 = `[1, 3, 4, 2]`

      | x | Pop (next set) | Stack |
      |---|---|---|
      | 1 | – | 1 |
      | 3 | next[1] = 3 | 3 |
      | 4 | next[3] = 4 | 4 |
      | 2 | – | 4, 2 |

      nums1 [4, 1, 2] → [−1, 3, −1]
    viz: { tracer: nge1Trace }
    code: ex1-nge
    complexity:
      time: O(n + m)
      space: O(m)
      why: "nums2 ek pass + nums1 lookups; map + stack."

  - id: daily-temperatures
    level: medium
    title: Daily Temperatures — kitne din baad garmi?
    source: { name: Daily Temperatures, platform: LeetCode, url: "https://leetcode.com/problems/daily-temperatures/" }
    problem: |
      Rozana ke temperatures. Har din ke liye: kitne din baad **zyada garam** din aayega? Kabhi na aaye to 0.

      Example: `[73, 74, 75, 71, 69, 72, 76, 73]` → `[1, 1, 4, 2, 1, 1, 0, 0]`
    intuition: |
      Next greater hi hai — par **value nahi, distance** chahiye. Isliye stack mein **index** (din) rakho: pop karte time `res[d] = i − d`.

      Stack mein din jinke liye garam din abhi nahi aaya — unke temps neeche se upar ghatte hue.

      > [!galti]
      > Stack mein temperature (value) rakh di → distance nikaal hi nahi sakte. Monotonic stack mein hamesha **index** rakho; value `arr[index]` se mil jaati hai.
    dryRun: |
      | Din i | Temp | Pop (res) | Stack (din) |
      |---|---|---|---|
      | 0 | 73 | – | 0 |
      | 1 | 74 | 0 → 1 | 1 |
      | 2 | 75 | 1 → 1 | 2 |
      | 3, 4 | 71, 69 | – | 2, 3, 4 |
      | 5 | 72 | 4 → 1, 3 → 2 | 2, 5 |
      | 6 | 76 | 5 → 1, 2 → 4 | 6 |
      | 7 | 73 | – | 6, 7 → baaki 0 |
    viz: { tracer: tempsTrace }
    code: ex2-temps
    complexity:
      time: O(n)
      space: O(n)
      why: "Har din ek push, max ek pop."

  - id: histogram
    level: tricky
    title: Histogram ka sabse bada rectangle
    source: { name: Largest Rectangle in Histogram, platform: LeetCode, url: "https://leetcode.com/problems/largest-rectangle-in-histogram/" }
    problem: |
      Bars ki heights (har bar ki width 1). In bars ke andar banne wala **sabse bada rectangle** — area?

      Example: `[2, 1, 5, 6, 2, 3]` → **10** (heights 5 aur 6 par, 5 × 2)
    intuition: |
      Har bar ko "rectangle ki height" maano. Wo kitna wide ho sakta hai? Left mein jab tak bars `≥` hain, right mein bhi. Matlab **previous smaller** aur **next smaller** ke beech.

      Dono ek pass mein — **badhta hua** stack (indexes):
      - Naya bar top se chhota/barabar → top pop. Uski height ke liye: **right wall = i** (next smaller), **left wall = stack mein uske neeche wala** (previous smaller). Width = `i − left − 1`.
      - Aakhir mein nakli 0 height daalo — bache sab pop ho jaayein.

      > [!tip]
      > Maximal Rectangle (0/1 matrix) = har row ko histogram banao (upar ki taraf continuous 1s ki count) aur yahi function chalao.
    dryRun: |
      `[2, 1, 5, 6, 2, 3]`

      | i (cur) | Pop | left | Area |
      |---|---|---|---|
      | 1 (1) | 0 (h 2) | −1 | 2 × 1 = 2 |
      | 4 (2) | 3 (h 6) | 2 | 6 × 1 = 6 |
      | 4 (2) | 2 (h 5) | 1 | 5 × 2 = **10** |
      | 6 (0) | 5 (h 3) | 4 | 3 × 1 = 3 |
      | 6 (0) | 4 (h 2) | 1 | 2 × 4 = 8 |
      | 6 (0) | 1 (h 1) | −1 | 1 × 6 = 6 |
    viz: { tracer: histTrace }
    code: ex3-histogram
    complexity:
      time: O(n)
      space: O(n)
      why: "Har bar ek push, ek pop; pop par area O(1)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Har element ke liye next/previous greater/smaller."
    - "'Kitne din tak', 'kitna door tak' — span / distance (index rakho)."
    - "Rectangle / area jismein har bar ki left-right boundary chahiye."
    - "Subarray min/max ka contribution (sum of subarray minimums)."
  avoid:
    - "Sliding window ka max/min — deque (purane aage se bhi hatane hain)."
    - "Sirf ek element ka next greater — seedha scan kaafi."
    - "k-th next greater ya range queries — sparse table / segment tree."
  signals:
    - keyword: "next greater / next smaller / previous greater"
      think: "Monotonic stack of indexes; right = pop par, left = push se pehle."
    - keyword: "how many days until warmer / span"
      think: "Index stack, distance = i − index."
    - keyword: "largest rectangle / histogram / maximal rectangle"
      think: "Increasing stack, pop par area."
    - keyword: "circular array next greater"
      think: "0..2n − 1, a[i % n]."

