# 13. Quick revision
revision:
  summary:
    - "Monotonic stack = sorted stack; naya order tode to pop."
    - "Right pehla bada: decreasing stack, jawab pop par."
    - "Left pehla chhota: increasing stack, jawab push se pehle top."
    - "Index rakho (distance/width ke liye); har item ek push ek pop → O(n)."
    - "Histogram: pop par width = i − (neeche wala) − 1; aakhir mein 0 height."
  cheatsheet: |
    ```kotlin
    // next greater
    val res = IntArray(n) { -1 }; val st = ArrayDeque<Int>()
    for (i in 0 until n) {
        while (st.isNotEmpty() && a[st.last()] < a[i]) res[st.removeLast()] = a[i]
        st.addLast(i)
    }
    // previous smaller
    while (st.isNotEmpty() && st.last() >= x) st.removeLast(); prev = st.lastOrNull() ?: -1
    ```
  quiz:
    - q: "[3, 1, 4] mein 3 ka next greater?"
      options: ["1", "4", "−1", "3"]
      answer: 1
      explain: "Right pehla bada 4."
    - q: "Next greater ke liye stack (neeche se upar)?"
      options: ["Badhta", "Ghatta", "Random", "Sorted by index"]
      answer: 1
      explain: "Bada aate hi chhote pop hote hain — bache ghatte order mein."
    - q: "Daily temps [70, 71, 69, 72] — din 2 (69) ka answer?"
      options: ["0", "1", "2", "3"]
      answer: 1
      explain: "Agle din 72 — 1 din baad."
    - q: "Monotonic stack ki complexity (andar while ke saath)?"
      options: ["O(n²)", "O(n log n)", "O(n)", "O(1)"]
      answer: 2
      explain: "Har item max ek baar pop."
    - q: "Histogram [2, 4] ka sabse bada rectangle?"
      options: ["2", "4", "6", "8"]
      answer: 1
      explain: "4 × 1 = 4 ya 2 × 2 = 4."

