# 10. Common galtiyan & edge cases
mistakes:
  - title: "Values rakhi, indexes nahi"
    type: logic
    wrong: |
      Stack mein temperatures → distance nahi nikal sakti, duplicates mein confusion.
    right: |
      Index rakho; value `arr[idx]`.
  - title: "< aur <= ka confusion"
    type: off-by-one
    wrong: |
      Strictly greater chahiye tha, `<=` par pop kiya → barabar wale ko 'greater' maan liya.
    right: |
      Sawaal padho: strictly greater → `top < cur` par pop.
  - title: "Bache hue stack items bhool gaye"
    type: logic
    wrong: |
      Loop ke baad stack mein bache items ka answer set nahi kiya (default 0 rah gaya jahan −1 chahiye tha).
    right: |
      Res ko shuru mein −1 se bharo, ya loop ke baad bache sab ko set karo.
  - title: "Histogram mein aakhri bars"
    type: logic
    wrong: |
      Loop khatam, stack mein badhte bars bache — unke area kabhi nahi count kiye.
    right: |
      Aakhir mein nakli 0 height (i = n) — sab pop ho jaate hain.
  - title: "Area overflow"
    type: overflow
    right: |
      Height 10⁴ × width 10⁵ = 10⁹ Int mein theek; bade constraints par Long.

# 11. Interview corner
interview:
  questions:
    - q: "Monotonic stack kya hai, complexity?"
      a: |
        Stack jiske items hamesha sorted (inc/dec). Naya item order tode to pop. Har item ek push, ek pop → O(n).
    - q: "Next greater ke liye stack increasing ya decreasing?"
      a: |
        Decreasing (neeche bada). Bada aaya to chhote pop — unka jawab mil gaya.
    - q: "Previous smaller kaise?"
      a: |
        Increasing stack; push se pehle x se bade/barabar pop; top = previous smaller.
    - q: "Circular array mein next greater?"
      followUp: true
      a: |
        i = 0..2n − 1 chalao, a[i % n] use karo; res sirf i < n wale set karo (ya pehle pass mein push sirf i < n).
    - q: "Histogram O(n) mein kyun sahi?"
      a: |
        Pop hote bar ka right boundary current i (pehla chhota), left boundary stack mein neeche wala (pichhla chhota). Har bar ka max rectangle exactly ek baar gina.
    - q: "Trapping rain water stack se?"
      followUp: true
      a: |
        Decreasing stack; bada bar aaya to beech ka pop (bottom), left = naya top, right = i: paani = (min(h[left], h[i]) − h[bottom]) × (i − left − 1).
    - q: "Sum of subarray minimums?"
      a: |
        Har a[i] kitne subarrays ka min: left (pichhle chhote tak) × right (agle chhote tak). Duplicates ke liye ek taraf < aur doosri taraf <=.
    - q: "Deque vs monotonic stack?"
      a: |
        Stack: sirf ek edge se pop (next/prev greater). Deque: window se bahar wale aage se bhi hatane hon (sliding window max).
  mayAsk:
    - "Online Stock Span."
    - "Next Greater Element II."
    - "Remove K Digits."
    - "Sum of Subarray Minimums."

