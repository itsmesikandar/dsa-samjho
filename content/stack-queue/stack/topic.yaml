# 13. Quick revision
revision:
  summary:
    - "Stack = LIFO; push/pop/peek O(1); top par hi kaam."
    - "Kotlin ArrayDeque (addLast/removeLast), Java ArrayDeque (push/pop) — Stack class nahi."
    - "Brackets: khula push, band pop + match, end par khaali."
    - "'Sabse fresh pehle', nesting, hatane se chain reaction → stack."
    - "Stack = recursion ka manual form."
  cheatsheet: |
    ```kotlin
    val st = ArrayDeque<Char>()
    for (c in s) when (c) {
        '(', '[', '{' -> st.addLast(c)
        else -> if (st.isEmpty() || st.removeLast() != pairOf(c)) return false
    }
    return st.isEmpty()

    // RPN: num -> push; op -> b = pop, a = pop, push(a op b)
    ```
  quiz:
    - q: "Push 1, 2, 3, phir pop. Kya nikla?"
      options: ["1", "2", "3", "Kuch nahi"]
      answer: 2
      explain: "LIFO — sabse baad wala pehle."
    - q: "\"([)]\" valid hai?"
      options: ["Haan", "Nahi", "Sirf round brackets ke liye", "Pata nahi chal sakta"]
      answer: 1
      explain: "')' ke time top '[' hai — joda nahi."
    - q: "RPN \"6 2 /\" ka result?"
      options: ["3", "0", "12", "4"]
      answer: 0
      explain: "b = 2, a = 6 → 6 / 2."
    - q: "Java mein stack ke liye kaunsa class?"
      options: ["java.util.Stack", "ArrayDeque", "LinkedList hamesha", "Vector"]
      answer: 1
      explain: "Stack purana aur synchronized hai."
    - q: "\"abbaca\" se adjacent duplicates hatane ke baad?"
      options: ["aca", "ca", "abca", "a"]
      answer: 1
      explain: "bb gaya → aaca, aa gaya → ca."

