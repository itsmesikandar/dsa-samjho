    platform: LeetCode
    num: 950
    url: "https://leetcode.com/problems/reveal-cards-in-increasing-order/"
    level: medium
    pattern: Simulate on indexes
    hint: "Queue mein indexes 0..n−1. Sorted cards ke liye: aage wala index lo, wahan card rakho; phir agla aage wala peeche bhejo."
  - name: Design Front Middle Back Queue
    platform: LeetCode
    num: 1670
    url: "https://leetcode.com/problems/design-front-middle-back-queue/"
    level: medium
    pattern: Two deques balanced
    hint: "Left aur right do deques; left.size == right.size ya right.size == left.size + 1 rakho. Middle = jodo-todo."
  - name: Minimum Number of K Consecutive Bit Flips
    platform: LeetCode
    num: 995
    url: "https://leetcode.com/problems/minimum-number-of-k-consecutive-bit-flips/"
    level: hard
    pattern: Queue of active flips
    hint: "Left se chalo. Queue mein un flips ke start index jo abhi bhi i ko cover karte hain (start > i − k). Asli bit = nums[i] xor (queue size % 2). 0 ho to yahin se flip shuru (i + k > n → −1)."
  - name: Max Value of Equation
    platform: LeetCode
    num: 1499
    url: "https://leetcode.com/problems/max-value-of-equation/"
    level: hard
    pattern: Monotonic queue over a window
    hint: "xi < xj ho to yi + yj + xj − xi = (yi − xi) + (yj + xj). Har j ke liye window (xj − xi ≤ k) mein (yi − xi) ka max chahiye — deque mein (y − x) decreasing rakho, door wale (xj − xi > k) aage se hatao."

# 13. Quick revision
revision:
  summary:
    - "Queue = FIFO; peeche jodo, aage se nikaalo; O(1)."
    - "ArrayDeque lo — ArrayList.removeAt(0) O(n)."
    - "Two stacks: outbox khaali ho tabhi shift → amortized O(1)."
    - "Time window / stream: aage se purane hatao."
    - "Round-robin: jeetne wala wapas peeche (index + n)."
  cheatsheet: |
    ```kotlin
    val q = ArrayDeque<Int>()
    q.addLast(x); q.first(); q.removeFirst(); q.removeFirstOrNull()

    // window of last W ms
    q.addLast(t); while (q.first() < t - W) q.removeFirst(); q.size
    ```
    ```java
    Queue<Integer> q = new ArrayDeque<>();
    q.offer(x); q.peek(); q.poll();     // null on empty
    ```
  quiz:
    - q: "Enqueue 1, 2, 3 phir dequeue. Kya nikla?"
      options: ["3", "1", "2", "Kuch nahi"]
      answer: 1
      explain: "FIFO — pehla aaya pehle gaya."
    - q: "ArrayList.removeAt(0) ki complexity?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n²)"]
      answer: 2
      explain: "Baaki sab ek jagah khiskte hain."
    - q: "Two-stack queue mein inbox → outbox shift kab?"
      options: ["Har push par", "Har pop par", "Sirf jab outbox khaali ho", "Kabhi nahi"]
      answer: 2
      explain: "Isse har item ek hi baar shift hota hai."
    - q: "Java queue khaali hai, poll() kya dega?"
      options: ["Exception", "null", "0", "-1"]
      answer: 1
      explain: "remove() exception deta, poll() null."
    - q: "\"Pehla non-repeating char\" stream mein — kaunsa structure?"
      options: ["Stack", "Queue + count", "Sirf HashSet", "Heap"]
      answer: 1
      explain: "Pehla (order) chahiye — FIFO."

