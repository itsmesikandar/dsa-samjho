# 13. Quick revision
revision:
  summary:
    - "Array ko gol maano: index % k."
    - "head + count se sab: tail = (head + count) % k, rear = (head + count − 1) % k."
    - "Dequeue = head aage; insertFront = (head − 1 + k) % k."
    - "Full/empty: count se (head == tail dono mein hota hai)."
    - "Ring buffer: purana overwrite, running sum — moving average O(1)."
  cheatsheet: |
    ```kotlin
    val a = IntArray(k); var head = 0; var count = 0
    // enqueue
    if (count < k) { a[(head + count) % k] = x; count++ }
    // dequeue
    if (count > 0) { head = (head + 1) % k; count-- }
    // front / rear
    a[head]; a[(head + count - 1) % k]
    // insertFront (deque)
    head = (head - 1 + k) % k; a[head] = x; count++
    ```
  quiz:
    - q: "k = 5, head = 3, count = 4. Agla enqueue kis index par?"
      options: ["7", "2", "1", "0"]
      answer: 1
      explain: "(3 + 4) % 5 = 2."
    - q: "Rear item ka index (head = 3, count = 4, k = 5)?"
      options: ["1", "2", "6", "0"]
      answer: 0
      explain: "(3 + 4 − 1) % 5 = 1."
    - q: "head = 0 par insertFront ke baad head (k = 4)?"
      options: ["-1", "3", "1", "0"]
      answer: 1
      explain: "(0 − 1 + 4) % 4 = 3."
    - q: "head == tail ka matlab?"
      options: ["Hamesha khaali", "Hamesha bhara", "Khaali ya bhara — count se pata chalega", "Error"]
      answer: 2
      explain: "Isliye count rakhte hain."
    - q: "Gas Station: diff = [−1, 2, −3, 4], total?"
      options: ["2", "−2", "10", "0"]
      answer: 0
      explain: "−1 + 2 − 3 + 4 = 2 ≥ 0 → answer exist karta hai."

