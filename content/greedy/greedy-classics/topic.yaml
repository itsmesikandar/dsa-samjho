# 13. Quick revision
revision:
  summary:
    - "Stock I: running min; best = max(aaj − min). O(n)."
    - "Stock II: har positive (aaj − kal) jodo."
    - "Gas Station: total < 0 → -1; tank < 0 → start = i + 1, tank = 0."
    - "Partition Labels: last[] nikaalo; end = max(end, last); i == end par kaato."
    - "Pattern: ek pass + running number + 'fail = poora range rad' ka observation."
  cheatsheet: |
    ```kotlin
    // stock I
    var mn = Int.MAX_VALUE; var best = 0
    for (p in prices) if (p < mn) mn = p else best = maxOf(best, p - mn)
    // stock II
    for (i in 1 until n) if (prices[i] > prices[i-1]) profit += prices[i] - prices[i-1]
    // gas station
    for (i in gas.indices) { val d = gas[i] - cost[i]; total += d; tank += d; if (tank < 0) { start = i + 1; tank = 0 } }
    // partition labels
    for (i in s.indices) { end = maxOf(end, last[s[i] - 'a']); if (i == end) { sizes.add(end - start + 1); start = i + 1 } }
    ```
  quiz:
    - q: "Stock I: [5, 1]. Max munafa?"
      options: ["4", "0", "-4", "1"]
      answer: 1
      explain: "Pehle khareed, baad mein bech — 5 par khareed ke 1 par bechna ghaata. Kuch na karo: 0."
    - q: "Stock II: [1, 3, 2, 5]. Max munafa?"
      options: ["4", "5", "3", "6"]
      answer: 1
      explain: "(3 − 1) + (5 − 2) = 5."
    - q: "Gas station mein tank i par minus hua. Agla start?"
      options: ["start + 1", "i + 1", "i", "0"]
      answer: 1
      explain: "start..i sab rad — i + 1 se try."
    - q: "Partition Labels 'abab' ka jawab?"
      options: ["[2, 2]", "[4]", "[1, 1, 1, 1]", "[3, 1]"]
      answer: 1
      explain: "a ka aakhri 2, b ka aakhri 3 — poora ek tukda."
    - q: "Gas station: kul (gas − cost) = −2. Jawab?"
      options: ["0", "-1", "Aakhri reset ke baad wala", "n - 1"]
      answer: 1
      explain: "Kul petrol kam — koi start poora chakkar nahi laga sakta."

