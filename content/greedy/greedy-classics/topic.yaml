meta:
  id: greedy-classics
  chapter: greedy
  title: Greedy classics
  subtitle: Stock, gas station, partition labels — ek pass, ek running number, sahi observation
  level: intermediate
  minutes: 45
  prereqs: [greedy-basics, kadane]
  tags: [greedy, stock, gas-station, partition-labels, running-min, one-pass]

# 1. Ye kya hai?
what:
  body: |
    Interview ke kuch greedy sawaal baar baar aate hain. Sabka dhaancha ek: **ek pass**, ek-do **running numbers**, aur ek **observation** jo saare combinations dekhne se bacha leta hai.

    | Sawaal | Running number | Observation |
    |---|---|---|
    | Stock — ek sauda | `minPrice` | aaj bechna ho to sabse saste pichhle din khareedo |
    | Stock — kai saude | `profit` | bada sauda = chhote rozana saudon ka jod |
    | Gas Station | `tank`, `total` | tank minus → beech ke saare start bekaar |
    | Partition Labels | `end` | tukda letter ke aakhri index tak jaana hi padega |

    Har jagah O(n²) / O(2ⁿ) ka seedha tareeka hai — observation use **O(n)** bana deta hai.

    > [!yaad]
    > Greedy observation dhoondhne ka sawaal: "kya main kisi poore group of choices ko ek saath **rad** kar sakta hoon?" (Gas station: ek fail = poora range rad.)
  analogy: |
    **Sabzi mandi ka vyapari:**
    Har subah daam dekhta hai. "Ek hi baar khareed-bech" → hafte ka sabse sasta din yaad rakhta hai, har din sochta hai aaj bechun to kitna. "Roz kar sakta hoon" → bas jis din kal se daam badha, kal ka maal aaj bech diya. Na koi table, na koi lamba hisaab — ek number dimaag mein.

# 2. Kyun chahiye?
why:
  body: |
    Ye sawaal **pattern** sikhaate hain jo aage kaam aate hain:
    - **Running min / max** (stock I) → Kadane, sliding window, "best pair i < j".
    - **Chhote faislon ka jod = bada faisla** (stock II) → telescoping sum.
    - **Fail ho to aage se shuru** (gas station) → Kadane jaisa reset.
    - **Pehle aakhri occurrence nikaalo, phir sweep** (partition labels) → interval merge ka roop.

    | Sawaal | Seedha | Greedy |
    |---|---|---|
    | Stock I | O(n²) har jodi | O(n) |
    | Gas Station | O(n²) har start | O(n) |
    | Partition Labels | O(n²) har kaat check | O(n) |

    > [!socho]
    > Gas station mein start s se i tak pahunche aur i par tank minus hua. s aur i ke beech koi station k start kyun nahi ho sakta?
    >
    > s se k tak pahunchte waqt tank ≥ 0 tha (warna pehle hi reset hota). Yaani k par hum "kuch bache petrol ke saath" aaye. k se khaali tank shuru karna to aur bura — wo bhi i tak nahi pahunchega.

# 3. Visual intro
visual:
  body: |
    Share ke daam ka chart. Har lagaataar chadhaai hari ho jaati hai aur uska munafa judta hai. Daam badal ke dekho — girawat waale din kabhi kuch nahi jodte.
  viz: { tracer: climbTrace }

# 4. Kaise kaam karta hai
how:
  body: |
    **Best Time to Buy and Sell Stock (ek sauda):**
    1. `minPrice` = ab tak ka sabse sasta din.
    2. Har din: aaj ka daam `minPrice` se kam → naya `minPrice`. Warna `best = max(best, aaj - minPrice)`.

    Kyun sahi: agar aaj bechna hai to sabse achha khareed din = **pichhle** dinon mein sabse sasta. Har bech-din ke liye wo ek number kaafi — saari jodiyan dekhne ki zaroorat nahi.

    > [!galti]
    > `max(prices) - min(prices)` — par min baad mein aa sakta hai (bechne ke baad khareed nahi sakte). `[5, 1]` par jawab 0 hai, 4 nahi.
  viz: { tracer: oneTradeTrace }
  code: how

# 5. Operations table
operations:
  - op: "Stock I (running min)"
    time: O(n)
    space: O(1)
    why: "Ek pass; minPrice aur best."
  - op: "Stock II (har chadhaai)"
    time: O(n)
    space: O(1)
    why: "Ek pass; sirf positive farak jodo."
  - op: "Gas Station"
    time: O(n)
    space: O(1)
    why: "Ek pass; tank reset aur total."
  - op: "Partition Labels"
    time: O(n)
    space: O(1)
    why: "Do pass; last[] sirf 26 letters."
  - op: "Two City Scheduling"
    time: "O(n log n)"
    space: O(1)
    why: "Farak (a − b) se sort, phir ek pass."

# 6. Code
code:
  - title: Two City Scheduling — farak se sort
    file: two-city
    note: |
      2n log interview ke liye; n ko city A, n ko city B bhejna hai. Kharcha kam se kam.

      Har insaan ke liye socho: A bhejne se kitna bachta hai = `a − b` (jitna chhota, utna A ke liye achha). Is farak se sort; pehle n → A, baaki → B.

      Saboot (exchange): agar koi insaan x A mein hai aur y B mein, par `a_y − b_y < a_x − b_x`, to dono ki jagah badlo — kul kharcha kam ya barabar.

      Sort ki key sahi chunna hi poora greedy hai. (LeetCode 1029.)

# 7. Examples
examples:
  - id: stock-ii
    level: easy
    title: Kai baar khareed-bech — max munafa (Stock II)
    source: { name: Best Time to Buy and Sell Stock II, platform: LeetCode, url: "https://leetcode.com/problems/best-time-to-buy-and-sell-stock-ii/" }
    problem: |
      Har din ka share daam diya hai. Jitni baar chaho khareedo-becho, par ek waqt mein ek hi share pakad sakte ho (naya khareedne se pehle becho). Max munafa?

      Example: `[7, 2, 5, 1, 6, 4]` → **8** (2 → 5: +3, 1 → 6: +5)
    intuition: |
      Chadhaai `a → b → c` (badhte daam) ka munafa `c − a` = `(b − a) + (c − b)`. Yaani bada sauda = rozana ke chhote saudon ka jod.

      To bas: har din `aaj > kal` → `profit += aaj − kal`. Girawat → kuch nahi.

      Kabhi bhi "kal khareeda aaj becha" — ek din mein dono kaam (becho aur wapas khareedo) chalta hai, isliye ye hamesha valid.

      > [!galti]
      > Peaks aur valleys dhoondhne ka lamba code likha — chalta hai, par har positive farak jodna wahi jawab ek line mein deta hai.
    dryRun: |
      | Din | Daam | Kal se farak | Munafa |
      |---|---|---|---|
      | 1 | 2 | −5 | 0 |
      | 2 | 5 | +3 | 3 |
      | 3 | 1 | −4 | 3 |
      | 4 | 6 | +5 | 8 |
      | 5 | 4 | −2 | **8** |
    viz: { tracer: stockIITrace }
    code: ex1-stock-ii
    complexity:
      time: O(n)
      space: O(1)
      why: "Ek pass, ek variable."

  - id: gas-station
    level: medium
    title: Gol sadak par kahan se shuru karein? (Gas Station)
    source: { name: Gas Station, platform: LeetCode, url: "https://leetcode.com/problems/gas-station/" }
    problem: |
      Gol sadak par n petrol pump. Pump i par `gas[i]` petrol milta hai, i se agle tak jaane mein `cost[i]` lagta hai. Khaali tank ke saath kis pump se shuru karein ki ek poora chakkar ho jaaye? Na ho sake to -1. (Jawab ho to unique hota hai.)

      Example: gas `[3, 1, 2, 5, 4]`, cost `[4, 2, 3, 1, 3]` → **3**
    intuition: |
      Do observations:
      1. **Kul** `gas − cost` < 0 → koi start nahi chalega. ≥ 0 → koi na koi start zaroor chalega.
      2. Start s se chale, i par tank minus hua → s se i tak koi bhi start nahi ho sakta (beech ke station par hum bache petrol ke saath pahunche the; khaali shuru karna aur bura). To **start = i + 1**, tank = 0.

      Ek pass mein dono: `total` aur `tank`. Aakhir mein total ≥ 0 → aakhri start hi jawab.

      Kadane jaisa lagta hai? Haan — "sum minus hua to reset" wahi soch hai.

      > [!galti]
      > Har station se poora chakkar simulate kiya → O(n²). n = 10⁵ par TLE.
    dryRun: |
      | i | gas − cost | tank | Faisla |
      |---|---|---|---|
      | 0 | −1 | −1 | reset, start = 1 |
      | 1 | −1 | −1 | reset, start = 2 |
      | 2 | −1 | −1 | reset, start = 3 |
      | 3 | +4 | 4 | |
      | 4 | +1 | 5 | total = 2 ≥ 0 → **3** |
    viz: { tracer: gasTrace }
    code: ex2-gas-station
    complexity:
      time: O(n)
      space: O(1)
      why: "Ek pass; total, tank, start."

  - id: partition-labels
    level: tricky
    title: String ke zyada se zyada tukde (Partition Labels)
    source: { name: Partition Labels, platform: LeetCode, url: "https://leetcode.com/problems/partition-labels/" }
    problem: |
      String ko zyada se zyada tukdon mein kaato ki har letter **sirf ek** tukde mein aaye. Tukdon ke size lautao (order mein).

      Example: `"abacdcdeffe"` → **[3, 4, 4]** ("aba", "cdcd", "effe")
    intuition: |
      Letter `x` agar tukde mein hai to tukda kam se kam x ke **aakhri index** tak jaana chahiye.

      1. Pehla pass: `last[letter]` = aakhri index.
      2. Doosra pass: `end = max(end, last[s[i]])`. Jab `i == end` → is tukde ke saare letters khatam → **kaato** (jitna jaldi kaato utne zyada tukde).

      Ye asal mein intervals hain: har letter ka `[pehla, aakhri]` interval, aur takraane wale merge — par end ka running max kaafi, sort ki zaroorat nahi (letters pehle se order mein).

      > [!galti]
      > Letter dobara dikhte hi kaat diya, ya end sirf pehle letter ka liya — beech wale letters ka aakhri baad mein ho sakta hai (`"abab"` ek hi tukda).
    dryRun: |
      | i | letter | last | end | Kaato? |
      |---|---|---|---|---|
      | 0 | a | 2 | 2 | |
      | 1 | b | 1 | 2 | |
      | 2 | a | 2 | 2 | i = end → **3** |
      | 3–6 | c, d, c, d | 5, 6 | 6 | i = 6 → **4** |
      | 7–10 | e, f, f, e | 10, 9 | 10 | i = 10 → **4** |
    viz: { tracer: partitionTrace }
    code: ex3-partition-labels
    complexity:
      time: O(n)
      space: O(1)
      why: "Do pass; last[] 26 size ka."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "'Best pair i < j' (khareed pehle, bech baad) — running min / max."
    - "Kai baar ki ijaazat aur koi fee nahi — har chhota fayda jodo."
    - "Gol (circular) safar / balance kabhi minus nahi hona chahiye — total + reset."
    - "Letters / items ka 'pehla aur aakhri' — running end se tukde."
  avoid:
    - "Stock mein transaction fee, cooldown ya 'max k saude' → DP (state machine)."
    - "Tukde kaatne mein koi cost / weight → DP."
    - "Pehle sab data nahi milta aur peeche mudna padta hai — greedy saboot dobara socho."
  signals:
    - keyword: "buy once sell once / max difference i < j"
      think: "Running min, ek pass."
    - keyword: "unlimited transactions"
      think: "Har positive din-ka-farak jodo."
    - keyword: "circular route / kahan se start"
      think: "Total check + tank reset (Gas Station)."
    - keyword: "partition so each letter in one part"
      think: "last[] + running end, i == end par kaato."

