# 10. Common galtiyan & edge cases
mistakes:
  - title: "Stock I mein max − min"
    type: logic
    wrong: |
      `prices.max() - prices.min()` — min baad mein ho to galat (bechne ke baad khareed nahi sakte).
    right: |
      Running min: har din sirf PICHHLE minimum se compare.
  - title: "Gas station mein total check bhool gaye"
    type: logic
    wrong: |
      Sirf start lauta diya — kul petrol kam ho tab bhi koi index aa gaya.
    right: |
      `if (total < 0) return -1`.
  - title: "Gas station: start = n"
    type: off-by-one
    wrong: |
      Aakhri station par reset hua → start = n (bahar) — par total ≥ 0 ho hi nahi sakta tab.
    right: |
      Total check pehle; total ≥ 0 hai to start < n guaranteed. Phir bhi samajh ke likho.
  - title: "Ek din ka array"
    type: empty
    wrong: |
      `prices[1]` padha bina check — n = 1 par crash.
    right: |
      Loop `1 until n` khud hi khaali; n = 1 → munafa 0.
  - title: "Partition mein last[] ki jagah pehla index"
    type: logic
    wrong: |
      `first[letter]` se end bana diya — tukda chhota kat gaya, letter do tukdon mein.
    right: |
      Aakhri index; `end = max(end, last[s[i]])`.
  - title: "Two city: sort key galat"
    type: logic
    wrong: |
      Sirf `a` (city A ka kharcha) se sort — farak ignore.
    right: |
      `a − b` se sort; jitna chhota utna A ke liye behtar.

# 11. Interview corner
interview:
  questions:
    - q: "Stock I aur Stock II mein farak, aur dono ka approach?"
      a: |
        I: ek sauda — running min, best = max(aaj − min). II: unlimited — har positive farak jodo. Dono O(n), O(1).
    - q: "Stock II ka greedy sahi kyun?"
      a: |
        Kisi bhi sauda (a se b) ka munafa = beech ke rozana farak ka jod. Negative din chhodne se jod badhta hi hai. To saare positive farak = max.
    - q: "Gas Station mein 'start = i + 1' kyun?"
      a: |
        s se i tak har beech wale station par hum tank ≥ 0 ke saath pahunche the. Wahan se khaali shuru karna aur kam petrol = i ke aage nahi jaayega. To poora range rad.
    - q: "Gas Station mein total ≥ 0 hai to jawab hai — kyun?"
      a: |
        Aakhri reset ke baad wala hissa tank ≥ 0 ke saath end tak jaata hai, aur pehle ke hisson ki kami (negative) ko total ≥ 0 hone se ye bacha petrol cover kar leta hai.
    - q: "Partition Labels ko intervals ki tarah samjhao."
      a: |
        Har letter ka [pehla, aakhri] interval. Overlapping merge karo — merged intervals ke size jawab. Running end wahi merge hai bina sort ke.
    - q: "Stock with cooldown / fee / k transactions?"
      a: |
        Greedy nahi chalta — DP states (hold / not hold / cooldown). Fee mein bhi DP (ya modified greedy).
    - q: "Jump Game / Gas Station / Kadane mein common kya hai?"
      a: |
        Ek running value, aur "ye fail hua to pichhla sab rad, aage se shuru" ka niyam. O(n), O(1).
    - q: "Candy problem (ratings) ka greedy?"
      followUp: true
      a: |
        Do pass: baayein se (bada rating → pichhle + 1), daayein se (max(apna, agle + 1)). Ek pass ek hi taraf ka niyam pakadta hai.
    - q: "Queue Reconstruction by Height?"
      followUp: true
      a: |
        Lambe pehle (height desc, k asc) sort; har insaan ko index k par insert. Chhote baad mein aate hain, lambon ki ginti nahi badalte.
  mayAsk:
    - "Best Time to Buy and Sell Stock with Transaction Fee."
    - "Candy."
    - "Queue Reconstruction by Height."
    - "Maximum Subarray (Kadane)."

