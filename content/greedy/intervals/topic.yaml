# 13. Quick revision
revision:
  summary:
    - "Intervals = sort + sweep. n² jodiyon ki jagah O(n log n)."
    - "Merge: start se sort, last.end = max(last.end, cur.end)."
    - "Max non-overlapping / min removals: END se sort (activity selection)."
    - "Ek saath kitne: starts aur ends alag sort, do pointers (ya end times ka min-heap)."
    - "End par chhoona takraav hai ya nahi — sawaal se tay karo (< vs ≤)."
  cheatsheet: |
    ```kotlin
    // merge
    iv.sortBy { it[0] }
    for (c in iv) if (out.isEmpty() || c[0] > out.last()[1]) out.add(intArrayOf(c[0], c[1]))
                  else out.last()[1] = maxOf(out.last()[1], c[1])
    // activity selection
    iv.sortBy { it[1] }; var end = Int.MIN_VALUE
    for (c in iv) if (c[0] >= end) { keep++; end = c[1] }
    // rooms / platforms: arr.sort(); dep.sort(); i/j pointers, now++ / now--
    ```
  quiz:
    - q: "Merge Intervals se pehle kis key par sort?"
      options: ["End", "Start", "Length", "Sort nahi chahiye"]
      answer: 1
      explain: "Start se — takraane wale agal-bagal aate hain."
    - q: "Zyada se zyada non-overlapping intervals chunne ke liye sort?"
      options: ["Start se", "End se", "Length se", "Random"]
      answer: 1
      explain: "Jaldi khatam hone wala pehle — aage ke liye sabse zyada jagah."
    - q: "[1, 10] aur [2, 3] merge. last.end = ?"
      options: ["3", "10", "2", "13"]
      answer: 1
      explain: "max(10, 3) = 10 — andar wala interval end nahi ghatata."
    - q: "Trains: aana [9, 9, 10], jaana [10, 11, 12] (barabar = naya platform). Platforms?"
      options: ["1", "2", "3", "4"]
      answer: 2
      explain: "9, 9 aaye (2); 10 aana ≤ 10 jaana → pehle aana → 3."
    - q: "Insert Interval (list pehle se sorted) ki time complexity?"
      options: ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
      answer: 1
      explain: "Ek pass — teen hisse, sort dobara nahi."

