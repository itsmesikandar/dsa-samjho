# 10. Common galtiyan & edge cases
mistakes:
  - title: "Galat key se sort"
    type: logic
    wrong: |
      Max non-overlapping ke liye start se sort.
    right: |
      Chunna → end se. Jodna → start se. Socho: greedy kaunsi cheez bachana chahta hai?
  - title: "End par chhoona — takraav ya nahi?"
    type: off-by-one
    wrong: |
      Har jagah `<` (ya har jagah `≤`) likh diya bina sawaal padhe.
    right: |
      Merge (LC 56): `[1,4]`, `[4,5]` milte hain → `>` par hi naya. Meetings / LC 435: `[1,2]`, `[2,3]` theek. Platforms: barabar par bhi naya platform.
  - title: "Merge mein max bhool gaye"
    type: logic
    wrong: |
      `last.end = cur.end` — andar wala interval end ghata deta hai.
    right: |
      `last.end = maxOf(last.end, cur.end)`.
  - title: "Khaali input"
    type: empty
    wrong: |
      `intervals[0]` padha bina check — khaali list par crash.
    right: |
      Khaali → khaali output / true / 0. Loop 1 se shuru ho to n = 0, 1 dono ka dhyaan.
  - title: "Comparator mein overflow"
    type: overflow
    wrong: |
      `(a, b) -> a[0] - b[0]` — bade negative / positive values par overflow, galat order.
    right: |
      `Comparator.comparingInt(...)` / `Integer.compare` / Kotlin `sortBy { it[0] }`.
  - title: "Output mein input ka array hi daal diya"
    type: other
    wrong: |
      `out.add(cur)` aur phir `last[1] = …` — input ka interval bhi badal gaya (same array object).
    right: |
      Naya array banao (`intArrayOf(cur[0], cur[1])`) agar input baad mein chahiye.

# 11. Interview corner
interview:
  questions:
    - q: "Merge Intervals kaise? Complexity?"
      a: |
        Start se sort; output ke aakhri se compare: takraaya to end = max, warna naya. O(n log n) time, O(n) output.
    - q: "Do intervals takraate hain — condition?"
      a: |
        [a, b] aur [c, d]: a ≤ d aur c ≤ b (closed). Ulta socho: nahi takraate jab b < c ya d < a.
    - q: "Activity selection mein end se sort kyun?"
      a: |
        Jaldi khatam hone wala sabse kam time gherta hai — exchange argument: kisi optimal ka pehla interval isse badlo, baaki fit rehte hain.
    - q: "Meeting Rooms II (kitne rooms) ke do tareeke?"
      a: |
        (1) Starts aur ends alag sort, do pointers — max ek saath. (2) Start se sort, min-heap of end times; nayi meeting par heap top ≤ start to poll; heap size = rooms.
    - q: "Insert Interval ko sort ke bina kaise?"
      a: |
        List pehle se sorted: pehle khatam wale copy, takraane wale merge (min start, max end), baaki copy. O(n).
    - q: "Minimum Arrows to Burst Balloons?"
      a: |
        End se sort; arrow pehle balloon ke end par; jo balloon us arrow se shuru hone se pehle hai (start ≤ arrow) wo phoot gaya; warna naya arrow uske end par.
    - q: "Interval List Intersections (do sorted lists)?"
      a: |
        Do pointers: intersection = [max(starts), min(ends)] agar valid. Jiska end chhota, uska pointer aage. O(m + n).
    - q: "Har pal kitne intervals — bahut saare queries?"
      followUp: true
      a: |
        Difference array: start par +1, end + 1 par -1, prefix sum. Time range chhoti ho to O(range + n).
    - q: "Weighted interval scheduling?"
      followUp: true
      a: |
        Har interval ki value alag → greedy fail. End se sort, dp[i] = max(dp[i-1], value[i] + dp[pichhla na takraane wala]) — binary search se pichhla dhoondho. O(n log n).
  mayAsk:
    - "Meeting Rooms II."
    - "Minimum Number of Arrows to Burst Balloons."
    - "Interval List Intersections."
    - "Employee Free Time."

