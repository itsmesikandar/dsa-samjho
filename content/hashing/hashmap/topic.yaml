    level: easy
    pattern: 2 maps (dono taraf)
    hint: "Example 2. Ya ek trick: dono strings mein har char ki pehli position ka index compare karo."
  - name: Subarray Sum Equals K
    platform: LeetCode
    num: 560
    url: "https://leetcode.com/problems/subarray-sum-equals-k/"
