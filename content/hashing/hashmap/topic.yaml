    hint: "Example 3 — count[0] = 1 mat bhoolna."
  - name: Contains Duplicate II
    platform: LeetCode
    num: 219
    url: "https://leetcode.com/problems/contains-duplicate-ii/"
    level: easy
    pattern: Value → last index
    hint: "Har x par last index dekho: i − last ≤ k? Phir last index update."
  - name: Continuous Subarray Sum
    platform: LeetCode
    num: 523
    url: "https://leetcode.com/problems/continuous-subarray-sum/"
    level: medium
    pattern: Prefix % k + first index map
    hint: "2 prefixes ka remainder (% k) same aur distance ≥ 2 → beech ka sum k ka multiple. map[0] = -1 se shuru."
  - name: Longest Substring Without Repeating Characters
    platform: LeetCode
    num: 3
    url: "https://leetcode.com/problems/longest-substring-without-repeating-characters/"
    level: medium
    pattern: Map (char → last index) + window
    hint: "Char repeat ho to window ka start = max(start, lastIndex + 1). Har step length update."
  - name: Count of Range Sum
    platform: LeetCode
    num: 327
    url: "https://leetcode.com/problems/count-of-range-sum/"
    level: hard
    pattern: Prefix sums + sorted counting
    hint: "Subarray-k ka bada bhai — exact k ki jagah range [lower, upper]. HashMap kaafi nahi; merge sort se count karo."
  - name: Subarrays with K Different Integers
    platform: LeetCode
    num: 992
    url: "https://leetcode.com/problems/subarrays-with-k-different-integers/"
    level: hard
    pattern: Count map + window, exactly(K) = atMost(K) − atMost(K − 1)
    hint: "atMost(k) sliding window + frequency map se. Phir 2 baar call karke ghatao."

# 13. Quick revision
revision:
  summary:
    - "HashMap = key → value, put/get/containsKey average O(1)."
    - "Same key dobara put = value replace."
    - "Patterns: complement lookup, counting, mapping, prefix + map."
    - "Two Sum: pehle check (target − x), phir store x."
    - "Subarray sum k: count[0] = 1, ans += count[pre − k]."
  cheatsheet: |
    ```kotlin
    // count
    m[k] = m.getOrDefault(k, 0) + 1
    // group
    m.getOrPut(k) { mutableListOf() }.add(x)
    // complement
    val j = m[target - x]; if (j != null) ...; m[x] = i
    // prefix + map
    cnt[0] = 1; pre += x; ans += cnt.getOrDefault(pre - k, 0); cnt[pre] = cnt.getOrDefault(pre, 0) + 1
    ```
  quiz:
    - q: "`m[\"a\"] = 1; m[\"a\"] = 5` ke baad `m.size`?"
      options: ["2", "1", "0", "Error"]
      answer: 1
      explain: "Same key — value replace hoti hai."
    - q: "Two Sum (unsorted) ki best time complexity?"
      options: ["O(n²)", "O(n log n)", "O(n)", "O(1)"]
      answer: 2
      explain: "HashMap complement lookup — ek pass."
    - q: "Subarray sum equals k mein `count[0] = 1` kyun?"
      options: ["Speed ke liye", "Index 0 se shuru hone wale subarrays count karne ke liye", "Negative numbers ke liye", "Zaroori nahi"]
      answer: 1
      explain: "pre − k = 0 tab hota hai jab poora prefix hi k ho."
    - q: "Keys sorted order mein chahiye. Kaunsa?"
      options: ["HashMap", "LinkedHashMap", "TreeMap", "HashSet"]
      answer: 2
      explain: "TreeMap — O(log n) operations, sorted keys."
    - q: "Kotlin `val v = m[k]` ka type (m: HashMap<String, Int>)?"
      options: ["Int", "Int?", "String", "Any"]
      answer: 1
      explain: "Key na ho to null — isliye nullable."

