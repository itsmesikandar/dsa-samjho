meta:
  id: hashmap
  chapter: hashing
  title: HashMap
  subtitle: Key se value — O(1) mein. "Pehle dekha hai?" wale har sawaal ka tool
  level: beginner
  minutes: 35
  prereqs: [hashing-internals, kotlin-java-toolkit]
  tags: [hashmap, key-value, two-sum, prefix-sum]

# 1. Ye kya hai?
what:
  body: |
    **HashMap** = **key → value** ka collection. Har key unique hoti hai, aur key se uski value **average O(1)** mein milti hai.

    ```kotlin
    val price = HashMap<String, Int>()
    price["chai"] = 15          // put
    println(price["chai"])      // get -> 15
    println("samosa" in price)  // containsKey -> false
    ```

    | Kaam | Kotlin | Java |
    |---|---|---|
    | Daalna / badalna | `m[k] = v` | `m.put(k, v)` |
    | Padhna | `m[k]` (na ho to null) | `m.get(k)` |
    | Default ke saath | `m.getOrDefault(k, 0)` | `m.getOrDefault(k, 0)` |
    | Hai kya? | `k in m` | `m.containsKey(k)` |
    | Hatana | `m.remove(k)` | `m.remove(k)` |

    > [!yaad]
    > Same key dobara `put` karo to **nayi entry nahi banti** — purani value replace ho jaati hai.
  analogy: |
    **Railway reservation ka PNR number** socho. PNR (key) batao, aur turant tumhari ticket details (value) aa jaati hain — system saari tickets ek-ek karke nahi dekhta.

    Ya **phone ka contact list search** — naam (key) se number (value). HashMap yahi hai, bas bahut tez.

# 2. Kyun chahiye?
why:
  body: |
    Bahut saare problems ka brute force O(n²) hota hai kyunki har item ke liye poore array mein uska "pair" ya "pehle wala" dhoondhte hain. HashMap us andar wale loop ko **O(1) lookup** se badal deta hai → **O(n)**.

    HashMap ke 4 classic patterns:
    1. **Complement lookup** — "target − x pehle dekha?" (Two Sum)
    2. **Counting** — "kitni baar aaya?" (frequency)
    3. **Mapping / rishta** — "is char ka pair kaun?" (isomorphic, anagram groups)
    4. **Prefix + map** — "pehle kitne prefix aise the?" (subarray sum = k)

    > [!socho]
    > Two Sum ka brute force O(n²) hai. HashMap kya "yaad" rakhta hai jo isko O(n) bana deta hai?
    >
    > Ab tak dekhe gaye **numbers aur unke index**. Har naye number par sirf poochna padta hai: "mera pair in yaad mein hai?" — O(1).

# 3. Visual intro
visual:
  body: |
    Phonebook mein ek naam dhoondhna — pehle list mein ek-ek karke (O(n)), phir HashMap se seedha (O(1)).

    Chhoti list mein fark kam lagta hai. Par 10 lakh contacts mein list wala tareeka 10 lakh checks tak le sakta hai, aur HashMap sirf ek.
  viz: { tracer: listVsMap }

# 4. Kaise kaam karta hai
how:
  body: |
    HashMap ke basic operations — har ek average **O(1)**:
    - `put` — key ke bucket mein entry (key pehle se ho to value replace).
    - `get` — key ke bucket se value (na ho to `null`).
    - `getOrDefault` — na ho to default (counting mein bahut kaam ka).
    - `containsKey`, `remove`, `size`.

    > [!galti]
    > Kotlin mein `m[k]` ka type `Int?` hai (nullable). `m[k] + 1` compile nahi hoga — `(m[k] ?: 0) + 1` ya `getOrDefault` likho. `m[k]!!` key na ho to crash karega.
  viz: { tracer: phoneTrace }
  code: how

# 5. Operations table
operations:
  - op: "`put(k, v)` / `m[k] = v`"
    time: "O(1) average"
    space: O(1)
    why: "Hash se bucket, chhoti chain."
  - op: "`get(k)` / `containsKey(k)` / `remove(k)`"
    time: "O(1) average"
    space: O(1)
    why: "Sirf ek bucket dekhna."
  - op: "`containsValue(v)`"
    time: O(n)
    space: O(1)
    why: "Values hashed nahi hain — sab entries dekhni padti hain."
  - op: "Saari entries par loop"
    time: O(n)
    space: O(1)
    why: "Har entry ek baar (plus khaali buckets)."
  - op: "n keys wala map banana"
    time: "O(n) average"
    space: O(n)
    why: "Har put O(1) amortized."
  - op: "Sorted order mein keys"
    time: O(n log n)
    space: O(n)
    why: "HashMap ka order nahi — sort ya TreeMap (O(log n) har op)."

# 6. Code
code:
  - title: Map par loop, max value, aur merge
    file: iterate
    note: |
      `merge(key, value, fn)` — key hai to `fn(purani, nayi)`, nahi hai to seedha nayi value. Counting ke liye Java mein `m.merge(k, 1, Integer::sum)` sabse saaf tareeka hai.

# 7. Examples
examples:
  - id: two-sum
    level: easy
    title: Two Sum — pair jiska sum target ho
    source: { name: Two Sum, platform: LeetCode, url: "https://leetcode.com/problems/two-sum/" }
    problem: |
      Ek array aur `target` diya hai. Do **alag index** dhoondho jinke numbers ka sum `target` ho, aur un indexes ko return karo. Maan lo ek hi answer hai.

      Example: `[2, 7, 11, 15]`, target 9 → `[0, 1]`
    intuition: |
      **Brute force:** har pair → O(n²).

      **HashMap trick:** left se chalo. Har number x par:
      - Pair chahiye = `target − x`. Kya wo **pehle** aa chuka? → map mein dekho (O(1)).
      - Nahi aaya → x aur uska index map mein **yaad** rakh do.

      Pehle check, phir store — taaki ek hi number ko 2 baar use na kar lo (`[3, 3]` jaisa case bhi sahi chalta hai).

      > [!tip]
      > Interview mein ye **sabse pehla** HashMap question hota hai. Brute force → "kya repeat ho raha hai? pair dhoondhna" → HashMap — ye soch bolna zaroori hai.
    dryRun: |
      `[2, 7, 11, 15]`, target 9

      | i | nums[i] | need = 9 − x | seen mein? | seen ke baad |
      |---|---|---|---|---|
      | 0 | 2 | 7 | nahi | {2: 0} |
      | 1 | 7 | 2 | **haan (index 0)** | → [0, 1] |
    viz: { tracer: twoSumTrace }
    code: ex1-two-sum
    complexity:
      time: O(n)
      space: O(n)
      why: "Har number ek baar, map lookup O(1) average; worst case n entries map mein."

  - id: isomorphic
    level: medium
    title: Isomorphic strings — ek-se-ek char mapping
    source: { name: Isomorphic Strings, platform: LeetCode, url: "https://leetcode.com/problems/isomorphic-strings/" }
    problem: |
      2 strings s aur t diye hain. Kya s ke har character ko kisi aur character se **badal ke** t ban sakti hai — is condition ke saath ki ek char hamesha **ek hi** char se badle, aur 2 alag chars **ek hi** char par na jaayein?

      Examples: `"egg"`, `"add"` → true. `"foo"`, `"bar"` → false. `"badc"`, `"baba"` → false.
    intuition: |
      Rishta **dono taraf** se pakka hona chahiye:
      - `s → t` map: `'e' → 'a'`, `'g' → 'd'`. Agar `'g'` baad mein kisi aur se jude → false.
      - `t → s` map: `'a' → 'e'`… Agar t ka koi char 2 alag s-chars se aaye → false.

      Sirf ek map rakha to `"badc"` / `"baba"` galti se true aa jaata — `b → b` aur `d → b` dono s → t mein theek lagte hain, par t ka 'b' do chars (b, d) se aa raha hai.

      > [!galti]
      > Java mein `Character` objects ko `!=` se compare mat karo — wo address compare karta hai. `.charValue()` ya `.equals()` use karo.
    dryRun: |
      `"badc"`, `"baba"`

      | i | s[i] | t[i] | s→t | t→s | OK? |
      |---|---|---|---|---|---|
      | 0 | b | b | b→b | b→b | ✓ |
      | 1 | a | a | a→a | a→a | ✓ |
      | 2 | d | b | d→b (naya) | b pehle b se juda, ab d? | **✗ false** |
    viz: { tracer: isoTrace }
    code: ex2-isomorphic
    complexity:
      time: O(n)
      space: O(1)
      why: "Har char ek baar; maps mein zyada se zyada alphabet size (fixed) entries."

  - id: subarray-k
    level: tricky
    title: Subarray sum equals k — prefix sum + HashMap
    source: { name: Subarray Sum Equals K, platform: LeetCode, url: "https://leetcode.com/problems/subarray-sum-equals-k/" }
    problem: |
      Ek integer array (negative bhi ho sakte hain) aur k diya hai. **Kitne continuous subarrays** ka sum exactly k hai?

      Examples: `[1, 2, 3]`, k = 3 → 2 (`[1, 2]` aur `[3]`). `[1, -1, 1, -1]`, k = 0 → 4.
    intuition: |
      Prefix sum yaad karo: subarray `(i+1..j)` ka sum = `pre[j] − pre[i]`.

      Ye k ho → **`pre[i] = pre[j] − k`**.

      To left se chalte hue har j par poocho: **"ab tak kitne prefix `pre − k` ke barabar the?"** — utne hi subarrays j par khatam ho rahe hain jinka sum k hai. Prefix values ki count HashMap mein.

      Shuruaat mein `count[0] = 1` — "kuch nahi liya" wala prefix, taaki index 0 se shuru hone wale subarrays bhi count kiye jaayein.

      > [!galti]
      > Sliding window yahan **nahi** chalti — negative numbers hain, window badhane se sum ghat bhi sakta hai. Negative dikhe to prefix + map socho.
    dryRun: |
      `[1, 2, 3]`, k = 3, count = {0: 1}

      | x | pre | pre − k | count[pre − k] | ans | count ke baad |
      |---|---|---|---|---|---|
      | 1 | 1 | −2 | 0 | 0 | {0:1, 1:1} |
      | 2 | 3 | 0 | 1 | 1 | {0:1, 1:1, 3:1} |
      | 3 | 6 | 3 | 1 | **2** | {…, 6:1} |
    viz: { tracer: subKTrace }
    code: ex3-subarray-k
    complexity:
      time: O(n)
      space: O(n)
      why: "Ek pass, har step O(1) map kaam; worst case n alag prefix values."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Kisi cheez se jude data ko key se turant nikaalna — id → user, word → count."
    - "Brute force mein andar ka loop sirf **dhoondh** raha hai — use HashMap lookup se hatao."
    - "2 cheezon ka rishta (mapping) banana — isomorphic, anagram groups, graph adjacency."
    - "Prefix sums ke saath \"kitni baar\" count karna — subarray sum k, equal 0s/1s."
  avoid:
    - "Keys sorted chahiye ya \"isse just bada key\" — TreeMap."
    - "Keys chhoti fixed range (0..25, 0..1000) — IntArray tez aur halka."
    - "Bas \"hai ya nahi\" chahiye, value nahi — HashSet saaf hai."
  signals:
    - keyword: "two numbers add up to target (unsorted)"
      think: "HashMap: value → index, complement lookup."
    - keyword: "count of subarrays with sum / xor = k"
      think: "Prefix + HashMap counts, count[0] = 1."
    - keyword: "one-to-one mapping / pattern match"
      think: "2 maps (dono taraf)."
    - keyword: "first / last occurrence index"
      think: "HashMap: value → index (putIfAbsent for first)."

# 9. Real-world
realWorld:
  - where: "Android ViewModel cache / repository"
    how: "userId → User object ka in-memory cache — network call se pehle map mein dekho."
  - where: "Intent / Bundle extras"
    how: "Bundle andar se key → value map hai (`putString(\"name\", ...)`)."
  - where: "JSON parsing"
    how: "JSON object = key → value map; Gson/Moshi parse karke map ya data class banate hain."
  - where: "Analytics events"
    how: "Event ke properties map mein (\"screen\" → \"home\"); counts aggregate karne ke liye HashMap."
  - where: "Compilers / interpreters"
    how: "Symbol table: variable naam → uska type/address — har lookup HashMap se."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Kotlin mein `m[k] + 1` (nullable)"
    type: "null"
    wrong: |
      ```kotlin
      count[c] = count[c] + 1      // compile error: Int? + Int
      count[c] = count[c]!! + 1    // key nahi to crash
      ```
    right: |
      ```kotlin
      count[c] = count.getOrDefault(c, 0) + 1
      ```
  - title: "Two Sum mein pehle store, phir check"
    type: logic
    wrong: |
      x ko map mein daal ke phir `target − x` dhoondha → target = 2x par ek hi index 2 baar use ho gaya (jaise [3], target 6 → [0, 0]).
    right: |
      Pehle check, phir store.
  - title: "Subarray-k mein `count[0] = 1` bhoolna"
    type: off-by-one
    wrong: |
      `[3]`, k = 3 → answer 0 aaya (shuru se shuru hone wala subarray gina hi nahi).
    right: |
      Loop se pehle `count[0] = 1`.
  - title: "HashMap ke order par bharosa"
    type: logic
    wrong: |
      Map print kiya aur test ne specific order expect kiya — kabhi pass, kabhi fail.
    right: |
      Order chahiye to `LinkedHashMap` (insertion) ya `TreeMap` / `toSortedMap()` (sorted).
  - title: "Java mein Integer values ko `==` se compare"
    type: logic
    wrong: |
      `if (m1.get(k) == m2.get(k))` — 127 tak sahi, 128+ par galat (objects).
    right: |
      `Objects.equals(m1.get(k), m2.get(k))` ya `.intValue()` compare.

# 11. Interview corner
interview:
  questions:
    - q: "HashMap ke operations ki complexity?"
      a: |
        put/get/remove/containsKey average O(1), worst O(n) (Java 8+ O(log n)). containsValue O(n). Iterate O(n).
    - q: "Two Sum O(n) mein kaise?"
      a: |
        Map mein value → index. Har x par `target − x` dekho; mila to answer, nahi to x store karo. Ek pass.
    - q: "Agar array sorted ho to Two Sum?"
      followUp: true
      a: |
        Two pointers — O(n) time aur **O(1) space**, HashMap ki zaroorat nahi.
    - q: "HashMap, LinkedHashMap aur TreeMap mein fark?"
      a: |
        HashMap — koi order nahi, O(1). LinkedHashMap — insertion (ya access) order yaad, O(1), thodi zyada memory. TreeMap — keys sorted, O(log n), floor/ceiling queries.
    - q: "Subarray sum equals k mein sliding window kyun nahi?"
      a: |
        Negative numbers par window ka sum monotonic nahi hota — badhane par ghat bhi sakta hai, to shrink/expand ka decision galat ho jaata hai. Prefix + map har case chalta hai.
    - q: "`getOrDefault` aur `computeIfAbsent` mein kya fark hai?"
      a: |
        getOrDefault sirf padhta hai (map nahi badalta). computeIfAbsent key na ho to value **bana ke daal deta hai** aur return karta hai — grouping (list per key) ke liye.
    - q: "Map ko value ke hisaab se sort kaise karoge?"
      a: |
        Entries ki list banao aur value se sort: Kotlin `map.entries.sortedBy { it.value }`, Java `list.sort(Map.Entry.comparingByValue())`. O(n log n).
    - q: "HashMap mein iterate karte hue remove kar sakte ho?"
      followUp: true
      a: |
        Seedha `map.remove` loop ke andar → ConcurrentModificationException. Iterator ka `remove()`, ya `entries.removeIf { }` / `keys.removeAll { }`.
    - q: "Bahut bade input par HashMap slow kyun ho sakta hai?"
      a: |
        Har entry ek object (boxing + node) → memory aur GC; rehashing; kharab hash par collisions. Keys chhote integers hon to IntArray ya specialized maps better.
  mayAsk:
    - "Longest substring without repeating characters (map: char → last index)."
    - "Group anagrams."
    - "Kisi array mein do aise indices jinke values same aur distance ≤ k (Contains Duplicate II)."
    - "LRU cache design."

