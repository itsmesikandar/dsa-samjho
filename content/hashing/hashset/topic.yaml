  - name: Contains Duplicate III
    platform: LeetCode
    num: 220
    url: "https://leetcode.com/problems/contains-duplicate-iii/"
    level: hard
    pattern: TreeSet window (ceiling)
    hint: "Size k ki window ka TreeSet; har x par `ceiling(x − valueDiff)` ≤ x + valueDiff? Window se purana hatao."
  - name: First Missing Positive
    platform: LeetCode
    num: 41
    url: "https://leetcode.com/problems/first-missing-positive/"
    level: hard
    pattern: Set → O(1) space index marking
    hint: "Set se aasaan (1 se count jab tak set mein ho). O(1) space ke liye array ko hi set bana do — value v ko index v−1 par bhejo."

# 13. Quick revision
revision:
  summary:
    - "HashSet = unique items; add/contains/remove average O(1)."
    - "add() false = pehle se tha — duplicate check ek line mein."
    - "Andar se HashMap (items = keys)."
    - "LinkedHashSet = insertion order; TreeSet = sorted + floor/ceiling (O(log n))."
    - "Patterns: dedupe, seen/visited, cycle, intersection, consecutive-start trick."
  cheatsheet: |
    | Kaam | Kotlin | Java |
    |---|---|---|
    | Banana | `hashSetOf()`, `list.toHashSet()` | `new HashSet<>(list)` |
    | Duplicate? | `if (!s.add(x))` | `if (!s.add(x))` |
    | Common | `a intersect b` | `copy.retainAll(b)` |
    | Sab | `a union b` | `copy.addAll(b)` |
    | Sirf a | `a - b` | `copy.removeAll(b)` |
    | Sorted / nearest | `TreeSet`, `ceiling`, `floor` | same |
  quiz:
    - q: "`set.add(7)` jab 7 pehle se ho — return?"
      options: ["true", "false", "Exception", "7"]
      answer: 1
      explain: "Kuch nahi badla — false."
    - q: "List mein duplicates hatane ka sabse aasaan tareeka (order zaroori nahi)?"
      options: ["Sort", "list.toSet()", "Nested loop", "Reverse"]
      answer: 1
      explain: "Set mein convert — O(n)."
    - q: "Keys sorted chahiye aur \"x se just bada\" bhi?"
      options: ["HashSet", "LinkedHashSet", "TreeSet", "ArrayList"]
      answer: 2
      explain: "TreeSet ceiling/higher."
    - q: "Longest consecutive mein count kab shuru karte hain?"
      options: ["Har number se", "Jab x + 1 set mein na ho", "Jab x − 1 set mein na ho", "Sirf sabse chhote se"]
      answer: 2
      explain: "x − 1 nahi = x sequence ki shuruaat."
    - q: "Values 0..10⁵ hain aur sirf visited chahiye. Sabse halka?"
      options: ["HashSet<Int>", "BooleanArray", "TreeSet", "HashMap<Int, Boolean>"]
      answer: 1
      explain: "Dense chhoti range — array index hi set hai."

