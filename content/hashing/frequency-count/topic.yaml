meta:
  id: frequency-count
  chapter: hashing
  title: Frequency Counting
  subtitle: 'Kaun kitni baar aaya? — anagrams, top-k, majority sab isi se'
  level: beginner
  minutes: 30
  prereqs: [hashmap, strings]
  tags: [frequency, counting, anagram, bucket-sort, top-k]

# 1. Ye kya hai?
what:
  body: |
    **Frequency counting** = har cheez ki **count** rakhna: kaunsa number / letter / word kitni baar aaya.

    2 tareeke:
    | Kab | Kya use karo | Kyun |
    |---|---|---|
    | Sirf `'a'..'z'` (ya chhoti fixed range) | `IntArray(26)`, index = `c − 'a'` | Sabse tez, koi hashing nahi |
    | Kuch bhi (numbers, words, objects) | `HashMap<T, Int>` | Koi bhi key |

    ```kotlin
    val count = IntArray(26)
    for (c in "banana") count[c - 'a']++   // a=3, b=1, n=2
    ```

    Ek baar count ho gayi, phir bahut saare sawaal turant: sabse zyada kaun? sirf ek baar kaun? 2 strings mein letters same?

    > [!yaad]
    > Counting **ek pass** (O(n)) hai. Uske baad jo bhi sawaal ho, often counts se O(1) ya O(26) mein jawab.
  analogy: |
    **Election ki vote counting** socho. Har ballot padho aur candidate ke naam ke aage ek tally mark lagao. Saare ballot ek baar padhne ke baad — kaun jeeta, kisko kitne mile, sab ek nazar mein.

    Ya **kirane ki dukaan ka stock register** — har item kitna bacha, ek line mein.

# 2. Kyun chahiye?
why:
  body: |
    Bahut saare string aur array problems asal mein **count** ke sawaal hain:
    - Anagram? → dono ki letter counts same?
    - First unique character? → count == 1 wala pehla.
    - Majority element? → count > n/2.
    - Top K frequent? → counts ko frequency se order karo.
    - Ransom note bana sakte ho? → magazine mein har letter kaafi hai?

    Bina counting ke ye often O(n²) ho jaate hain (har item ke liye poora array count karna). Counting se **O(n)**.

    > [!socho]
    > 2 strings anagram hain ya nahi — sort karke compare karna O(n log n). Counting se?
    >
    > `IntArray(26)`: pehli string +1, doosri −1. Sab 0 → anagram. **O(n)** aur O(1) extra space.

# 3. Visual intro
visual:
  body: |
    Election ki count ka animation — har vote par us candidate ka count badhta hai. Aakhir mein jeetne wala ek nazar mein.

    "Apna input try karo" mein apne votes daalo (A–E).
  viz: { tracer: electionTally }

# 4. Kaise kaam karta hai
how:
  body: |
    Lowercase letters ke liye **`IntArray(26)`** sabse best:
    - `'a'` ka code 97, `'b'` ka 98… to `c − 'a'` = 0..25 — seedha array index.
    - Har character par `count[c − 'a']++`.

    Ek hi pass, koi hashing nahi, koi boxing nahi.

    > [!galti]
    > Input mein uppercase, digits ya space bhi ho sakte hain? Tab `c − 'a'` negative ya 25 se bada → crash. Pehle constraints padho; zaroorat ho to `IntArray(128)` (saare ASCII) ya HashMap.
  viz: { tracer: letterCountTrace }
  code: how

# 5. Operations table
operations:
  - op: "IntArray(26) se count"
    time: O(n)
    space: O(1)
    why: "Har char ek baar; 26 dabbe fixed."
  - op: "HashMap se count"
    time: "O(n) average"
    space: O(k)
    why: "k = alag items; har update O(1) average."
  - op: "2 strings ke counts compare (26 letters)"
    time: O(26) = O(1)
    space: O(1)
    why: "Sirf 26 numbers milane hain."
  - op: "Max frequency item"
    time: O(k)
    space: O(1)
    why: "Counts par ek pass."
  - op: "Top K by frequency (bucket sort)"
    time: O(n)
    space: O(n)
    why: "Frequency 1..n tak hi — usi ko index bana do."
  - op: "Top K by frequency (heap)"
    time: O(n log k)
    space: O(n)
    why: "Har item heap mein O(log k)."

# 6. Code
code:
  - title: Count ke 3 tareeke — IntArray, HashMap, one-liner
    file: styles
    note: |
      Kotlin ka `groupingBy { it }.eachCount()` aur Java ka `Collectors.groupingBy(..., counting())` andar se HashMap hi hai — interview mein manual loop bhi likh paao, ye zaroori hai.

# 7. Examples
examples:
  - id: anagram
    level: easy
    title: Valid anagram
    source: { name: Valid Anagram, platform: LeetCode, url: "https://leetcode.com/problems/valid-anagram/" }
    problem: |
      2 strings s aur t (lowercase) diye hain. Kya t, s ka **anagram** hai — matlab same letters, same count, bas order alag?

      Examples: `"listen"`, `"silent"` → true. `"rat"`, `"car"` → false.
    intuition: |
      Anagram ka matlab hi hai: **har letter ki count dono mein barabar**.

      Ek hi `IntArray(26)`: s ke har letter par +1, t ke har letter par −1. Agar sab barabar hai to aakhir mein **saare 0**.

      Length alag ho to seedha false — shortcut.

      > [!tip]
      > Unicode/emoji strings ho to `IntArray(26)` nahi chalega — HashMap<Char, Int> lo. Interview mein ye follow-up often aata hai.
    dryRun: |
      `"rat"` vs `"car"`

      | Step | +1 (s) | −1 (t) | Non-zero counts |
      |---|---|---|---|
      | i = 0 | r | c | r: 1, c: −1 |
      | i = 1 | a | a | r: 1, c: −1 |
      | i = 2 | t | r | t: 1, c: −1 |
      | End | | | t = 1 ≠ 0 → **false** |
    viz: { tracer: anagramTrace }
    code: ex1-anagram
    complexity:
      time: O(n)
      space: O(1)
      why: "Ek pass + 26 counts check; array fixed size."

  - id: group-anagrams
    level: medium
    title: Group anagrams
    source: { name: Group Anagrams, platform: LeetCode, url: "https://leetcode.com/problems/group-anagrams/" }
    problem: |
      Words ki list hai. Jo words ek doosre ke anagram hain unhe ek group mein rakho.

      Example: `[eat, tea, tan, ate, nat, bat]` → `[[ate, eat, tea], [bat], [nat, tan]]`
    intuition: |
      Grouping = HashMap<key, list>. Sawaal hai **key kya ho** jo saare anagrams ke liye same aaye?

      **Option 1:** letters sort karo — `"eat"`, `"tea"`, `"ate"` → sab `"aet"`.
      **Option 2:** 26 counts ko string bana do (`"1#0#0#…"`) — sort se bhi tez (O(k) per word).

      Phir `getOrPut(key) { mutableListOf() }.add(word)`.

      > [!galti]
      > `CharArray` / `IntArray` ko seedha key mat banao — arrays ka hashCode content se nahi banta! String ya List mein badlo.
    dryRun: |
      | Word | Key (sorted) | Group |
      |---|---|---|
      | eat | aet | [eat] |
      | tea | aet | [eat, tea] |
      | tan | ant | [tan] |
      | ate | aet | [eat, tea, ate] |
      | nat | ant | [tan, nat] |
      | bat | abt | [bat] |
    viz: { tracer: groupAnaTrace }
    code: ex2-group-anagrams
    complexity:
      time: "O(n · k log k)"
      space: "O(n · k)"
      why: "n words, har word sort O(k log k); saare words map mein."

  - id: top-k
    level: tricky
    title: Top K frequent elements — bucket sort se O(n)
    source: { name: Top K Frequent Elements, platform: LeetCode, url: "https://leetcode.com/problems/top-k-frequent-elements/" }
    problem: |
      Ek array aur k diya hai. Sabse zyada baar aane wale **k** numbers return karo. O(n log n) se better chahiye.

      Example: `[1, 1, 1, 2, 2, 3]`, k = 2 → `[1, 2]`
    intuition: |
      Pehle counts nikaalo (HashMap). Ab counts ke hisaab se "top k" chahiye.

      - Sort by count → O(n log n).
      - Min-heap of size k → O(n log k).
      - **Bucket sort → O(n):** koi bhi frequency **1 se n** ke beech hi ho sakti hai. To array banao `bucket[f]` = wo numbers jo exactly f baar aaye. Phir f = n se neeche aate hue k numbers utha lo.

      > [!yaad]
      > Jab values ki **range chhoti aur pata** ho (yahan 1..n), to sort ki jagah unhe hi index bana do — yahi counting/bucket sort ka idea hai.
    dryRun: |
      `[1, 1, 1, 2, 2, 3]`, k = 2

      | Step | Result |
      |---|---|
      | Counts | {1: 3, 2: 2, 3: 1} |
      | Buckets | bucket[3] = [1], bucket[2] = [2], bucket[1] = [3] |
      | f = 6, 5, 4 | khaali |
      | f = 3 | [1] |
      | f = 2 | [1, 2] → k poora |
    viz: { tracer: topKTrace }
    code: ex3-top-k
    complexity:
      time: O(n)
      space: O(n)
      why: "Count O(n), buckets O(n), ek pass upar se neeche."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Sawaal mein \"kitni baar\", \"same characters\", \"most / least frequent\" ho."
    - "Do collections ka content compare karna ho (order chhod ke)."
    - "Har item ke liye check ki kaafi supply hai (ransom note)."
  avoid:
    - "Order bhi matter karta ho (\"same sequence\") — counting order bhool jaati hai."
    - "Range bahut badi aur sparse ho (values 10⁹ tak) — IntArray nahi, HashMap."
    - "Sirf yes/no chahiye ki hai ya nahi — set kaafi hai."
  signals:
    - keyword: "anagram / permutation of string"
      think: "IntArray(26) counts compare."
    - keyword: "only lowercase letters"
      think: "IntArray(26), c − 'a'."
    - keyword: "k most frequent"
      think: "Count map + bucket sort (O(n)) ya min-heap (O(n log k))."
    - keyword: "majority element (> n/2)"
      think: "Count map, ya Boyer–Moore voting (O(1) space)."

# 9. Real-world
realWorld:
  - where: "Trending hashtags / search terms"
    how: "Har term ki count, phir top-k — Twitter/Instagram trends isi idea par (bade scale par approximate counting)."
  - where: "Analytics dashboards"
    how: "Screen views, button clicks — event naam → count; sabse zyada use hone wale features."
  - where: "Keyboard suggestions"
    how: "Kaunse words zyada type hote hain uski count — suggestions ka order."
  - where: "Compression (Huffman coding)"
    how: "Har character ki frequency se chhote codes — zyada aane wale char ko chhota code."
  - where: "Spam / fraud detection"
    how: "Kisi IP ya user se aane wali requests ki count — limit cross to block (rate limiting)."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "`c − 'a'` uppercase/space par"
    type: logic
    wrong: |
      Input mein 'A' ya ' ' aaya → index −32 ya −65 → ArrayIndexOutOfBoundsException.
    right: |
      Constraints check karo; zaroorat ho to `lowercase()` pehle, ya `IntArray(128)`, ya HashMap.
  - title: "Array ko HashMap key banana"
    type: logic
    wrong: |
      ```kotlin
      val key = w.toCharArray().apply { sort() }
      groups[key] = ...   // CharArray ka hashCode content se nahi -> har baar alag key
      ```
    right: |
      `String(chars)` ya `chars.joinToString("")` ko key banao.
  - title: "Length check bhoolna (anagram)"
    type: logic
    wrong: |
      "ab" aur "abb": +1/−1 loop sirf chhoti length tak chala → galat true.
    right: |
      Pehle `if (s.length != t.length) return false`.
  - title: "Kotlin nullable count"
    type: "null"
    wrong: |
      `map[x] = map[x]!! + 1` — pehli baar crash.
    right: |
      `map[x] = map.getOrDefault(x, 0) + 1` (Java: `merge(x, 1, Integer::sum)`).
  - title: "Top-k mein ties ka order"
    type: other
    right: |
      2 numbers ki frequency barabar ho to kaunsa pehle? Question/interviewer se poocho. Test deterministic chahiye to bucket ke andar sort karo.

# 11. Interview corner
interview:
  questions:
    - q: "Anagram check ka best tareeka?"
      a: |
        Length same check, phir IntArray(26) — s se +1, t se −1, sab 0? O(n) time, O(1) space. Unicode ho to HashMap.
    - q: "IntArray(26) aur HashMap — kab kya?"
      a: |
        Keys chhoti fixed range (letters, digits) → array: tez, kam memory. Keys arbitrary (words, bade numbers) → HashMap.
    - q: "Top K frequent ki complexity options?"
      a: |
        Sort O(n log n); min-heap size k O(n log k); bucket sort O(n) (frequency 1..n). Quickselect bhi average O(n).
    - q: "Group anagrams mein key kya rakhoge?"
      followUp: true
      a: |
        Sorted string (O(k log k)) ya 26-count signature string (O(k)). Array ko seedha key nahi — uska hash content se nahi banta.
    - q: "Majority element (> n/2) O(1) space mein?"
      followUp: true
      a: |
        Boyer–Moore voting: candidate aur count. Same mile to +1, alag to −1; count 0 ho to naya candidate. Majority hamesha bachta hai.
    - q: "First unique character kaise dhoondhoge?"
      a: |
        Pehle pass mein counts, doosre pass mein string ke order mein pehla jiska count 1. O(n).
    - q: "Ransom note — magazine se bana sakte ho?"
      a: |
        Magazine ke letters count karo; note ke har letter par count−−; kabhi negative → false.
    - q: "Bahut bade stream mein top-k (memory kam)?"
      a: |
        Exact ke liye heap of size k + counts map (map bada ho sakta hai). Approximate: Count-Min Sketch / Misra–Gries — kam memory mein heavy hitters.
    - q: "Sort characters by frequency kaise?"
      a: |
        Counts → bucket by frequency (ya sort entries) → har char ko count baar StringBuilder mein. O(n) bucket se.
  mayAsk:
    - "Find all anagrams of p in s (sliding window + counts)."
    - "Minimum steps to make two strings anagram."
    - "Can you form a palindrome from these letters? (at most one odd count)"
    - "Majority element II (> n/3)."

