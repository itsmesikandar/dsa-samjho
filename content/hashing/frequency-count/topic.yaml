# 13. Quick revision
revision:
  summary:
    - "Frequency counting = har item ki count, ek pass O(n)."
    - "Lowercase letters → IntArray(26), index c − 'a'; baaki → HashMap."
    - "Anagram: +1 / −1, aakhir mein sab 0."
    - "Grouping key: sorted string ya count signature (array seedha key nahi)."
    - "Top K: bucket[frequency] → O(n)."
  cheatsheet: |
    ```kotlin
    val cnt = IntArray(26); for (c in s) cnt[c - 'a']++
    val m = HashMap<Int, Int>(); for (x in a) m[x] = m.getOrDefault(x, 0) + 1
    // anagram
    for (i in s.indices) { cnt[s[i]-'a']++; cnt[t[i]-'a']-- }; cnt.all { it == 0 }
    // top k
    val bucket = Array(n + 1) { mutableListOf<Int>() }; for ((x, f) in m) bucket[f].add(x)
    ```
  quiz:
    - q: "\"aabbc\" ke liye IntArray(26) mein count['b' − 'a']?"
      options: ["1", "2", "3", "0"]
      answer: 1
      explain: "b 2 baar aaya."
    - q: "2 strings anagram hain — counting approach ki space complexity (lowercase)?"
      options: ["O(n)", "O(1)", "O(n log n)", "O(26n)"]
      answer: 1
      explain: "26 fixed dabbe."
    - q: "Group anagrams mein key ke liye kya galat hai?"
      options: ["Sorted string", "Count signature string", "Seedha CharArray", "List<Char>"]
      answer: 2
      explain: "Array ka hashCode content se nahi banta."
    - q: "Top K frequent bucket sort mein bucket array ki size?"
      options: ["k", "26", "n + 1", "max value"]
      answer: 2
      explain: "Frequency 0..n."
    - q: "Input mein uppercase bhi hai. `c − 'a'` index safe hai?"
      options: ["Haan", "Nahi — negative ho sakta hai", "Sirf Java mein", "Sirf Kotlin mein"]
      answer: 1
      explain: "'A' − 'a' = −32."

