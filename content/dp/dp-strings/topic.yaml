# 13. Quick revision
revision:
  summary:
    - "Do strings → dp[i][j] prefixes par; (m+1) × (n+1), row / col 0 = khaali string."
    - "Aakhri chars dekho: same → tirchha; alag → upar / baayein (/ tirchha) mein best."
    - "LCS: match + 1, warna max. Substring: match + 1, warna 0, jawab table ka max."
    - "Edit distance: 1 + min(delete ↑, insert ←, replace ↖); base dp[i][0] = i, dp[0][j] = j."
    - "Ek string ke tukde (palindrome) → dp[i][j] on s[i..j], length badhate jao."
  cheatsheet: |
    ```kotlin
    // LCS
    dp[i][j] = if (a[i-1] == b[j-1]) dp[i-1][j-1] + 1 else maxOf(dp[i-1][j], dp[i][j-1])
    // common substring (jawab = table ka max)
    dp[i][j] = if (a[i-1] == b[j-1]) dp[i-1][j-1] + 1 else 0
    // edit distance (base: dp[i][0] = i, dp[0][j] = j)
    dp[i][j] = if (a[i-1] == b[j-1]) dp[i-1][j-1] else 1 + minOf(dp[i-1][j], dp[i][j-1], dp[i-1][j-1])
    // palindromic subsequence (length badhate jao)
    dp[i][j] = if (s[i] == s[j]) dp[i+1][j-1] + 2 else maxOf(dp[i+1][j], dp[i][j-1])
    ```
  quiz:
    - q: "LCS(\"chai\", \"achar\")?"
      options: ["2", "3", "4", "1"]
      answer: 1
      explain: "c, h, a — dono mein isi order mein. 'i' achar mein nahi."
    - q: "LCS table mein a[i−1] ≠ b[j−1]. dp[i][j] = ?"
      options: ["dp[i−1][j−1] + 1", "max(dp[i−1][j], dp[i][j−1])", "0", "dp[i−1][j−1]"]
      answer: 1
      explain: "Dono aakhri chars ek saath nahi chal sakte — ek chhodo, jo behtar."
    - q: "Longest common substring table mein mismatch par?"
      options: ["max(upar, baayein)", "0", "tirchha", "upar + 1"]
      answer: 1
      explain: "Substring lagaataar — yahan khatam hone wala common hissa nahi."
    - q: "Edit distance: \"\" se \"abc\" banane mein?"
      options: ["0", "1", "3", "6"]
