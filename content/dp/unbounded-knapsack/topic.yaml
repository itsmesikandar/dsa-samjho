# 13. Quick revision
revision:
  summary:
    - "Unbounded: har item kitni bhi baar; lo = ISI row se: dp[i][w − wt] + value."
    - "1D: capacity loop SEEDHA (wt se W). 0/1 = ulta, unbounded = seedha."
    - "3 form: max (rod cutting), min + ∞ (coin change), count dp[0] = 1 (coin change II)."
    - "Count mein order: items bahar = combinations, target bahar = sequences (permutations)."
    - "Greedy sirf canonical coins (₹1, 2, 5, 10…) par; diye gaye coins par DP."
  cheatsheet: |
    ```kotlin
    // unbounded max (1D, SEEDHA)
    for (i in wt.indices) for (w in wt[i]..W) dp[w] = maxOf(dp[w], dp[w - wt[i]] + v[i])
    // coin change: kam se kam coins
    val dp = IntArray(amt + 1) { amt + 1 }; dp[0] = 0
    for (a in 1..amt) for (c in coins) if (c <= a) dp[a] = minOf(dp[a], dp[a - c] + 1)
    // combinations (coins BAHAR)
    for (c in coins) for (a in c..amt) ways[a] += ways[a - c]
    // sequences (target BAHAR)
    for (s in 1..t) for (x in nums) if (x <= s) seq[s] += seq[s - x]
    ```
  quiz:
    - q: "0/1 aur unbounded knapsack ke 1D code mein farak?"
      options: ["Kuch nahi", "Unbounded mein capacity loop seedha (wt se W)", "Unbounded mein 2D zaroori", "Unbounded mein dp[0] = 1"]
      answer: 1
      explain: "Seedha chalne se dp[w − wt] mein ye item pehle se ho sakta — dobara judta hai."
    - q: "Coins [1, 5, 6], amount 10. Kam se kam coins?"
      options: ["5", "2", "3", "4"]
      answer: 1
      explain: "5 + 5. Greedy 6 + 1 + 1 + 1 + 1 = 5 coins deta."
    - q: "Coins [1, 2], amount 3. Coin Change II (combinations)?"
      options: ["2", "3", "1", "4"]
      answer: 0
      explain: "1+1+1 aur 1+2. (2+1 alag nahi gina jaata.)"
    - q: "nums [1, 2], target 3. Combination Sum IV (sequences)?"
      options: ["2", "3", "4", "1"]
      answer: 1
      explain: "1+1+1, 1+2, 2+1 — order matter karta hai."
    - q: "Coin change (min) mein ∞ = Int.MAX_VALUE rakha. Problem?"
      options: ["Kuch nahi", "dp[a − c] + 1 overflow → negative, galat min", "Array bahut bada", "Loop ulta chalana padega"]
      answer: 1
      explain: "MAX_VALUE + 1 wrap hoke sabse chhota number ban jaata. amount + 1 lo."

