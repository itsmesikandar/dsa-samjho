meta:
  id: lis
  chapter: dp
  title: Longest Increasing Subsequence
  subtitle: Har element par — mujh par khatam hone wali sabse lambi chain. O(n²) se O(n log n)
  level: intermediate
  minutes: 50
  prereqs: [dp-1d, binary-search-variations]
  tags: [dp, lis, binary-search, patience-sorting, subsequence]

# 1. Ye kya hai?
what:
  body: |
    **LIS** = array ka sabse lamba subsequence jisme har agla element pichhle se **bada** ho (strictly). Order wahi, beech mein gap chalega.

    `[5, 2, 8, 6, 3, 6, 9, 7]` → `2, 3, 6, 9` (ya `2, 3, 6, 7`) → **4**

    Template (O(n²)):
    1. **State:** `dp[i]` = `i` par **khatam** hone wala sabse lamba badhta subsequence.
    2. **Transition:** `dp[i] = 1 + max(dp[j])` jahan `j < i` aur `nums[j] < nums[i]`. Aisa koi `j` nahi → 1.
    3. **Jawab:** `dp` ka **max** — LIS kisi bhi element par khatam ho sakta hai.

    Tez tareeka **O(n log n)**: `tails` array + binary search (example 2).

    > [!yaad]
    > "**Khatam hone wala**" state — jab agla element jodna hai ya nahi, ye sirf chain ke **aakhri** element par depend kare, to aakhri element ko state mein fix kar do.
  analogy: |
    **School photo ki line:**
    Bachche roll number ke order mein khade hain — jagah nahi badal sakte. Teacher kuch bachche chunna chahti hain jo baayein se daayein **badhti height** mein hon. Zyada se zyada kitne?

    Har bachcha socho: "mujh par khatam hone wali sabse lambi line kitni?" — mujhse **pehle** khade aur mujhse **chhote** bachchon mein jiski line sabse lambi, uske peeche main khada ho jaaun: uski line + 1.

# 2. Kyun chahiye?
why:
  body: |
    Brute force: har subsequence (`2ⁿ`) check karo.

    | n | 2ⁿ subsequences | O(n²) DP | O(n log n) |
    |---|---|---|---|
    | 20 | ~10 lakh | 400 | ~90 |
    | 1,000 | asambhav | 10 lakh | ~10,000 |
    | 1,00,000 | asambhav | 10¹⁰ (TLE) | ~17 lakh |

    Greedy ("jo bada mile turant lo") fail hota hai — ek bada number jaldi le liya to aage ke chhote kadam band (visual dekho).

    LIS chhupa hota hai: lifafe ek ke andar ek, boxes stacking, "kam se kam kitne delete karo ki array sorted ho" (`n − LIS`), git ka patience diff.

    > [!socho]
    > Taash ke patte ek ek karke aate hain. Har patta kisi dher par rakho jiska upar wala patta isse **bada ya barabar** ho; aisa dher na mile to naya dher. Kam se kam kitne dher banenge?
    >
    > Exactly **LIS** jitne! Har dher ke upar wale patte hi `tails` array hain (example 2). Isliye O(n log n) wale tareeke ko **patience sorting** bhi kehte hain.

# 3. Visual intro
visual:
  body: |
    Pehle greedy try karo: shuru se chalo, jo bhi bada mile turant le lo. Dekho kahan phansta hai — phir asli LIS. Apna array daal ke dekho kab greedy sahi aata hai, kab nahi.
  viz: { tracer: greedyLisTrace }

# 4. Kaise kaam karta hai
how:
  body: |
    `dp[i]` = `i` par khatam hone wala LIS.

    - Shuru mein sab `dp[i] = 1` (akela element bhi chain hai).
    - Har `i` par peeche ke saare `j`: agar `nums[j] < nums[i]` → `j` ki chain ke peeche `i` jod sakte → `dp[i] = max(dp[i], dp[j] + 1)`.
    - Jawab `max(dp)`.

    "Khatam hone wala" kyun? Kisi chain mein `nums[i]` jod sakte ya nahi — ye sirf chain ke **aakhri** element se tay hota hai. "Pehle `i` elements ka LIS" jaisa state aakhri element nahi batata, to aage jodne ka faisla nahi ho paata.

    **Strictly vs barabar:** strictly badhta → `<`. Non-decreasing (barabar allowed) → `<=`.

    > [!galti]
    > `return dp[n − 1]` — LIS aakhri element par khatam ho, zaroori nahi. `[1, 2, 3, 0]` → `dp[3] = 1`, par jawab 3.
  viz: { tracer: lisDpTrace }
  code: how

# 5. Operations table
operations:
  - op: "Brute force (har subsequence)"
    time: "O(2ⁿ · n)"
    space: "O(n)"
    why: "2ⁿ subsequences, har ek check O(n)."
  - op: "LIS — O(n²) DP"
    time: "O(n²)"
    space: "O(n)"
    why: "Har i par peeche ke saare j."
  - op: "LIS sequence (parent array)"
    time: "O(n²)"
    space: "O(n)"
    why: "dp ke saath parent[i]; peeche chalna O(n)."
  - op: "LIS — tails + binary search"
    time: "O(n log n)"
    space: "O(n)"
    why: "Har element par ek lower bound search."
  - op: "Lagaataar badhta (subarray)"
    time: "O(n)"
    space: "O(1)"
    why: "Sirf pichhla element dekhna — ek counter."
  - op: "Russian doll (2D nesting)"
    time: "O(n log n)"
    space: "O(n)"
    why: "Sort + heights par tails wala LIS."

# 6. Code
code:
  - title: LIS ka sequence — parent se peeche chalo
    file: print-lis
    note: |
      Length ke saath asli chain bhi chahiye? `dp[i]` badhate waqt yaad rakho **kis `j` ke peeche** juda tha: `parent[i] = j`. Shuru wala element → `parent = −1`.

      Sabse bade `dp` wale index se shuru karo aur `parent` pakad ke peeche chalo. Elements ulte order mein milte hain → aakhir mein `reverse`.

      (O(n log n) wale mein bhi ho sakta hai: `tails` ke saath har length ka index rakho, aur `parent[i]` = pichhli length ka index.)

# 7. Examples
examples:
  - id: continuous
    level: easy
    title: Lagaataar badhta hissa (Longest Continuous Increasing Subsequence)
    source: { name: Longest Continuous Increasing Subsequence, platform: LeetCode, url: "https://leetcode.com/problems/longest-continuous-increasing-subsequence/" }
    problem: |
      Array mein sabse lamba **lagaataar** (subarray) strictly badhta hissa — uski length?

      Example: `[2, 6, 7, 3, 5, 8, 9, 1]` → **4** (`3, 5, 8, 9`)
    intuition: |
      Lagaataar → `dp[i]` sirf `dp[i − 1]` par depend:
      - `nums[i − 1] < nums[i]` → silsila aage: `dp[i − 1] + 1`
      - warna naya silsila: `1`

      Sirf pichhla chahiye → ek variable `cur` kaafi, O(1) memory. Jawab = `cur` ka max.

      Gap allowed hota (LIS) to yahan **5** (`2, 3, 5, 8, 9`). Wahi substring vs subsequence wala farak (DP on Strings).

      > [!galti]
      > `<=` likh diya — barabar (`3, 3`) ko badhta maan liya. Ya toote par `cur = 0` kiya — `1` hona chahiye, element khud ek hissa hai.
    dryRun: |
      | i | nums[i] | cur | best |
      |---|---|---|---|
      | 0 | 2 | 1 | 1 |
      | 1 | 6 | 2 | 2 |
      | 2 | 7 | 3 | 3 |
      | 3 | 3 | 1 | 3 |
      | 4 | 5 | 2 | 3 |
      | 5 | 8 | 3 | 3 |
      | 6 | 9 | 4 | **4** |
      | 7 | 1 | 1 | 4 |
    viz: { tracer: lcisTrace }
    code: ex1-continuous
    complexity:
      time: "O(n)"
      space: "O(1)"
      why: "Ek pass, sirf pichhla element aur ek counter."

  - id: lis-fast
    level: medium
    title: LIS O(n log n) — tails aur binary search
    source: { name: Longest Increasing Subsequence, platform: LeetCode, url: "https://leetcode.com/problems/longest-increasing-subsequence/" }
    problem: |
      Wahi LIS (strictly badhte subsequence ki length) — par array 10⁵ tak lamba. O(n²) TLE hoga. O(n log n) chahiye.

      Example: `[5, 2, 8, 6, 3, 6, 9, 7]` → **4**
    intuition: |
      `tails[k]` = ab tak dekhi length `k + 1` wali badhti chains mein **sabse chhota aakhri element**. Chhota aakhri = aage koi bhi bada aaye to judne ka zyada mauka.

      `tails` hamesha **sorted** rehta hai. Har `x`:
      - `tails` mein pehla element `≥ x` dhoondo (lower bound, binary search).
      - Mila → use `x` se badlo — wo length ab "sasti" (chhote number par khatam).
      - Nahi mila (`x` sab se bada) → end mein jodo, LIS ek lamba.

      Jawab = `tails` ki length.

      > [!galti]
      > `tails` ko asli LIS samajh liya. `[3, 4, 1]` → `tails = [1, 4]` — par 1 to 4 ke **baad** aaya, ye subsequence hi nahi. Sirf **length** (2) sahi hai.

      Barabar allowed (non-decreasing) chahiye → pehla `> x` (upper bound). Strictly → pehla `≥ x`.
    dryRun: |
      | x | tails | Kya hua |
      |---|---|---|
      | 5 | 5 | naya |
      | 2 | 2 | 5 → 2 |
      | 8 | 2 8 | naya |
      | 6 | 2 6 | 8 → 6 |
      | 3 | 2 3 | 6 → 3 |
      | 6 | 2 3 6 | naya |
      | 9 | 2 3 6 9 | naya |
      | 7 | 2 3 6 7 | 9 → 7 — length **4** |
    viz: { tracer: tailsTrace }
    code: ex2-lis-fast
    complexity:
      time: "O(n log n)"
      space: "O(n)"
      why: "Har element par tails mein ek binary search."

  - id: russian-doll
    level: tricky
    title: Lifafe ke andar lifafa (Russian Doll Envelopes)
    source: { name: Russian Doll Envelopes, platform: LeetCode, url: "https://leetcode.com/problems/russian-doll-envelopes/" }
    problem: |
      Lifafe `(width, height)`. Ek lifafa doosre ke andar tabhi jaata jab width aur height **dono** strictly chhoti hon. Ghuma nahi sakte. Ek ke andar ek — zyada se zyada kitne?

      Example: `[[3,4], [5,6], [5,5], [5,7], [2,2], [6,8]]` → **4** (2×2 → 3×4 → 5×5 → 6×8)
    intuition: |
      Do dimensions ek saath. Ek ko sort se fix karo: **width badhte order** mein. Ab heights ka LIS = jawab… lagbhag.

      Problem: same width wale. `5×5, 5×6, 5×7` → heights 5, 6, 7 badhte — LIS teeno gin lega, jabki same width wale ek doosre mein nahi jaa sakte.

      Trick: **same width par height ULTI** sort karo (bada pehle): `5×7, 5×6, 5×5` → heights 7, 6, 5 ghatte. Ab ek strictly badhti chain mein do same-width lifafe kabhi nahi aa sakte.

      Phir heights par **O(n log n)** LIS (n 10⁵ tak).

      > [!galti]
      > Same width par height bhi badhte order mein sort ki → isi example mein **6** aata (5×5, 5×6, 5×7 teeno gine). Galat.
    dryRun: |
      | Step | Value |
      |---|---|
      | Sorted | 2×2, 3×4, 5×7, 5×6, 5×5, 6×8 |
      | Heights | 2, 4, 7, 6, 5, 8 |
      | tails | 2 → 2 4 → 2 4 7 → 2 4 6 → 2 4 5 → 2 4 5 8 |
      | Jawab | **4** |
    viz: { tracer: dollTrace }
    code: ex3-russian-doll
    complexity:
      time: "O(n log n)"
      space: "O(n)"
      why: "Sort O(n log n) + heights par tails wala LIS O(n log n)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Sabse lamba badhta / ghatta subsequence — order fixed, gap allowed."
    - "Do cheezein ek saath badhni chahiye (lifafe, boxes, height-weight) → ek se sort, doosre par LIS."
    - "Kam se kam deletions ki array sorted ho jaaye → n − LIS."
    - "Chain jahan agla kisi rule se pichhle se 'bada' (divisible subset, word chain) → dp[i] = i par khatam."
  avoid:
    - "Lagaataar (subarray) chahiye → ek pass O(n), DP table nahi."
    - "Order badal sakte ho (sort allowed) → bas sort karke distinct gino."
    - "Teen ya zyada dimensions → sort + LIS nahi chalega; O(n²) DP (box stacking)."
    - "Elements ka sum / product max karna → LIS nahi, alag dp (max sum increasing subsequence)."
  signals:
    - keyword: "longest increasing subsequence"
      think: "dp[i] O(n²), ya tails + lower bound O(n log n)."
    - keyword: "n up to 10^5 with increasing subsequence"
      think: "Tails + binary search."
    - keyword: "envelopes / dolls / boxes fit inside (2D)"
      think: "Width asc, height DESC, phir heights ka LIS."
    - keyword: "min removals to make increasing / mountain"
      think: "n − LIS; mountain = left se LIS + right se LIS − 1."
    - keyword: "number of longest increasing subsequences"
      think: "dp[i] ke saath count[i]."

# 9. Real-world
realWorld:
  - where: "git diff --patience"
    how: "Dono files ki unique common lines ki positions par LIS — saaf alignment."
  - where: "Taash / patience sorting"
    how: "Patton ko dheron mein rakhna — dheron ki ginti = LIS, aur ek sorting algorithm bhi."
  - where: "Genome alignment (MUMmer)"
    how: "DNA ke matching tukdon ko order mein chain karna — LIS se sabse lambi consistent chain."
  - where: "Stock / sensor data"
    how: "Sabse lamba badhta trend, beech ke din skip karke."
  - where: "Packing / nesting"
    how: "Dibbe ek ke andar ek (2D) — kitne levels tak."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Jawab dp[n − 1] liya"
    type: logic
    wrong: |
      `return dp[n - 1]` — `[1, 2, 3, 0]` par 1.
    right: |
      `return dp.max()` — LIS kahin bhi khatam ho sakta (yahan 3).
  - title: "< vs <="
    type: logic
    wrong: |
      Strictly badhta chahiye tha, `nums[j] <= nums[i]` likh diya — `[4, 4, 4]` par 3.
    right: |
      Strictly → `<` (jawab 1). Non-decreasing → `<=`.
  - title: "tails ko asli LIS maan liya"
    type: logic
    wrong: |
      `tails` print karke "ye LIS hai" — `[3, 4, 1]` par `[1, 4]`, jo subsequence hi nahi.
    right: |
      `tails.size` = length. Sequence chahiye to parent indexes rakho.
  - title: "Binary search ka galat bound"
    type: off-by-one
    wrong: |
      Strictly LIS mein pehla `> x` (upper bound) — barabar wale bhi chain mein aa gaye.
    right: |
      Strictly → pehla `>= x` (lower bound). Non-decreasing → pehla `> x`.
  - title: "Russian doll ka sort"
    type: logic
    wrong: |
      Same width par height bhi badhte order mein — same width wale ek chain mein gine gaye.
    right: |
      Width asc, same width par height **desc**.
  - title: "Khaali array"
    type: empty
    wrong: |
      `dp.max()` khaali array par exception.
    right: |
      `dp.maxOrNull() ?: 0`, ya n = 0 par seedha 0.

# 11. Interview corner
interview:
  questions:
    - q: "LIS O(n²) ka recurrence? State 'khatam hone wala' kyun?"
      a: |
        dp[i] = 1 + max(dp[j]) jahan j < i, nums[j] < nums[i]. Jodna hai ya nahi ye chain ke aakhri element se tay hota — isliye aakhri fix. Jawab max(dp).
    - q: "O(n log n) kaise? tails ka matlab?"
      a: |
        tails[k] = length k+1 wali chains ka sabse chhota aakhri element; sorted rehta. Har x ka lower bound: replace ya append. Length = LIS.
    - q: "tails asli LIS kyun nahi?"
      a: |
        Replace karte waqt order toot sakta — [3, 4, 1] → [1, 4]. Sirf har length ka 'best ending' rakhta hai, ek saath ek chain nahi.
    - q: "LIS ka sequence kaise nikaloge?"
      a: |
        O(n²): parent[i] = jis j se dp aaya; max wale index se peeche. O(n log n): tails ke saath index rakho, parent[i] = pichhli length ka tails index.
    - q: "Non-decreasing (barabar allowed) LIS?"
      a: |
        O(n²) mein <=. Tails mein upper bound (pehla > x).
    - q: "Russian doll mein same width par height ulti kyun?"
      a: |
        Same width wale nest nahi ho sakte. Ulti height se wo ek strictly badhti chain mein kabhi ek saath nahi aate — LIS unhe nahi jodta.
    - q: "Kam se kam kitne elements hatao ki array strictly increasing ho?"
      a: |
        n − LIS. LIS ko rakho, baaki hatao.
    - q: "Number of LIS kaise ginoge?"
      a: |
        count[i] bhi rakho: dp[j] + 1 > dp[i] → dp, count = count[j]; barabar → count[i] += count[j]. Jawab: jinka dp = max, unke count ka jod.
    - q: "Longest bitonic subsequence (pehle badhe, phir ghate)?"
      followUp: true
      a: |
        Left se LIS[i], right se LDS[i] (i par shuru hone wala ghatta). Max(LIS[i] + LDS[i] − 1).
    - q: "Largest Divisible Subset?"
      followUp: true
      a: |
        Sort karo. 'Bada' ka matlab: nums[i] % nums[j] == 0. Same O(n²) dp + parent se set nikalo.
  mayAsk:
    - "Number of Longest Increasing Subsequence."
    - "Largest Divisible Subset."
    - "Maximum Length of Pair Chain."
    - "Minimum Number of Removals to Make Mountain Array."

