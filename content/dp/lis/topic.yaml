# 13. Quick revision
revision:
  summary:
    - "LIS: dp[i] = i par KHATAM hone wala sabse lamba; 1 + max dp[j] (j < i, nums[j] < nums[i])."
    - "Jawab dp ka max, dp[n − 1] nahi. O(n²)."
    - "O(n log n): tails[k] = length k+1 ka sabse chhota aakhri; lower bound par replace ya append."
    - "tails ki length = LIS; tails khud LIS nahi. Sequence ke liye parent."
    - "2D nesting: width asc + same width par height DESC, phir heights ka LIS."
  cheatsheet: |
    ```kotlin
    // O(n²)
    for (i in nums.indices) for (j in 0 until i) if (nums[j] < nums[i]) dp[i] = maxOf(dp[i], dp[j] + 1)
    // O(n log n) — tails (strictly LIS mein tails mein duplicate nahi)
    val tails = ArrayList<Int>()
    for (x in nums) {
        var i = tails.binarySearch(x); if (i < 0) i = -(i + 1)   // lower bound
        if (i == tails.size) tails.add(x) else tails[i] = x
    }
    // russian doll
    env.sortWith(compareBy<IntArray> { it[0] }.thenByDescending { it[1] })  // phir heights ka LIS
    ```
  quiz:
    - q: "[1, 2, 3, 0] mein O(n²) wala dp[3]?"
      options: ["3", "1", "4", "0"]
      answer: 1
      explain: "0 se chhota peeche koi nahi → 1. Isliye jawab max(dp) = 3 hai, dp[n − 1] nahi."
    - q: "[7, 3, 5, 3, 6, 2, 9] ka LIS?"
      options: ["3", "4", "5", "2"]
      answer: 1
      explain: "3, 5, 6, 9."
    - q: "tails = [2, 5, 8], agla x = 6. tails ab?"
      options: ["[2, 5, 8, 6]", "[2, 5, 6]", "[2, 6, 8]", "[6, 5, 8]"]
      answer: 1
      explain: "Pehla ≥ 6 hai 8 → 6 se badlo. Length 3 ki chain ab 6 par khatam."
    - q: "Russian doll: same width wale lifafon ko height ke kis order mein sort karein?"
      options: ["Badhte", "Ghatte (bada pehle)", "Koi bhi", "Input wala hi"]
      answer: 1
      explain: "Ghatte heights ek strictly badhti chain mein saath nahi aa sakte — same width wale ek doosre mein nahi jaate."
    - q: "Tails method ke baad tails = [1, 4, 9]. Kya pakka hai?"
      options: ["LIS = 1, 4, 9", "LIS ki length 3 — sequence zaroori nahi yahi", "Length pata nahi", "LIS = 9"]
      answer: 1
      explain: "Replace se order toot sakta — sirf length bharose ki."

