# 13. Quick revision
revision:
  summary:
    - "1D DP: dp[i] ka matlab ek line mein; transition = aakhri decision."
    - "Lo ya chhodo: dp[i] = max(dp[i-1], dp[i-2] + x)."
    - "Aakhri piece: dp[i] = Σ dp[i - len] (decode ways, word break); dp[0] = 1 / true."
    - "Circular: 2 seedhe cases. Max subarray: state 'i par khatam', jawab max(dp)."
    - "Pichhle 1-2 states → rolling variables, O(1) memory."
  cheatsheet: |
    ```kotlin
    // house robber
    var p2 = 0; var p1 = 0
    for (x in nums) { val c = maxOf(p1, p2 + x); p2 = p1; p1 = c }
    // decode ways
    dp[0] = 1
    for (i in 1..n) { if (s[i-1] != '0') dp[i] += dp[i-1]
        if (i >= 2 && s.substring(i-2, i).toInt() in 10..26) dp[i] += dp[i-2] }
    // circular: maxOf(line(0, n-2), line(1, n-1))
    ```
  quiz:
    - q: "House robber [2, 1, 1, 2] ka jawab?"
      options: ["3", "4", "2", "6"]
      answer: 1
      explain: "Pehla aur aakhri: 2 + 2 = 4 (beech ke do chhode)."
    - q: "Decode ways '226' ke tareeke?"
      options: ["1", "2", "3", "4"]
      answer: 2
      explain: "2 2 6, 22 6, 2 26 → 3."
    - q: "House robber II mein pehla aur aakhri neighbor. Kaise solve?"
      options: ["Dono le lo", "Do seedhi lines (pehla hata, aakhri hata) ka max", "Greedy", "2D DP"]
      answer: 1
      explain: "Dono saath nahi aa sakte → 2 cases."
    - q: "Max subarray ke DP mein dp[i] ka matlab?"
      options: ["0..i ka sabse bada subarray", "i par KHATAM hone wala sabse bada", "i se shuru hone wala", "Prefix sum"]
      answer: 1
      explain: "Isse hi dp[i] sirf dp[i-1] se judta hai; jawab max(dp)."
    - q: "Word break mein dp[0] = ?"
      options: ["false", "true", "0", "s[0] in dict"]
      answer: 1
      explain: "Khaali prefix 'toot chuka' — pehla word yahin se judta hai."

