# 13. Quick revision
revision:
  summary:
    - "0/1 knapsack: har item ek baar, lo ya chhodo; dp[i][w] = max(chhodo, lo)."
    - "Lo = upar wali row se: dp[i-1][w - wt] + value."
    - "1D: dp[w], capacity loop ULTA (W se wt). Seedha = unbounded."
    - "Subset sum = value ki jagah true/false; count = dp[s] += dp[s - x], dp[0] = 1."
    - "Partition → total/2. Target sum → P = (total + target)/2. O(n·W) pseudo-polynomial — W bada to nahi chalega."
  cheatsheet: |
    ```kotlin
    // 0/1 knapsack, 1D (ULTA)
    val dp = IntArray(W + 1)
    for (i in wt.indices) for (w in W downTo wt[i]) dp[w] = maxOf(dp[w], dp[w - wt[i]] + v[i])
    // subset sum
    val can = BooleanArray(S + 1); can[0] = true
    for (x in nums) for (s in S downTo x) if (can[s - x]) can[s] = true
    // subsets count karna
    val ways = IntArray(S + 1); ways[0] = 1
    for (x in nums) for (s in S downTo x) ways[s] += ways[s - x]
    ```
  quiz:
    - q: "Items (1kg ₹1), (3kg ₹4), (4kg ₹5), (5kg ₹7); bag 7 kg. Max value?"
      options: ["8", "9", "10", "12"]
      answer: 1
      explain: "3kg + 4kg = ₹9. (5kg + 1kg = ₹8.) All 3 bade ek saath fit nahi."
    - q: "0/1 knapsack 1D array mein capacity loop?"
      options: ["w = 0 se W", "w = W se wt tak (ulta)", "Koi bhi order", "w = wt se W"]
      answer: 1
      explain: "Ulta chalne se dp[w - wt] purana rehta hai — item ek hi baar."
    - q: "nums = [3, 3, 4, 6]. Do barabar jod wale groups?"
      options: ["Haan, 8 aur 8", "Nahi — total odd", "Nahi — koi subset 8 nahi banata", "Sort kiye bina pata nahi"]
      answer: 2
      explain: "Total 16, target 8. Jod: 3, 4, 6, 7, 9, 10, 12, 13... 8 kabhi nahi."
    - q: "Target sum: nums = [1, 2, 3], target = 0. Kitne tareeke?"
      options: ["0", "1", "2", "3"]
      answer: 2
      explain: "P = (6 + 0) / 2 = 3. Subsets {3} aur {1, 2} → −1 −2 +3 aur +1 +2 −3."
    - q: "W = 10⁹, n = 100. O(n·W) DP?"
      options: ["Fast chalega", "Nahi — table bahut bada (pseudo-polynomial)", "O(n log W) ho jaata", "Greedy sahi ho jaata"]
      answer: 1
      explain: "10¹¹ cells — na time, na memory. Values chhoti ho to value par DP, n chhota ho to meet in the middle."

