# 13. Quick revision
revision:
  summary:
    - "DP = overlapping subproblems + optimal substructure; har state ek baar."
    - "Trip: recursion → memo → tabulation → space optimise."
    - "Pehle likho: dp[i] ka matlab, transition, base, jawab ka index."
    - "Counting: 'aakhri step kya tha?' se transitions jodo. Optimisation: min / max."
    - "dp[i] sirf pichhle k par depend → k variables, O(1) memory."
  cheatsheet: |
    ```kotlin
    // memo
    fun f(n: Int): Long { if (n <= 1) return n.toLong(); if (memo[n] != -1L) return memo[n]
        memo[n] = f(n - 1) + f(n - 2); return memo[n] }
    // table
    val dp = LongArray(n + 1); dp[1] = 1; for (i in 2..n) dp[i] = dp[i - 1] + dp[i - 2]
    // rolling
    var a = 0L; var b = 1L; repeat(n) { val c = a + b; a = b; b = c }  // a = fib(n)
    ```
  quiz:
    - q: "DP lagne ke liye kaunsi 2 cheezein chahiye?"
      options: ["Sorted input aur heap", "Overlapping subproblems aur optimal substructure", "Graph aur queue", "Recursion aur stack"]
      answer: 1
      explain: "Sub-sawaal baar baar aayein, aur bada jawab chhoton se bane."
    - q: "fib(n) memo ke saath — time?"
      options: ["O(2ⁿ)", "O(n²)", "O(n)", "O(log n)"]
      answer: 2
      explain: "Har k ek baar nikla, baaki memo se."
    - q: "Climbing stairs (1 ya 2 step), dp[0] = ?"
      options: ["0", "1", "2", "Undefined"]
      answer: 1
      explain: "Land par khade rehne ka ek tareeka — isi se dp[2] = 2 sahi aata hai."
    - q: "Min Cost Climbing Stairs mein jawab kis index par?"
      options: ["dp[n - 1]", "dp[n]", "dp[0]", "min(dp[n-1], dp[n-2])"]
      answer: 1
      explain: "Top = aakhri seedhi ke paar = index n (state 'i par khade')."
    - q: "dp[i] sirf dp[i-1] aur dp[i-2] par depend. Memory kitni kaafi?"
      options: ["O(n)", "O(n²)", "O(1)", "O(log n)"]
      answer: 2
      explain: "2 variables, window shift karo."

