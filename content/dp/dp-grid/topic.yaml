    platform: LeetCode
    num: 62
    url: "https://leetcode.com/problems/unique-paths/"
    level: easy
    pattern: Upar + left
    hint: "How wala — phir ek 1D array se. (LeetCode par medium.)"
  - name: Pascal's Triangle II
    platform: LeetCode
    num: 119
    url: "https://leetcode.com/problems/pascals-triangle-ii/"
    level: easy
    pattern: Ek row, peeche se update
    hint: "row[j] += row[j-1] — j ko right se left chalao taaki purana value kharab na ho."
  - name: Range Sum Query 2D - Immutable
    platform: LeetCode
    num: 304
    url: "https://leetcode.com/problems/range-sum-query-2d-immutable/"
    level: easy
    pattern: 2D prefix sum
    hint: "P[i][j] = cell + upar + left − diagonal. Query = P[r2][c2] − P[r1][c2] − P[r2][c1] + P[r1][c1]. (LeetCode par medium.)"
  - name: Triangle
    platform: LeetCode
    num: 120
    url: "https://leetcode.com/problems/triangle/"
    level: medium
    pattern: Neeche se upar
    hint: "Code section wala."
  - name: Count Square Submatrices with All Ones
    platform: LeetCode
    num: 1277
    url: "https://leetcode.com/problems/count-square-submatrices-with-all-ones/"
    level: medium
    pattern: Maximal square ka dp jodo
    hint: "dp[i][j] = utne squares jinka kona yahan (side 1..dp). Saare dp ka jod = jawab."
  - name: Minimum Falling Path Sum
    platform: LeetCode
    num: 931
    url: "https://leetcode.com/problems/minimum-falling-path-sum/"
    level: medium
    pattern: Upar ke 3 se
    hint: "dp[i][j] = cell + min(upar-baayein, upar, upar-daayein). Edge dhyaan se. Jawab aakhri row ka min."
  - name: Dungeon Game
    platform: LeetCode
    num: 174
    url: "https://leetcode.com/problems/dungeon-game/"
    level: hard
    pattern: Ulta grid DP
    hint: "Princess se shuru: need[i][j] = max(1, min(need neeche, need right) − dungeon[i][j]). Jawab need[0][0]."
  - name: Maximal Rectangle
    platform: LeetCode
    num: 85
    url: "https://leetcode.com/problems/maximal-rectangle/"
    level: hard
    pattern: Har row = histogram
    hint: "heights[j] = continuous '1' upar tak. Har row par Largest Rectangle in Histogram (monotonic stack)."

# 13. Quick revision
revision:
  summary:
    - "Grid DP: dp[i][j] cell ka state; transition upar / left (/ diagonal) se."
    - "Order: row by row, left se right. Edge alag ya extra row/col 0."
    - "Raste: upar + left. Cost: cell + min. Square: min(3) + 1."
    - "Sirf pichhli row chahiye → 1D array, O(n) memory."
    - "All 4 dishayein → DP nahi, BFS / Dijkstra."
  cheatsheet: |
    ```kotlin
    // unique paths, 1D
    val dp = IntArray(n) { 1 }
    for (i in 1 until m) for (j in 1 until n) dp[j] += dp[j - 1]
    // min path sum
    dp[i][j] = g[i][j] + minOf(dp[i-1][j], dp[i][j-1])   // edge alag
    // maximal square (1-indexed dp)
    if (mat[i-1][j-1] == '1') dp[i][j] = minOf(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) + 1
    ```
  quiz:
    - q: "3 × 3 grid (sirf neeche / right) mein kitne raste?"
      options: ["4", "6", "9", "8"]
      answer: 1
      explain: "C(4, 2) = 6. DP: 1 1 1 / 1 2 3 / 1 3 6."
    - q: "Unique paths 1D array mein update?"
      options: ["dp[j] = dp[j-1]", "dp[j] += dp[j-1]", "dp[j] = dp[j+1] + dp[j]", "dp[j] *= 2"]
      answer: 1
      explain: "dp[j] purana = upar, dp[j-1] naya = left."
    - q: "Maximal square: upar 2, left 3, diagonal 1, cell '1'. dp?"
      options: ["4", "3", "2", "1"]
      answer: 2
      explain: "min(2, 3, 1) + 1 = 2."
    - q: "Pehli row mein stone index 2 par (unique paths II). dp[0][3]?"
      options: ["1", "0", "2", "3"]
      answer: 1
      explain: "Stone ke baad pehli row mein rasta band — 0."
    - q: "All 4 dishaon mein chalna allowed, sabse sasta rasta?"
      options: ["Grid DP upar + left", "Dijkstra", "Greedy", "Backtracking hamesha"]
      answer: 1
      explain: "Cells circular depend — non-negative cost par Dijkstra."

