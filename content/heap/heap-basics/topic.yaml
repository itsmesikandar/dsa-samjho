meta:
  id: heap-basics
  chapter: heap
  title: Heap basics
  subtitle: Array mein chhupa complete tree — sabse chhota hamesha index 0 par, push / pop O(log n)
  level: intermediate
  minutes: 40
  prereqs: [binary-tree-basics, array, big-o-time]
  tags: [heap, min-heap, max-heap, sift-up, sift-down, complete-tree]

# 1. Ye kya hai?
what:
  body: |
    **Heap** = ek **complete binary tree** jo **array** mein rakha jaata hai, aur ek order rule maanta hai.

    - **Shape rule (complete):** har level poora bhara, sirf aakhri level left se bharta hai. Beech mein gap nahi.
    - **Order rule (min-heap):** har parent ≤ uske bachche. (Max-heap mein ulta: parent ≥ bachche.)

    Result: **sabse chhota hamesha root par** (index 0). Dekhna O(1), daalna / nikaalna O(log n).

    Index ka hisaab (0-based):
    - `i` ke bachche: `2i + 1` aur `2i + 2`
    - `i` ka parent: `(i - 1) / 2`

    > [!yaad]
    > Heap **sorted nahi** hota. Rule sirf parent aur bachche ke beech hai; bhai-bhai (siblings) mein koi rule nahi. `[1, 5, 2, 6, 7, 3]` valid min-heap hai.
  analogy: |
    **Office hierarchy — rank number jitna chhota, utna senior:**
    Har manager apni team ke har bande se senior hai. Par 2 alag teams ke log aapas mein compare nahi hote. CEO (root) sabse senior — ye pakka. 5th senior kaun hai — ye seedha nahi pata.

    Naya banda join kare to sabse neeche baithta hai. Apne manager se senior nikla to promotion — ek level upar (**sift up**), jab tak sahi jagah na mile.

    CEO retire ho to sabse aakhri bande ko chair par place karo. Wo apni team ke sabse senior se jagah badalta jaata hai (**sift down**), jab tak sahi level na mile.

# 2. Kyun chahiye?
why:
  body: |
    Baar baar poochhna hai "abhi sabse chhota (ya bada) kaun?", aur beech mein naye items aate rehte hain.

    | Structure | Min dekhna | Insert | Min nikaalna |
    |---|---|---|---|
    | Unsorted array | O(n) | O(1) | O(n) |
    | Sorted array | O(1) | O(n) — shift | O(1) |
    | Balanced BST | O(log n) | O(log n) | O(log n) |
    | **Heap** | **O(1)** | **O(log n)** | **O(log n)** |

    BST bhi kar deta hai, par heap **sirf ek array** hai — koi pointer nahi, kam memory, cache friendly, chhota code. Aur poore array se heap **O(n)** mein ban jaata hai.

    > [!socho]
    > Hospital emergency ward: patient kabhi bhi aate hain, doctor hamesha sabse serious wala pehle dekhta hai. Normal queue (FIFO) chalegi?
    >
    > Nahi — FIFO aane ke order mein deta hai, seriousness ke order mein nahi. Yahan **priority queue** chahiye, aur uske andar heap hai.

# 3. Visual intro
visual:
  body: |
    Ek hi data 2 tarah dikh raha hai: upar tree (samajhne ke liye), neeche array (jo memory mein sach mein hai). Node ke upar chhota number = array index.

    Har index par dekho: parent `(i - 1) / 2`, bachche `2i + 1`, `2i + 2`. Shape complete hai, isliye formula kabhi khaali jagah par nahi le jaata.
  viz: { tracer: heapMap }

# 4. Kaise kaam karta hai
how:
  body: |
    Do hi operations. Dono sirf ek **raasta** (root se leaf) chalte hain → O(log n).

    **Push (sift up):**
    1. Naya item array ke **end** par daalo — tree ki pehli khaali jagah, shape complete rahi.
    2. Jab tak parent bada hai: parent se swap, ek level upar.

    **Pop (extract min, sift down):**
    1. Root (sabse chhota) nikaal ke rakh lo.
    2. **Aakhri** item root par rakho, array ek chhota karo — shape bachi.
    3. Jab tak koi bachcha chhota hai: **dono bachchon mein jo chhota**, uske saath swap, neeche jao.

    > [!galti]
    > Sift down mein pehle mile chhote bachche se swap kar diya. Agar doosra bachcha aur chhota tha, to ab wo apne se bade parent ke neeche hai → order toota. Hamesha **sabse chhote** bachche se swap.

    Try karo: `ops` mein digit = push, `o` = pop.
  viz: { tracer: heapOps }
  code: how

# 5. Operations table
operations:
  - op: "Peek (min dekhna)"
    time: O(1)
    space: O(1)
    why: "Hamesha a[0]."
  - op: "Push (insert)"
    time: "O(log n)"
    space: O(1)
    why: "End par daalo, sift up — zyada se zyada height jitne swaps."
  - op: "Pop (extract min)"
    time: "O(log n)"
    space: O(1)
    why: "Aakhri ko root par, sift down — ek raasta neeche."
  - op: "Build heap (n items se)"
    time: O(n)
    space: O(1)
    why: "Neeche se upar sift down; mostly nodes neeche hain aur kam chalte hain."
  - op: "Kisi value ko search"
    time: O(n)
    space: O(1)
    why: "Order sirf parent-bachche ka — BST jaisa ek taraf nahi ja sakte."
  - op: "Index k delete (index pata ho)"
    time: "O(log n)"
    space: O(1)
    why: "Aakhri ko wahan rakho, phir sift up ya sift down."

# 6. Code
code:
  - title: Min ya max — ek code, sirf Comparator badlo
    file: heap-cmp
    note: |
      Har `<` ki jagah `before(i, j)` likho: "kya a[i] ko a[j] se upar hona chahiye?". `naturalOrder()` → min-heap, `reverseOrder()` → max-heap.

      Java ka `PriorityQueue` andar se bilkul yahi karta hai — default min-heap, Comparator do to kuch bhi. Agle topic mein library use karenge.

      Max-heap ki ek aur trick: values ka **minus** min-heap mein daalo, nikaalte time phir minus. (`Int.MIN_VALUE` par overflow — dhyan.)

# 7. Examples
examples:
  - id: is-heap
    level: easy
    title: Kya ye array min-heap hai?
    source: { name: Does array represent Heap, platform: GFG, url: "https://www.geeksforgeeks.org/problems/does-array-represent-heap4345/1" }
    problem: |
      Ek integer array diya hai (tree ka level order). Batao kya ye **min-heap** hai — matlab har parent apne bachchon se chhota ya barabar.

      Example: `[3, 5, 4, 9, 6, 8, 1]` → **false** (index 6 ka 1 apne parent 4 se chhota)
    intuition: |
      Tree banane ki zaroorat nahi — index formula hi tree hai. Har parent `i` ke liye `a[2i + 1]` aur `a[2i + 2]` (agar hai) se compare karo.

      Parents kaun? Index `0` se `n/2 - 1` tak. Usse aage sab leaves — unke bachche array ke bahar.

      > [!galti]
      > Loop `i < n` tak chalaya aur `a[2i + 1]` bina check ke padha → index out of bounds. Ya right bachche ka `r < n` check bhool gaye.
    dryRun: |
      | i | a[i] | Bachche | Theek? |
      |---|---|---|---|
      | 0 | 3 | 5, 4 | haan |
      | 1 | 5 | 9, 6 | haan |
      | 2 | 4 | 8, **1** | **nahi** → false |
    viz: { tracer: isHeapTrace }
    code: ex1-is-heap
    complexity:
      time: O(n)
      space: O(1)
      why: "n/2 parents, har ek par do compare."

  - id: delete-at
    level: medium
    title: Heap ke beech se koi item hatao
    source: { name: Operations on Binary Min Heap, platform: GFG, url: "https://www.geeksforgeeks.org/problems/operations-on-binary-min-heap/1" }
    problem: |
      Min-heap (array) aur ek index `k` diya hai. Index `k` wala item hatao aur heap valid rakho. Naya array batao.

      Example: `[1, 10, 2, 11, 12, 3, 4]`, k = 4 → **[1, 4, 2, 11, 10, 3]**
    intuition: |
      Pop wala hi trick: **aakhri item** ko `k` par rakho, array ek chhota karo. Shape bachi.

      Ab naya item galat jagah ho sakta hai — par kis taraf? Aakhri item **doosri branch** se aaya hai, to:
      - parent se chhota ho sakta hai → **sift up**
      - ya bachchon se bada → **sift down**

      Dono ek saath kabhi nahi (parent se chhota hai to purane bachchon se bhi chhota hai). Code mein dono loop likh do — ek hi kaam karega.

      > [!galti]
      > Pop ki tarah sirf sift down kiya. Example mein 4 ko upar jaana tha (parent 10 se chhota) — sift down kuch nahi karta, heap toota reh jaata hai.
    dryRun: |
      | Step | Array | Kya hua |
      |---|---|---|
      | start | [1, 10, 2, 11, **12**, 3, 4] | index 4 hatana |
      | aakhri (4) nikaala | [1, 10, 2, 11, 12, 3] | |
      | index 4 par rakha | [1, 10, 2, 11, **4**, 3] | parent 10 > 4 |
      | sift up | [1, **4**, 2, 11, **10**, 3] | parent 1 ≤ 4 → ruko |
    viz: { tracer: deleteAtTrace }
    code: ex2-delete-at
    complexity:
      time: "O(log n)"
      space: O(1)
      why: "Ek hi raasta — upar ya neeche, height jitna."

  - id: build-heap
    level: tricky
    title: Poore array se heap banao — O(n) mein
    source: { name: Building Heap from Array, platform: GFG, url: "https://www.geeksforgeeks.org/building-heap-from-array/" }
    problem: |
      Ek unsorted array diya hai. Use **usi array mein** (extra jagah bina) min-heap bana do.

      Example: `[9, 4, 7, 1, 8, 2, 3]` → **[1, 4, 2, 9, 8, 7, 3]**
    intuition: |
      Seedha tareeka: ek-ek item push karo → n × O(log n) = **O(n log n)**.

      Better: **neeche se upar**. Leaves (index `n/2` se aage) akele hain — apne aap heap. Ab aakhri parent `n/2 - 1` se root tak har node ko **sift down** karo. Jab kisi node ko theek karte ho, uske dono subtree pehle hi heap hain — bas ek node ko jagah dilani hai.

      O(n) kyun? Aadhe nodes leaves (0 kaam), quarter nodes 1 level neeche ja sakte, aathwan hissa 2 level… Jod = n/4·1 + n/8·2 + n/16·3 + … < n. **Mostly nodes neeche hain, aur unhe kam chalna padta hai.**

      > [!galti]
      > Loop 0 se upar ki taraf chalaya. Root pehle theek kiya, par uske neeche ke subtree abhi heap nahi → galat result. Hamesha **neeche se upar** (`n/2 - 1 downTo 0`).
    dryRun: |
      | i | Kya hua | Array |
      |---|---|---|
      | 2 (7) | bachche 2, 3 → 2 se swap | [9, 4, 2, 1, 8, 7, 3] |
      | 1 (4) | bachche 1, 8 → 1 se swap | [9, 1, 2, 4, 8, 7, 3] |
      | 0 (9) | 1 se swap, phir 4 se swap | [1, 4, 2, 9, 8, 7, 3] |
    viz: { tracer: buildHeapTrace }
    code: ex3-build-heap
    complexity:
      time: O(n)
      space: O(1)
      why: "Har node ka kaam = uski height; heights ka jod n se kam. Iterative sift down, extra jagah nahi."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Baar baar 'abhi ka sabse chhota / bada' chahiye, aur beech mein naye items aate rahein."
    - "Top-K, kth largest / smallest — size k ka heap."
    - "Kai sorted lists merge karni hain — har list ka sabse chhota heap mein."
    - "Greedy / Dijkstra / scheduling — 'agla sabse sasta / sabse jaldi wala kaam'."
  avoid:
    - "Sirf ek baar min / max chahiye → ek loop O(n) kaafi."
    - "Poora sorted order chahiye aur data badalta nahi → seedha sort."
    - "Kisi bhi value ko baar baar dhoondhna / hatana → heap mein search O(n); TreeMap / TreeSet lo."
  signals:
    - keyword: "k largest / k smallest / kth"
      think: "Size k ka heap (kth largest ke liye min-heap)."
    - keyword: "baar baar sabse chhota / bada nikaalo"
      think: "Heap / PriorityQueue — pop O(log n)."
    - keyword: "stream mein data aata rahe, top / median chahiye"
      think: "Heap (ya 2 heaps)."
    - keyword: "merge k sorted"
      think: "Har list ka head min-heap mein."

# 9. Real-world
realWorld:
  - where: "OS process scheduler"
    how: "Sabse high priority wala process agla chalega — ready processes priority queue (heap) mein."
  - where: "Google Maps / routing (Dijkstra)"
    how: "Ab tak ka sabse paas wala junction heap se nikalta hai."
  - where: "Timers / scheduled jobs"
    how: "Jo timer sabse pehle khatam hoga wo root par. Java ka ScheduledThreadPoolExecutor andar heap use karta hai."
  - where: "Hospital triage / support tickets"
    how: "Sabse urgent case pehle, chahe baad mein aaya ho."
  - where: "Huffman coding (zip / JPEG compression)"
    how: "2 sabse kam frequency wale nodes baar baar heap se nikaal ke jodte hain."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Parent ka formula galat (1-based wala laga diya)"
    type: off-by-one
    wrong: |
      0-based array mein `parent = i / 2`, bachche `2i`, `2i + 1` → root (0) ka bachcha khud 0!
    right: |
      0-based: parent `(i - 1) / 2`, bachche `2i + 1`, `2i + 2`. (1-based mein `i / 2`, `2i`, `2i + 1` — books mein often yahi milta hai.)
  - title: "Sift down mein galat bachche se swap"
    type: logic
    wrong: |
      Left bachcha chhota hai → turant swap, right dekha hi nahi. Right aur bhi chhota tha → ab wo bade parent ke neeche.
    right: |
      Pehle dono bachchon mein **sabse chhota** choose karo, phir usse compare + swap.
  - title: "Pop mein root hata ke sab shift kiya"
    type: other
    wrong: |
      `a.removeAt(0)` → saare items ek jagah shift hue, parent-bachche rishte bigde, aur O(n).
    right: |
      Aakhri item root par, array ka end hatao, phir sift down. O(log n).
  - title: "Khaali heap par peek / pop"
    type: empty
    wrong: |
      Khaali heap par `a[0]` → crash.
    right: |
      Pehle `size == 0` check. Library mein `peek()` / `poll()` null dete hain, `element()` / `remove()` exception.
  - title: "Heap ko sorted samajh liya"
    type: logic
    wrong: |
      Heap array print karke sorted maan liya, ya `a[1]` ko doosra sabse chhota maan liya.
    right: |
      Sirf `a[0]` pakka hai. Doosra sabse chhota `a[1]` ya `a[2]` mein se koi. Sorted chahiye to baar baar pop.
  - title: "Max-heap ke liye minus trick mein overflow"
    type: overflow
    wrong: |
      `-x` daala, x = `Int.MIN_VALUE` → `-x` bhi `Int.MIN_VALUE` (overflow), order bigad gaya.
    right: |
      Comparator use karo (`reverseOrder()`), ya Long mein minus.

# 11. Interview corner
interview:
  questions:
    - q: "Heap kya hai? BST se kya fark?"
      a: |
        Complete binary tree, array mein. Min-heap: parent ≤ bachche. BST mein left < node < right (poora subtree) → sorted order milta hai. Heap sirf min / max fast deta hai; search O(n).
    - q: "Array mein index i ke parent aur bachche?"
      a: |
        0-based: parent `(i - 1) / 2`, bachche `2i + 1`, `2i + 2`. 1-based: `i / 2`, `2i`, `2i + 1`.
    - q: "Heap array mein kyun rakh sakte hain, BST kyun nahi?"
      a: |
        Heap hamesha **complete** hai — koi gap nahi, to index formula se rishta mil jaata hai. BST koi bhi shape le sakta hai (skewed) → array mein bahut khaali jagah.
    - q: "Insert aur extract-min — steps aur complexity?"
      a: |
        Dono O(log n). Insert: end par daalo, sift up. Extract: root lo, aakhri ko root par, sift down (chhote bachche se swap).
    - q: "Build heap O(n) kaise, O(n log n) kyun nahi?"
      a: |
        Neeche se upar sift down. Har node ka kaam = uski height. Mostly nodes ki height chhoti (aadhe leaves = 0). Jod n/4·1 + n/8·2 + … < n.
    - q: "Max-heap kaise banaoge?"
      a: |
        Compare ulta (reverse Comparator), ya values ka minus min-heap mein. Java: `PriorityQueue<>(Collections.reverseOrder())`.
    - q: "Heap se kisi value ko delete kaise?"
      a: |
        Index pata ho: aakhri item wahan, phir sift up ya sift down — O(log n). Index na pata ho: pehle O(n) search (ya value → index ka HashMap saath rakho).
    - q: "Heap ki height kitni hoti hai?"
      a: |
        Complete tree → floor(log2 n). Isliye har sift O(log n); heap kabhi skewed nahi hota.
    - q: "Min-heap mein sabse bada element kahan hoga?"
      followUp: true
      a: |
        Kisi **leaf** mein — index n/2 se n - 1 ke beech. Dhoondhna O(n).
    - q: "Heap mein kth smallest O(1) mein mil sakta hai?"
      followUp: true
      a: |
        Nahi. Sirf min O(1). kth ke liye k baar pop (O(k log n)), ya size k ka heap (top-k topic).
  mayAsk:
    - "Apni MinHeap class likho (push, pop, peek)."
    - "Array ko in-place heap banao (heapify)."
    - "Check karo array heap hai ya nahi."
    - "Min-heap ko max-heap mein convert karo."

