# 13. Quick revision
revision:
  summary:
    - "Heap = complete binary tree, array mein. Min-heap: har parent ≤ bachche, root = sabse chhota."
    - "0-based: bachche 2i+1, 2i+2; parent (i-1)/2. Index n/2 se aage sab leaves."
    - "Push: end par daalo, sift up. Pop: root lo, aakhri ko root par, sift down (chhote bachche se swap)."
    - "Peek O(1), push / pop O(log n), build heap O(n), search O(n)."
    - "Heap sorted nahi. Max-heap = compare ulta (reverseOrder)."
  cheatsheet: |
    ```kotlin
    // push: end par daalo, upar chadhao
    a.add(x); var i = a.size - 1
    while (i > 0 && a[(i - 1) / 2] > a[i]) { swap(i, (i - 1) / 2); i = (i - 1) / 2 }
    // pop: root lo, aakhri ko root par, sift down
    val top = a[0]; a[0] = a.last(); a.removeAt(a.size - 1); siftDown(0)
    // siftDown(i): chhote bachche se swap jab tak zaroorat
    while (true) { val l = 2 * i + 1; val r = l + 1; var m = i
        if (l < a.size && a[l] < a[m]) m = l
        if (r < a.size && a[r] < a[m]) m = r
        if (m == i) break; swap(i, m); i = m }
    // build heap O(n): for (i in n / 2 - 1 downTo 0) siftDown(i)
    ```
  quiz:
    - q: "0-based heap array mein index 5 ka parent?"
      options: ["2", "3", "1", "4"]
      answer: 0
      explain: "(5 - 1) / 2 = 2."
    - q: "[1, 5, 2, 6, 7, 3] valid min-heap hai?"
      options: ["Haan", "Nahi — sorted nahi hai", "Nahi — 5 > 2", "Nahi — 3 galat jagah"]
      answer: 0
      explain: "1 ≤ 5, 2; 5 ≤ 6, 7; 2 ≤ 3. Har parent ≤ bachche. Siblings mein order zaroori nahi."
    - q: "Pop ke baad root par kaun rakha jaata hai?"
      options: ["Chhota bachcha", "Aakhri item", "Bada bachcha", "Koi nahi — sab ek jagah shift karte hain"]
      answer: 1
      explain: "Aakhri item — shape complete rehti hai; phir sift down."
    - q: "n items se heap banana (neeche se upar) — time?"
      options: ["O(log n)", "O(n)", "O(n log n)", "O(n²)"]
      answer: 1
      explain: "Mostly nodes neeche hain aur kam chalte hain — jod n se kam."
    - q: "Min-heap mein sabse bada element kahan hota hai?"
      options: ["Root par", "Index 1 par", "Kisi leaf mein", "Hamesha aakhri index par"]
      answer: 2
      explain: "Jiske bachche hain wo unse chhota ya barabar — to sabse bada leaf mein hi hoga. Kaunsi leaf, ye pakka nahi."

