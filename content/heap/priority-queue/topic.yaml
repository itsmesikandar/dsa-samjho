# 13. Quick revision
revision:
  summary:
    - "PriorityQueue = binary heap. add / poll O(log n), peek O(1), remove(x) O(n). Default min."
    - "Max: Collections.reverseOrder(). Objects: Comparator (compareBy / Integer.compare), minus nahi."
    - "println / iterator = andar ka array, sorted nahi. Order sirf peek / poll se."
    - "Pattern: poll, poll, jodo, add — stones, ropes (Huffman)."
    - "Heap sort: max-heap, root ↔ end swap, size - 1, sift down. O(n log n), O(1) space, unstable."
  cheatsheet: |
    ```kotlin
    val minPq = PriorityQueue<Int>()
    val maxPq = PriorityQueue<Int>(Collections.reverseOrder())
    val byPair = PriorityQueue<IntArray>(compareBy<IntArray>({ it[0] }, { it[1] }))
    pq.add(x); pq.peek(); pq.poll()        // log n, 1, log n; khaali par null
    // heap sort
    for (i in n / 2 - 1 downTo 0) siftDown(a, i, n)                 // max-heap
    for (end in n - 1 downTo 1) { swap(a, 0, end); siftDown(a, 0, end) }
    ```
  quiz:
    - q: "PriorityQueue mein 5, 1, 8, 3, 2 add kiye. println(pq) kya dikhayega?"
      options: ["[1, 2, 3, 5, 8]", "[1, 2, 8, 5, 3]", "[5, 1, 8, 3, 2]", "[8, 5, 3, 2, 1]"]
      answer: 1
      explain: "Andar ka heap array — level order, sorted nahi."
    - q: "pq.remove(x) (koi bhi item) ki complexity?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      answer: 2
      explain: "Pehle x ko dhoondhna linear hai; hatana phir O(log n)."
    - q: "Comparator (a, b) -> a - b mein kya risk hai?"
      options: ["Slow hai", "Overflow se order ulta ho sakta hai", "Max-heap ban jaata hai", "Koi risk nahi"]
      answer: 1
      explain: "Bade / negative values par minus overflow. Integer.compare use karo."
    - q: "Heap sort ki extra space?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      answer: 0
      explain: "Usi array mein heap aur sorted hissa; iterative sift down."
    - q: "Ropes [4, 3, 2, 6] ka minimum cost?"
      options: ["15", "25", "29", "34"]
      answer: 2
      explain: "2+3 = 5, 4+5 = 9, 6+9 = 15 → 5 + 9 + 15 = 29."

