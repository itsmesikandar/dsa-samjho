  related:
    - id: top-k
      why: "Wahan ek size-k heap ek boundary (kth) rakhta tha; yahan 2 heaps beech ki boundary (median) rakhte hain."
    - id: sliding-window-fixed
      why: "Window shift karne ka same structure — andar wala add, bahar wala remove."
    - id: quick-sort
      why: "Ek baar ka median quickselect se O(n) average; stream mein two heaps."
  usedLater:
