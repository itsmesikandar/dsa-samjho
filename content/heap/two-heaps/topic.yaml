# 13. Quick revision
revision:
  summary:
    - "Left = max-heap (chhota aadha), right = min-heap (bada aadha). Median = tops se."
    - "Rule: left ≤ right (order) aur left.size = right.size ya +1 (size)."
    - "add: route (x ≤ left top → left), phir balance (top dusri taraf). O(log n). median O(1)."
    - "Average: (a.toLong() + b) / 2.0 — Int division aur overflow dono se bacho."
    - "Doosra form: locked (requirement par min-heap) + ready (value par max-heap) — IPO."
  cheatsheet: |
    ```kotlin
    val left = PriorityQueue<Int>(Collections.reverseOrder()) // chhota aadha
    val right = PriorityQueue<Int>()                         // bada aadha
    fun add(x: Int) {
        left.add(x); right.add(left.poll())                   // order
        if (right.size > left.size) left.add(right.poll())    // size
    }
    fun median() = if (left.size > right.size) left.peek().toDouble()
                   else (left.peek().toLong() + right.peek()) / 2.0
    // window: old <= left.peek() ? left.remove(old) : right.remove(old), phir balance
    ```
  quiz:
    - q: "Running median mein chhota aadha kaunse heap mein?"
      options: ["Min-heap", "Max-heap", "Koi bhi", "Sorted list"]
      answer: 1
      explain: "Chhote aadhe ka sabse bada (beech ke paas wala) top par chahiye → max-heap."
    - q: "Left mein 4, right mein 3 numbers. Median kahan?"
      options: ["Right ka top", "Left ka top", "Dono tops ka average", "Left ka last element"]
      answer: 1
      explain: "Total 7 (odd), left mein ek zyada → beech wala left ka top."
    - q: "addNum aur findMedian ki time complexity?"
      options: ["O(1), O(log n)", "O(log n), O(1)", "O(n), O(1)", "O(log n), O(log n)"]
      answer: 1
      explain: "add mein gine-chune heap ops (log n), median sirf peek."
    - q: "Tops 2147483647 aur 2147483647. `(a + b) / 2.0` Int mein kya dega?"
      options: ["2.147483647E9", "Negative number", "Exception", "0.0"]
      answer: 1
      explain: "a + b Int mein overflow ho kar negative ban jaata hai. Long mein jodo."
    - q: "IPO mein 'ab kaun afford hai' ke liye kaunsa heap?"
      options: ["Profit par max-heap", "Capital par min-heap", "Profit par min-heap", "Capital par max-heap"]
      answer: 1
      explain: "Sabse sasta project sabse pehle khulta hai → capital par min-heap; khule hue ready max-heap (profit) mein."

