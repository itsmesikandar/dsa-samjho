# 13. Quick revision
revision:
  summary:
    - "Top-k: heap ka size k. Bade chahiye → min-heap; chhote chahiye → max-heap."
    - "Template: add; size > k to poll. Root = kth. O(n log k) time, O(k) space."
    - "Stream aur kam memory mein bhi chalta hai — sort nahi chal sakta."
    - "K-way merge: har list ka head min-heap mein; poll, usi list ka next add. O(N log k)."
    - "Alternatives: sort (k ≈ n), quickselect (O(n) avg), bucket sort (frequency)."
  cheatsheet: |
    ```kotlin
    // kth largest: size k min-heap
    val pq = PriorityQueue<Int>()
    for (x in nums) { pq.add(x); if (pq.size > k) pq.poll() }
    pq.peek()
    // k smallest / closest: PriorityQueue(Collections.reverseOrder()) ya compareByDescending { dist(it) }
    // merge k: heads ka min-heap
    for (h in lists) if (h != null) pq.add(h)
    while (pq.isNotEmpty()) { val n = pq.poll(); tail.next = n; tail = n; n.next?.let { pq.add(it) } }
    ```
  quiz:
    - q: "k sabse bade elements chahiye, size k ka heap. Kaunsa heap?"
      options: ["Max-heap", "Min-heap", "Koi bhi", "Do heaps"]
      answer: 1
      explain: "Root = k bade mein sabse kamzor — wahi naye bade item ke liye jagah khaali karta hai."
    - q: "n = 10 lakh, k = 10. Size k heap se top-k ka time?"
      options: ["O(n log n)", "O(n log k)", "O(k log n)", "O(n²)"]
      answer: 1
      explain: "Har item par size k heap ka kaam log k."
    - q: "K closest points mein distance kaise compare karein?"
      options: ["sqrt(x² + y²)", "x² + y²", "|x| + |y|", "x + y"]
      answer: 1
      explain: "sqrt order nahi badalta; squared distance kaafi aur exact. |x| + |y| alag distance hai."
    - q: "Merge k sorted lists (N kul nodes) heap se — time?"
      options: ["O(N)", "O(N log N)", "O(N log k)", "O(N·k)"]
      answer: 2
      explain: "Heap mein max k heads; har node ek baar add + poll."
    - q: "Top-k largest ka size k min-heap bhara hai, naya x ≤ root. Kya karein?"
      options: ["Add karo", "Skip karo", "Root hatao", "Heap khaali karo"]
      answer: 1
      explain: "Andar ke sab k items x se bade ya barabar — x top k mein nahi aa sakta."

