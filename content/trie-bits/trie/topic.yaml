# 13. Quick revision
revision:
  summary:
    - "Trie: har node ek prefix; edge = letter; word ke end par isEnd (★)."
    - "insert / search / startsWith sab O(L) — dictionary ke size se independent."
    - "search = raasta + isEnd; startsWith = sirf raasta."
    - "Node par extra info insert ke time likho: pass count, top-3 suggestions, word."
    - "'.' wildcard → saare bachchon mein DFS. Bits par trie → maximum XOR."
  cheatsheet: |
    ```kotlin
    class Node { val next = arrayOfNulls<Node>(26); var isEnd = false }
    fun insert(w: String) {
        var c = root
        for (ch in w) { val k = ch - 'a'; if (c.next[k] == null) c.next[k] = Node(); c = c.next[k]!! }
        c.isEnd = true
    }
    fun walk(s: String): Node? { var c = root; for (ch in s) c = c.next[ch - 'a'] ?: return null; return c }
    fun search(w: String) = walk(w)?.isEnd == true
    fun startsWith(p: String) = walk(p) != null
    ```
  quiz:
    - q: "car, cat, cart daale. Trie mein root ke alawa kitne nodes?"
      options: ["10", "5", "4", "6"]
      answer: 1
      explain: "c, a, r, t (cart), t (cat). 'ca' share hua, 'car' bhi."
    - q: "Sirf 'apple' daala. search(\"app\") aur startsWith(\"app\")?"
      options: ["true, true", "false, true", "false, false", "true, false"]
      answer: 1
      explain: "Raasta hai par 'app' ke node par ★ nahi — word nahi, sirf prefix."
    - q: "search(word) ka time? (L = word length, n = words)"
      options: ["O(n)", "O(L)", "O(n · L)", "O(log n)"]
      answer: 1
      explain: "Sirf word ke letter jitne step — n se farak nahi padta."
    - q: "Replace words: roots [a, ab], word \"abc\". Result?"
      options: ["ab", "a", "abc", "bc"]
      answer: 1
      explain: "Pehla ★ 'a' par — sabse chhota root."
    - q: "Kab trie ki jagah HashSet better?"
      options: ["Prefix search", "Sirf poora word hai ya nahi, memory kam chahiye", "Autocomplete", "Wildcard search"]
      answer: 1
      explain: "Exact lookup HashSet bhi O(L) mein, aur 26 pointers per node ka cost nahi."

