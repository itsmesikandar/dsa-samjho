# 13. Quick revision
revision:
  summary:
    - "Recursion = base case + chhote input par khud ko call."
    - "Har call = stack frame. Space = max depth."
    - "Leap of faith: chhote ka jawab sahi maan lo, apna step likho."
    - "Ek sub-call ek baar (pow): O(log n). Do sub-calls (fib, hanoi): O(2ⁿ)."
    - "Deep recursion → StackOverflowError; Kotlin tailrec ya loop."
  cheatsheet: |
    ```kotlin
    fun solve(n: Int): Result {
        if (n <= 1) return BASE            // 1. base case
        val small = solve(n - 1)           // 2. chhota sawaal (bharosa)
        return combine(n, small)           // 3. apna step
    }

    // fast power
    fun pow(x: Double, n: Long): Double {
        if (n == 0L) return 1.0
        val h = pow(x, n / 2)
        return if (n % 2 == 0L) h * h else h * h * x
    }

    tailrec fun sum(n: Long, acc: Long = 0): Long =
        if (n == 0L) acc else sum(n - 1, acc + n)
    ```
  quiz:
    - q: "factorial(4) ke time stack par sabse zyada kitne frames honge (factorial(1) base)?"
      options: ["1", "2", "4", "24"]
      answer: 2
      explain: "factorial(4), (3), (2), (1) — all 4 ek saath, jab tak base return na kare."
    - q: "print(n) call ke BAAD likha hai: show(n − 1); print(n). show(3) ka output?"
      options: ["3 2 1", "1 2 3", "3 1 2", "Kuch nahi"]
      answer: 1
      explain: "Print wapas aate time hota hai — sabse deep (1) pehle wapas aata hai."
    - q: "pow(x, n / 2) * pow(x, n / 2) ki complexity?"
      options: ["O(log n)", "O(n)", "O(n²)", "O(1)"]
      answer: 1
      explain: "Har level par calls double, levels log n → 2^(log n) = n."
    - q: "Hanoi mein 5 disks ke moves?"
      options: ["10", "25", "31", "32"]
      answer: 2
      explain: "2⁵ − 1 = 31."
    - q: "Base case na ho to JVM par kya hoga?"
      options: ["Infinite loop, program atak jaayega", "StackOverflowError", "Compile error", "0 return"]
      answer: 1
      explain: "Har call frame leta hai; stack bhar jaata hai."

