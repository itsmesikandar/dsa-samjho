# 13. Quick revision
revision:
  summary:
    - "5 structure: linear, halving, D&C, multi-branch, memo (+ helper params)."
    - "Time = calls × per-call kaam; space = depth (+ memo)."
    - "Same sub-call 2 baar mat karo — variable mein rakho."
    - "Overlap + pure function → memo (top-down DP)."
    - "Games: score difference = uthaya − saamne wale ka best."
  cheatsheet: |
    ```kotlin
    // D&C
    fun go(l: Int, r: Int): Int {
        if (l == r) return a[l]
        val m = (l + r) / 2
        return combine(go(l, m), go(m + 1, r))
    }

    // memo
    fun f(n: Int, memo: HashMap<Int, Int>): Int {
        if (n <= 1) return 1
        memo[n]?.let { return it }
        return (f(n - 1, memo) + f(n - 2, memo)).also { memo[n] = it }
    }

    // game (difference)
    fun d(l: Int, r: Int): Int =
        if (l == r) a[l] else maxOf(a[l] - d(l + 1, r), a[r] - d(l, r - 1))
    ```
  quiz:
    - q: "T(n) = 2T(n/2) + O(n) ki complexity?"
      options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      answer: 1
      explain: "log n levels, har level par total O(n) kaam."
    - q: "Climbing Stairs n = 4 ke tareeke?"
      options: ["4", "5", "6", "8"]
      answer: 1
      explain: "ways(4) = ways(3) + ways(2) = 3 + 2 = 5."
    - q: "Memo kab galat answer de sakta hai?"
      options: ["Jab n bada ho", "Jab function kisi bahar ke badalte state par depend kare", "Jab recursion deep ho", "Kabhi nahi"]
      answer: 1
      explain: "Memo maanta hai: same parameters = same answer."
    - q: "Binary strings of length n generate karne mein stack ki depth?"
      options: ["O(1)", "O(n)", "O(2ⁿ)", "O(n²)"]
      answer: 1
      explain: "Ek time par sirf ek raasta (root se leaf) stack par — n levels."
    - q: "[2, 1] — Predict the Winner, d(0, 1)?"
      options: ["−1", "1", "3", "0"]
      answer: 1
      explain: "Left: 2 − 1 = 1; right: 1 − 2 = −1 → max = 1."

