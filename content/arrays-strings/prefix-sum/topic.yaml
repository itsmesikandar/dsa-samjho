    hint: "Har j ke liye kitne i < j jinke liye lower ≤ pre[j] − pre[i] ≤ upper. Merge sort ke merge step mein do pointers se gino."
  - name: Max Sum of Rectangle No Larger Than K
    platform: LeetCode
