# 13. Quick revision
revision:
  summary:
    - "pre[k] = pehle k items ka sum; size n + 1, pre[0] = 0."
    - "sum(l..r) = pre[r+1] − pre[l] — O(1) per query, O(n) build."
    - "Prefix + suffix se 'left × right' wale sawaal (product except self)."
    - "2D: build mein kona ghatao, query mein kona wapas jodo."
    - "Range updates → difference array; updates + queries dono → Fenwick/segment tree."
  cheatsheet: |
    ```
    // 1D
    pre[i+1] = pre[i] + arr[i]
    sum(l, r) = pre[r+1] - pre[l]

    // 2D
    pre[r+1][c+1] = g[r][c] + pre[r][c+1] + pre[r+1][c] - pre[r][c]
    sum = pre[r2+1][c2+1] - pre[r1][c2+1] - pre[r2+1][c1] + pre[r1][c1]

    // Difference array
    diff[l] += v; diff[r+1] -= v;  then prefix of diff
    ```
  quiz:
    - q: "arr = [2, 4, 6, 8]. pre (size 5) kya hai?"
      options: ["[2, 6, 12, 20]", "[0, 2, 6, 12, 20]", "[0, 2, 4, 6, 8]", "[2, 4, 6, 8, 20]"]
      answer: 1
      explain: "pre[0] = 0, phir running totals."
    - q: "pre se arr[1..3] ka sum?"
      options: ["pre[3] − pre[1]", "pre[4] − pre[1]", "pre[4] − pre[0]", "pre[3] − pre[0]"]
      answer: 1
      explain: "pre[r+1] − pre[l] = pre[4] − pre[1]."
    - q: "q queries, n items. Prefix sum ke saath total time?"
      options: ["O(n × q)", "O(n + q)", "O(q log n)", "O(n²)"]
      answer: 1
      explain: "O(n) build + O(1) har query."
    - q: "Array mein baar-baar updates ho rahe hain aur queries bhi. Best?"
      options: ["Prefix sum har baar", "Fenwick / segment tree", "Sorting", "Kuch nahi"]
      answer: 1
      explain: "Update aur query dono O(log n)."
    - q: "Range [l, r] mein v jodna, difference array mein?"
      options: ["diff[l] += v, diff[r] −= v", "diff[l] += v, diff[r+1] −= v", "diff[l..r] += v", "diff[r] += v"]
      answer: 1
      explain: "r ke baad effect khatam karne ke liye r + 1 par −v."

