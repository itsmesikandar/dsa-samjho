meta:
  id: array
  chapter: arrays-strings
  title: Array
  subtitle: Ek line mein rakhe dabbe — index se seedha pahuncho
  level: beginner
  minutes: 35
  prereqs: [memory-basics, big-o-time]
  tags: [array, index, contiguous-memory, in-place]

# 1. Ye kya hai?
what:
  body: |
    **Array** ek container hai jisme **ek hi type** ke items (jaise sirf `Int`) **ek line mein, ek ke baad ek** rakhe jaate hain.

    - Har item ka ek number hota hai — **index**. Index **0 se** shuru hota hai.
    - Array ki **size fixed** hoti hai. Ek baar 5 ka banaya, to 5 ka hi rahega.
    - Kisi bhi item tak index se **seedha** pahunch sakte ho: `arr[3]`.

    ```kotlin
    val marks = intArrayOf(90, 75, 60, 85)   // 4 items
    println(marks[0])  // 90 -> pehla item
    println(marks[3])  // 85 -> aakhri item (index = size - 1)
    ```

    > [!yaad]
    > 4 items ka array → index **0, 1, 2, 3**. `arr[4]` exist hi nahi karta. Aakhri index hamesha `size - 1` hota hai.
  analogy: |
    **Railway coach ki numbered seats** socho. S4 coach mein seats line mein lagi hain: 1, 2, 3… TT ko seat 37 chahiye, to wo har seat check nahi karta — seedha 37 number pe pahunch jaata hai.

    Array bhi bilkul aisa hi hai. Bas do fark:
    - Count **0 se** shuru hoti hai (seat 1 = index 0).
    - Coach mein seats na badhti hain na ghatti — waise hi array ki size fixed hai.

# 2. Kyun chahiye?
why:
  body: |
    Socho class mein 60 students hain aur sabke marks store karne hain. Array ke bina:

    ```kotlin
    val m1 = 90
    val m2 = 75
    // ... m60 tak 60 alag variables!
    ```

    Isme 3 problem hain:
    1. **Loop nahi chala sakte** — saare marks ka total chahiye to 60 baar `+` likhna padega.
    2. **15th student chahiye** to `m15` naam yaad rakho — number se nahi pahunch sakte.
    3. Kal 61 students ho gaye to code hi badalna padega.

    Array ek **naam** deta hai (`marks`) aur ek **index** deta hai (`marks[14]`). Ab loop chalao, sort karo, kuch bhi karo.

    **Sabse badi power:** index se access **O(1)** hai — item kitna bhi door ho, time same. Ye kaise hota hai, agle section ke animation mein dekho.

    > [!socho]
    > Agar items memory mein ek line mein na hote, idhar-udhar bikhre hote, to kya `arr[1000]` seedha mil paata?
    >
    > Nahi! Tab shuru se 1000 items tak chal ke dhoondhna padta — yahi linked list ki kahaani hai. Array ka O(1) access **contiguous memory** (ek ke baad ek) ki wajah se hi possible hai.

# 3. Visual intro
visual:
  body: |
    Neeche dekho array **RAM (memory)** mein kaise baithta hai. Har dabbe ke upar uska **address** likha hai.

    Formula yaad rakho:

    **address of arr[i] = base address + i × (ek item ka size)**

    `Int` = 4 bytes. To `arr[3]` ka address = base + 3 × 4 = base + 12.

    > [!yaad]
    > JVM (Kotlin/Java) mein asli address hum dekh nahi sakte — ye numbers samjhane ke liye hain. Array object ke saath ek chhota header bhi hota hai (jisme length etc. hoti hai). Par idea bilkul yahi hai.
  viz: { tracer: memoryLayout }

# 4. Kaise kaam karta hai
how:
  body: |
    Access to O(1) hai. Par **beech mein naya item daalna** mehenga hai. Kyun? Dabbe line mein chipke hain — beech mein jagah banane ke liye baaki items ko **shift karna (shift)** padta hai.

    Index par value daalne ka plan:
    1. Check karo — jagah bachi hai? Index sahi range mein hai?
    2. **Aakhri item se shuru karke** index tak, har item ko ek step right copy karo.
    3. Ab index wala dabba "khaali" hai — value rakh do.
    4. `size` ek badha do.

    > [!socho]
    > Shifting **aage se** (index se right ki taraf chalte hue) kyun nahi karte?
    >
    > Kyunki `arr[i+1] = arr[i]` karte hi `arr[i+1]` ka purana value mit jaata — agla step galat value copy karta. Peeche se chalo to har value pehle hi safe jagah pahunch jaati hai.

    Play dabao aur code ki highlighted line saath mein dekho. "Apna input try karo" se **index 0** (worst case) aur **index = size** (best case) bhi try karo.
  viz: { tracer: insertAt }
  code: how

# 5. Operations table
operations:
  - op: "Access / update `arr[i]`"
    time: O(1)
    space: O(1)
    why: "Address = base + i × size — bas ek calculation. Item kahin bhi ho, time same."
  - op: "Search (unsorted array)"
    time: O(n)
    space: O(1)
    why: "Pata nahi item kahan hai — worst case mein har item dekhna padega."
  - op: "Search (sorted array, binary search)"
    time: O(log n)
    space: O(1)
    why: "Har step mein aadha hissa hata do. Chapter 5 mein detail mein."
  - op: "Insert at end (jagah ho to)"
    time: O(1)
    space: O(1)
    why: "Kisi ko shift karna nahi — bas `arr[size] = x` aur `size++`."
  - op: "Insert at index i"
    time: O(n)
    space: O(1)
    why: "i ke baad ke saare items ek step right shift karne padte hain."
  - op: "Delete at index i"
    time: O(n)
    space: O(1)
    why: "Gap bharne ke liye i ke baad ke saare items left shift hote hain."
  - op: "Delete at end"
    time: O(1)
    space: O(1)
    why: "Bas `size` ek kam kar do."
  - op: "Traverse (har item dekhna)"
    time: O(n)
    space: O(1)
    why: "n items, har ek sirf ek baar."
  - op: "Resize (bada array chahiye)"
    time: O(n)
    space: O(n)
    why: "Size fixed hai, isliye naya bada array banake saare items copy karne padte hain."

# 6. Code
code:
  - title: Array banana, padhna, likhna, loop chalana
    file: basics
    note: |
      Kotlin mein `IntArray` = Java ka `int[]` (fast, primitive). `Array<Int>` alag cheez hai — usme har number ek object (boxed `Integer`) hota hai: slow aur zyada memory. DSA mein `IntArray` use karo.
  - title: Index se delete (left shift)
    file: delete-at
    note: |
      Insert ka ulta: gap bharne ke liye baad ke items left shift hote hain. Isliye ye bhi O(n) hai.

# 7. Examples
examples:
  - id: find-max
    level: easy
    title: Array mein sabse bada number dhoondo
    problem: |
      Ek integer array diya hai (kam se kam 1 item). Usme se **sabse bada number** return karo.

      Example: `[3, 8, 2, 9, 4]` → `9`, aur `[-5, -2, -9]` → `-2`.
    intuition: |
      Class mein sabse lamba bachcha dhoondhna ho to kya karoge? Line mein chalte jao aur **"abhi tak ka sabse lamba"** yaad rakho. Koi usse lamba mile to yaad badal do.

      Bas yahi: ek variable `max`, pehle item se shuru, baaki har item se compare.

      > [!galti]
      > `max = 0` se shuru mat karo. Array `[-5, -2, -9]` hua to answer 0 aayega — jo array mein hai hi nahi!
    dryRun: |
      Array: `[3, 8, 2, 9, 4]`

      | i | arr[i] | arr[i] > max? | max |
      |---|---|---|---|
      | – | – | shuru | 3 |
      | 1 | 8 | haan | 8 |
      | 2 | 2 | nahi | 8 |
      | 3 | 9 | haan | 9 |
      | 4 | 4 | nahi | 9 |

      Answer: **9**
    viz: { tracer: findMax }
    code: ex1-find-max
    complexity:
      time: O(n)
      space: O(1)
      why: "Har item sirf ek baar dekha, aur sirf ek extra variable `max` use kiya."

  - id: reverse
    level: medium
    title: Array ko in-place ulta karo
    problem: |
      Ek array ko **ulta (reverse)** karo — lekin **nayi array mat banao**. Usi array ke andar items ki jagah badlo. Isko **in-place** kehte hain.

      Example: `[1, 2, 3, 4, 5]` → `[5, 4, 3, 2, 1]`
    intuition: |
      Nayi array banake ulta copy karna aasaan hai, par usme O(n) extra memory lagti hai.

      Dhyaan se dekho: ulta karne mein **pehla aur aakhri** jagah badalte hain, **doosra aur second-last** jagah badalte hain… Matlab dono edges se ek-ek pair swap karo aur andar ki taraf badho.

      2 pointers rakho — `l` shuru pe, `r` end pe. Swap karo, phir `l++`, `r--`. Jab `l` aur `r` mil jaayein (ya cross kar jaayein) — kaam khatam.

      > [!tip]
      > Ye **two pointers** pattern ka pehla taste hai. Chapter 3 mein ye bahut kaam aayega.
    dryRun: |
      Array: `[1, 2, 3, 4, 5]`

      | Step | l | r | Kaam | Array |
      |---|---|---|---|---|
      | 1 | 0 | 4 | swap 1 ↔ 5 | [5, 2, 3, 4, 1] |
      | 2 | 1 | 3 | swap 2 ↔ 4 | [5, 4, 3, 2, 1] |
      | 3 | 2 | 2 | l = r, ruk jao | [5, 4, 3, 2, 1] |

      Sirf **n/2 = 2 swaps** lage.
    viz: { tracer: reverseArray }
    code: ex2-reverse
    complexity:
      time: O(n)
      space: O(1)
      why: "n/2 swaps hote hain (constant hata do → O(n)). Sirf `l`, `r`, `temp` — koi nayi array nahi."

  - id: rotate
    level: tricky
    title: Array ko k steps right rotate karo
    source: { name: Rotate Array, platform: LeetCode, url: "https://leetcode.com/problems/rotate-array/" }
    problem: |
      Ek array aur ek number `k` diya hai. Har item ko **k jagah right** shift karo. Jo items end se bahar giren, wo gol ghoom ke shuru mein aa jaayein. **Extra array use kiye bina** karo.

      Example: `[1, 2, 3, 4, 5, 6, 7]`, `k = 3` → `[5, 6, 7, 1, 2, 3, 4]`
    intuition: |
      **Pehla idea (brute force):** ek step rotate karo, aise k baar. Har step O(n) → total **O(n·k)**. k bada ho to bahut slow.

      **Doosra idea:** nayi array banao aur `result[(i + k) % n] = arr[i]` rakho. Time O(n), par **O(n) extra space** lagi.

      **Smart idea (reversal trick):** answer `[5, 6, 7, 1, 2, 3, 4]` ko dhyaan se dekho — aakhri 3 items aage aa gaye, pehle 4 peeche chale gaye. Ye kaam 3 reverse se ho jaata hai:
      1. Poora array ulta → `[7, 6, 5, 4, 3, 2, 1]` (aakhri 3 aage aa gaye, par ulte)
      2. Pehle k items ulte → `[5, 6, 7, 4, 3, 2, 1]`
      3. Baaki items ulte → `[5, 6, 7, 1, 2, 3, 4]` ✓

      > [!galti]
      > `k` array ki size se bada ho sakta hai (jaise k = 10, n = 7). Pehle `k % n` karo, warna index bahar chala jaayega.
    dryRun: |
      Array: `[1, 2, 3, 4, 5, 6, 7]`, k = 3 → steps = 3 % 7 = 3

      | Step | Kya ulta kiya | Array |
      |---|---|---|
      | 0 | shuru | [1, 2, 3, 4, 5, 6, 7] |
      | 1 | poora (0..6) | [7, 6, 5, 4, 3, 2, 1] |
      | 2 | pehle 3 (0..2) | [5, 6, 7, 4, 3, 2, 1] |
      | 3 | baaki (3..6) | [5, 6, 7, 1, 2, 3, 4] |
    viz: { tracer: rotateRight }
    code: ex3-rotate
    complexity:
      time: O(n)
      space: O(1)
      why: "3 reverse; har item zyada se zyada 2 baar swap hota hai → O(n). Koi nayi array nahi → O(1)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Items ki **count pehle se pata** hai, ya bahut kam badalti hai."
    - "**Index se baar-baar access** chahiye — `arr[i]` O(1) hai."
    - "Data ko **order mein** rakhna hai aur shuru se end tak loop chalana hai."
    - "Memory kam aur speed zyada chahiye — koi extra pointer nahi, CPU cache-friendly."
  avoid:
    - "**Beech mein baar-baar insert/delete** karna hai — har baar O(n) shifting."
    - "Size pehle se pata nahi aur badhti rahegi — `ArrayList` / `MutableList` (dynamic array) lo."
    - "Baar-baar value se **dhoondhna** hai (kya 42 hai?) — unsorted array mein O(n), HashSet mein O(1)."
  signals:
    - keyword: "index i par item, i-th element"
      think: "Array ka O(1) access."
    - keyword: "in-place, O(1) extra space"
      think: "Nayi array nahi — swap, two pointers ya reverse trick se usi array mein kaam karo."
    - keyword: "rotate, shift by k"
      think: "Pehle `k % n`, phir reversal trick."
    - keyword: "subarray, contiguous elements"
      think: "Array patterns — sliding window, prefix sum, Kadane (aage ke chapters)."

# 9. Real-world
realWorld:
  - where: "Android: RecyclerView / LazyColumn ki list"
    how: "Adapter ke peeche `ArrayList` hoti hai — jo andar se array hi hai. `getItem(position)` O(1) isi wajah se hai."
  - where: "Images (Bitmap, Flutter `Uint8List`)"
    how: "Photo ke saare pixels ek bade array mein line se rakhe hote hain. Pixel (x, y) = `pixels[y * width + x]`."
  - where: "Audio / video buffers"
    how: "Mic ka sound aur video frames `ByteArray` buffers mein aate hain — contiguous memory se copy aur processing fast hoti hai."
  - where: "Databases aur Operating System"
    how: "DB pages, OS ki page table, CPU cache lines — sab fixed-size blocks ke arrays hain, kyunki index se seedha jump fast hai."
  - where: "Game boards aur lookup tables"
    how: "Ludo/chess board ek array (ya 2D array), `daysInMonth[month]` jaisi table — index se turant answer."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Loop mein `<=` / `0..size` lagana"
    type: off-by-one
    wrong: |
      ```kotlin
      for (i in 0..arr.size) println(arr[i])   // 0..size mein size bhi include hai!
      ```
      Last step pe `arr[size]` → **ArrayIndexOutOfBoundsException**.
    right: |
      ```kotlin
      for (i in 0 until arr.size) println(arr[i])   // ya: for (i in arr.indices)
      ```
      Java mein: `i < arr.length` — `<=` nahi.
  - title: "Khaali array mein `arr[0]` padhna"
    type: empty
    wrong: |
      `var max = arr[0]` — array khaali hua to seedha crash.
    right: |
      Pehle check karo: `if (arr.isEmpty())` (Java: `arr.length == 0`). Interview mein bolo: "Main maan raha hoon array khaali nahi hai — warna is case ko alag handle karunga."
  - title: "Bade numbers jodne par overflow"
    type: overflow
    wrong: |
      ```kotlin
      var sum = 0          // Int ki limit ~2.1 billion (2,147,483,647)
      for (x in arr) sum += x
      ```
      10⁵ items, har item 10⁹ → sum Int mein fit nahi hota aur **chupke se galat (negative) answer** aata hai. Koi error nahi aata!
    right: |
      ```kotlin
      var sum = 0L         // Long use karo
      for (x in arr) sum += x
      ```
  - title: "2 arrays ko `==` se compare karna"
    type: logic
    wrong: |
      `a == b` sirf ye check karta hai ki **dono same object** hain — andar ke values nahi. Same values wale 2 alag arrays par bhi `false` aayega.
    right: |
      Kotlin: `a.contentEquals(b)`. Java: `Arrays.equals(a, b)`.
  - title: "`val b = a` ko copy samajhna"
    type: logic
    wrong: |
      `val b = a` nayi array nahi banata — dono **same array** ko point karte hain. `b[0] = 99` kiya to `a[0]` bhi 99 ho gaya!
    right: |
      Asli copy: Kotlin `a.copyOf()`, Java `a.clone()` ya `Arrays.copyOf(a, a.length)`.
  - title: "Rotate mein `k % n` bhool jaana"
    type: off-by-one
    right: |
      k array ki size se bada ho sakta hai — hamesha pehle `k % n`. Aur `n == 0` ho to `%` se pehle hi return karo (0 se modulo = crash).

# 11. Interview corner
interview:
  questions:
    - q: "`arr[i]` O(1) kaise hai?"
      a: |
        Array ke items memory mein **ek line mein** (contiguous) hote hain aur sab **same size** ke. Isliye address ek formula se nikal aata hai: `base + i × size`. Ek multiplication + ek addition — n kitna bhi bada ho, time same.
    - q: "Index 0 se kyun shuru hota hai, 1 se kyun nahi?"
      a: |
        Index asal mein **offset** hai — base se kitna door. Pehla item base par hi hai, to offset 0. 1 se shuru karte to har access par `(i - 1)` calculate karna padta.
    - q: "Array aur ArrayList mein kya fark hai?"
      a: |
        - Array ki size **fixed**; ArrayList **badh sakti** hai.
        - ArrayList andar se array hi hai. Bhar jaane par naya bada array (Java mein ~1.5×) banake copy karti hai. Isliye `add()` **amortized O(1)** hai.
        - `ArrayList<Integer>` mein numbers boxed objects hote hain — `int[]` se zyada memory.
    - q: "Beech mein insert O(n) kyun hai?"
      a: |
        Jagah banane ke liye index ke baad ke saare items ek step right shift karne padte hain. Worst case (index 0) mein saare n items.
    - q: "Agar order matter nahi karta, to index i wala item O(1) mein kaise delete karoge?"
      followUp: true
      a: |
        **Swap with last** trick: `arr[i] = arr[size - 1]`, phir `size--`. Koi shifting nahi → O(1). Sirf tab chalega jab items ka order zaroori na ho.
    - q: "Kotlin mein `IntArray` aur `Array<Int>` mein kya fark hai?"
      a: |
        `IntArray` = Java ka `int[]` — primitive numbers seedhe line mein. `Array<Int>` = `Integer[]` — har item ek alag object ka reference. `IntArray` fast hai aur kam memory leta hai.
    - q: "Contiguous memory ka O(1) access ke alawa aur kya fayda hai?"
      a: |
        **CPU cache.** CPU memory se ek baar mein poora chunk (cache line) uthata hai. Array ke agle items usi chunk mein hote hain, to loop bahut fast chalta hai. Linked list ke nodes bikhre hote hain — har node ke liye nayi memory trip.
    - q: "Array ki size runtime par badal sakte ho?"
      a: |
        Nahi. Naya bada array banao aur saare items copy karo — O(n). `ArrayList` bas yahi kaam automatic karti hai.
    - q: "Array ko O(1) extra space mein k steps rotate karo."
      followUp: true
      a: |
        Reversal trick: `k %= n`, phir poora reverse, pehle k reverse, baaki reverse. O(n) time, O(1) space. (Brute force O(n·k) aur extra array wala O(n) space — dono batao, phir optimize karo.)
    - q: "Java mein array kahan store hota hai?"
      a: |
        Array ek **object** hai — **heap** par banta hai. Variable (`int[] a`) mein sirf uska reference hota hai. Naye array mein default values hoti hain: numbers 0, boolean `false`, objects `null`.
  mayAsk:
    - "Ek hi loop mein second largest element nikaalo."
    - "Check karo array sorted hai ya nahi."
    - "Sorted array se duplicates hatao (in-place)."
    - "1 se n tak ke numbers mein se missing number dhoondo."
    - "2 sorted arrays ko merge karo."

# 12. Practice
practice:
  - name: Running Sum of 1d Array
    platform: LeetCode
    num: 1480
    url: "https://leetcode.com/problems/running-sum-of-1d-array/"
    level: easy
    pattern: Traverse + running total
    hint: "`result[i] = result[i - 1] + nums[i]`. Same array mein bhi kar sakte ho."
  - name: Max Consecutive Ones
    platform: LeetCode
    num: 485
    url: "https://leetcode.com/problems/max-consecutive-ones/"
    level: easy
    pattern: Single pass counter
    hint: "2 variables: current streak aur best streak. 0 aaye to current = 0."
  - name: Remove Element
    platform: LeetCode
    num: 27
    url: "https://leetcode.com/problems/remove-element/"
    level: easy
    pattern: In-place write pointer
    hint: "Ek pointer `k` rakho. Jo value hatani nahi hai, use `nums[k]` mein likho aur `k++`."
  - name: Find All Duplicates in an Array
    platform: LeetCode
    num: 442
    url: "https://leetcode.com/problems/find-all-duplicates-in-an-array/"
    level: medium
    pattern: Index ko marker banana
    hint: "Values 1..n hain. Value v dikhe to index v-1 wale number ko negative karke mark karo. Pehle se negative mile = duplicate."
  - name: Next Permutation
    platform: LeetCode
    num: 31
    url: "https://leetcode.com/problems/next-permutation/"
    level: medium
    pattern: Right se scan + reverse
    hint: "Right se pehla i dhoondo jahan `nums[i] < nums[i+1]`. Right side mein usse just bada number swap karo, phir i+1 se end tak reverse."
  - name: Rearrange Array Elements by Sign
    platform: LeetCode
    num: 2149
    url: "https://leetcode.com/problems/rearrange-array-elements-by-sign/"
    level: medium
    pattern: Alag-alag write pointers
    hint: "Positive numbers index 0, 2, 4… par aur negative 1, 3, 5… par — result array mein seedha likho."
  - name: First Missing Positive
    platform: LeetCode
    num: 41
    url: "https://leetcode.com/problems/first-missing-positive/"
    level: hard
    pattern: Cyclic placement (value ko apne index par bhejo)
    hint: "1..n range ki har value v ko swap karke index v-1 par bhejo. Phir pehla index jahan `nums[i] != i + 1`, wahi answer."
  - name: Trapping Rain Water
    platform: LeetCode
    num: 42
    url: "https://leetcode.com/problems/trapping-rain-water/"
    level: hard
    pattern: Left max / right max arrays
    hint: "Har bar ke upar paani = min(leftMax, rightMax) - height. leftMax aur rightMax pehle 2 alag arrays mein nikaal lo."

# 13. Quick revision
revision:
  summary:
    - "Array = same type ke items, memory mein ek line mein (contiguous), size fixed."
    - "Index 0 se shuru hota hai; aakhri index `size - 1`."
    - "`arr[i]` O(1) hai kyunki address = base + i × size."
    - "Beech mein insert/delete O(n) (shifting); end par O(1)."
    - "In-place tricks: two-pointer swap, reversal (rotate), aur `k % n`."
  cheatsheet: |
    | Kaam | Kotlin | Java |
    |---|---|---|
    | Banana | `IntArray(n)`, `intArrayOf(1, 2)` | `new int[n]`, `{1, 2}` |
    | Size | `arr.size` | `arr.length` |
    | Print | `arr.contentToString()` | `Arrays.toString(arr)` |
    | Copy | `arr.copyOf()` | `arr.clone()` |
    | Compare | `a.contentEquals(b)` | `Arrays.equals(a, b)` |
    | Sort | `arr.sort()` | `Arrays.sort(arr)` |

    **Complexity:** access O(1) · search O(n) · beech mein insert/delete O(n) · end par O(1)
