      options: ["1", "9", "Error", "7"]
      answer: 1
      explain: "Index 0 se: arr[0]=4, arr[1]=7, arr[2]=1, arr[3]=9."
    - q: "Array mein index se access O(1) kyun hai?"
      options: ["Array chhota hota hai", "Address formula se seedha nikal aata hai (base + i × size)", "Array hamesha sorted hota hai", "CPU fast hota hai"]
      answer: 1
      explain: "Contiguous memory + same size items = ek formula se seedha address."
    - q: "10 items ke array mein index 0 par insert karne ke liye kitne items shift honge?"
      options: ["0", "1", "5", "10"]
      answer: 3
      explain: "Saare 10 items ek step right — isliye worst case O(n)."
    - q: "`val b = a` (a ek IntArray hai) ke baad `b[0] = 5` karne se kya hoga?"
      options: ["Sirf b badlega", "a aur b dono mein 5 dikhega — dono same array hain", "Compile error", "a ki nayi copy ban jaayegi"]
      answer: 1
      explain: "`val b = a` sirf reference copy karta hai. Asli copy ke liye `copyOf()`."
    - q: "n = 5, k = 12 ho to rotate actually kitne steps ka hoga?"
      options: ["12", "5", "2", "7"]
      answer: 2
      explain: "12 % 5 = 2. Har 5 steps ke baad array wapas waisa hi ho jaata hai."

