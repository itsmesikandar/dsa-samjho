# 13. Quick revision
revision:
  summary:
    - "Order matter → permutation (used[], har level 0 se); nahi → combination (start, i + 1)."
    - "Permutations n!, combinations C(n, k)."
    - "Duplicates: sort + (a[i] == a[i−1] && !used[i−1]) skip."
    - "Combination pruning: i ≤ n − need + 1."
    - "Ginti / k-th / next — formula ya O(n) algorithm, saare banana nahi."
  cheatsheet: |
    ```kotlin
    // permutation
    for (i in a.indices) {
        if (used[i] || (i > 0 && a[i] == a[i-1] && !used[i-1])) continue
        used[i] = true; path.add(a[i]); bt(); path.removeLast(); used[i] = false
    }
    // combination
    for (i in start..n - (k - path.size) + 1) { path.add(i); bt(i + 1); path.removeLast() }
    ```
  quiz:
    - q: "[1, 2, 3, 4] ke kitne permutations?"
      options: ["12", "16", "24", "4"]
      answer: 2
      explain: "4! = 24."
    - q: "C(5, 2) = ?"
      options: ["10", "20", "25", "5"]
      answer: 0
      explain: "5 × 4 / 2 = 10."
    - q: "[1, 1, 2] ke alag permutations?"
      options: ["6", "3", "2", "1"]
      answer: 1
      explain: "3! / 2! = 3."
    - q: "Combination mein agli call?"
      options: ["bt(0)", "bt(i)", "bt(i + 1)", "bt(start + 1)"]
      answer: 2
      explain: "Sirf aage ke items — dobara order nahi banta."
    - q: "Permutation mein used[] kyun?"
      options: ["Speed", "Ek item ek path mein ek hi baar aaye", "Sorting", "Memory"]
      answer: 1
      explain: "Har level 0 se loop hai — used se dobara lene se bachte hain."

