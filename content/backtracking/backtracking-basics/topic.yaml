meta:
  id: backtracking-basics
  chapter: backtracking
  title: Backtracking basics
  subtitle: Choose, explore, un-choose — saare raaste try karo, galat lage to wapas aao
  level: intermediate
  minutes: 40
  prereqs: [recursion-patterns]
  tags: [backtracking, subsets, pruning, decision-tree]

# 1. Ye kya hai?
what:
  body: |
    **Backtracking** = saare possible jawab banane ka tareeka — ek-ek decision lo, aage badho, aur jab raasta khatam (ya galat) ho to **wapas aa ke decision badlo**.

    3 step (har backtracking code mein):
    1. **Choose** — ek option choose karo (path mein daalo).
    2. **Explore** — baaki decisions ke liye recursion.
    3. **Un-choose** — option wapas nikaalo, taaki agla option saaf state se try ho.

    ```kotlin
    fun bt(state) {
        if (poora ho gaya) { res.add(path.toList()); return }
        for (option in options(state)) {
            if (!valid(option)) continue   // pruning
            path.add(option)               // choose
            bt(next state)                 // explore
            path.removeAt(path.size - 1)   // un-choose
        }
    }
    ```

    > [!yaad]
    > Ye **multi-branch recursion** hi hai (Recursion patterns) — bas ek shared `path` jise har step ke baad **undo** karte hain. Answer list mein hamesha **copy** daalo (`path.toList()`).
  analogy: |
    **Bhool-bhulaiya (maze).** Har mod par ek raasta choose karo. Aage dead end mila? **Wapas pichhle mod tak** aao aur doosra raasta lo. Tab tak jab tak bahar ka raasta na mile (ya saare raaste dekh lo).

    Wapas aate time jo chalk ka mark lagaya tha, hata do — yahi "un-choose".

# 2. Kyun chahiye?
why:
  body: |
    Kuch problems ka koi formula / greedy nahi — **saare options** dekhne padte hain: saare subsets, saare permutations, Sudoku, N-Queens, word search.

    Brute force "sab bana ke check karo" bhi yahi hai, par backtracking **smart** hai:
    - Ek-ek decision lete time hi galat raasta pehchaan lo → **poori branch kaat do** (pruning). Combination Sum mein bada number aaya → aage ke sab chhod do.
    - Ek hi `path` reuse — har option ke liye nayi list nahi.

    > [!socho]
    > `res.add(path)` (bina copy) likha to kya hoga?
    >
    > Sab entries **same list object** ko point karengi — aur aakhir mein path khaali ho jaata hai. Result: `[[], [], [], …]`. Hamesha `path.toList()` / `new ArrayList<>(path)`.

# 3. Visual intro
visual:
  body: |
    Har item par 2 raaste: **+** (lo) ya **−** (chhodo). Ye **decision tree** hai — har patta (leaf) ek subset.

    Dekho DFS kaise ek branch ke end tak jaata hai, phir **wapas** aa ke doosri branch.
  viz: { tracer: subsetTree }

# 4. Kaise kaam karta hai
how:
  body: |
    **Subsets** (loop wala structure):
    - Har call par path **khud ek subset** hai → result mein copy.
    - `start` se aage ke har item ke liye: choose → `bt(i + 1)` → un-choose.
    - `i + 1` (aur `start`) se **peeche ke items dobara nahi** aate — isliye `[1, 2]` aur `[2, 1]` dono nahi bante.

    `[1, 2, 3]` → `[], [1], [1,2], [1,2,3], [1,3], [2], [2,3], [3]`

    > [!tip]
    > Do structure yaad rakho: **loop wala** (har call par "agla kaun?" — subsets, combinations) aur **lo/chhodo wala** (har item par 2 raaste — code section). Dono same answers, alag order.
  viz: { tracer: subsetsTrace }
  code: how

# 5. Operations table
operations:
  - op: "Subsets (n items)"
    time: O(n · 2ⁿ)
    space: "O(n) stack + output"
    why: "2ⁿ subsets, har copy O(n)."
  - op: "Permutations"
    time: O(n · n!)
    space: "O(n) + output"
    why: "n! orders, har copy O(n) (agla topic)."
  - op: "Combinations (n choose k)"
    time: O(k · C(n, k))
    space: O(k)
    why: "Har combination ek baar."
  - op: "Pruning ka fayda"
    time: "Worst same, practically bahut kam"
    space: "same"
    why: "Galat branches jaldi kat jaati hain."
  - op: "Palindrome partitioning"
    time: O(n · 2ⁿ)
    space: O(n)
    why: "Har gap par kaato ya na kaato; palindrome check O(n)."
  - op: "Recursion stack"
    time: "apply nahi"
    space: "O(depth)"
    why: "Depth = decisions ki count (n)."

# 6. Code
code:
  - title: Lo / chhodo wala structure
    file: take-skip
    note: |
      Har item ke liye ek level: pehle **lo** (path mein daalo, aage jao, wapas nikaalo), phir **chhodo** (seedha aage). Leaf par (saare items ka decision) result.

      Jab har item par binary choice ho (subset sum, target sum, XOR) — ye structure seedha fit hota hai. Aur memo lagane mein aasaan (DP chapter).

# 7. Examples
examples:
  - id: subset-xor
    level: easy
    title: Saare subsets ke XOR ka jod
    source: { name: Sum of All Subset XOR Totals, platform: LeetCode, url: "https://leetcode.com/problems/sum-of-all-subset-xor-totals/" }
    problem: |
      Har subset ke numbers ka XOR nikaalo (khaali subset = 0), phir sab subsets ke XOR jodo.

      Example: `[5, 1, 6]` → **28**
    intuition: |
      Lo / chhodo structure, par path ki jagah **running XOR** parameter mein:
      - Lo: `go(i + 1, x xor nums[i])`
      - Chhodo: `go(i + 1, x)`
      - Leaf: `x` return; dono raaston ka jod upar.

      State **parameter** mein ho (Int, immutable) to un-choose ki zaroorat hi nahi — wapas aate hi purana value.

      > [!socho]
      > O(n) trick: har bit jo kisi bhi number mein hai, theek aadhe subsets (2^(n−1)) mein "on" hoti hai → answer = (sabka OR) × 2^(n−1). [5,1,6]: OR = 7, × 4 = 28 ✓.
    dryRun: |
      `[5, 1, 6]` ke subsets: {} 0, {5} 5, {1} 1, {6} 6, {5,1} 4, {5,6} 3, {1,6} 7, {5,1,6} 2

      Jod: 0 + 5 + 1 + 6 + 4 + 3 + 7 + 2 = **28**
    viz: { tracer: xorTrace }
    code: ex1-xor
    complexity:
      time: O(2ⁿ)
      space: "O(n) stack"
      why: "Har item par 2 raaste."

  - id: combination-sum
    level: medium
    title: Combination Sum — dobara le sakte ho
    source: { name: Combination Sum, platform: LeetCode, url: "https://leetcode.com/problems/combination-sum/" }
    problem: |
      Alag-alag positive candidates aur `target`. Har number **kitni bhi baar** le sakte ho. Saare **unique** combinations jinka sum = target.

      Example: `[2, 3, 6, 7]`, target 7 → `[[2, 2, 3], [7]]`
    intuition: |
      Loop wala structure, `remain` ke saath:
      - `remain == 0` → mila.
      - Option `i` (start se): choose `c[i]`, `bt(i, remain − c[i])` — **i** se (same number dobara chalega), `i + 1` nahi.
      - `start` ki wajah se peeche nahi jaate → `[2, 3]` aur `[3, 2]` dobara nahi.

      **Pruning:** pehle sort. `c[i] > remain` → aage sab bade → `break`. Poori branches kat jaati hain.

      > [!galti]
      > `bt(0, …)` se har baar shuru kiya → `[2, 2, 3]`, `[2, 3, 2]`, `[3, 2, 2]` all 3 aa gaye. `start` pass karo.
    dryRun: |
      sorted `[2, 3, 6, 7]`, target 7

      | Path | remain | Kya hua |
      |---|---|---|
      | 2 | 5 | aage |
      | 2 2 | 3 | aage |
      | 2 2 2 | 1 | 2 > 1 → break |
      | 2 2 3 | 0 | **mila** |
      | 2 3 | 2 | 3 > 2 → break |
      | 3 | 4 | 3 3 → 1, break |
      | 6 | 1 | break |
      | 7 | 0 | **mila** |
    viz: { tracer: comboTrace }
    code: ex2-combo-sum
    complexity:
      time: "O(n^(T/min)) worst"
      space: "O(T/min) stack"
      why: "Depth = target / sabse chhota number; pruning se practically bahut kam."

  - id: palindrome-partition
    level: tricky
    title: Palindrome pieces mein kaato
    source: { name: Palindrome Partitioning, platform: LeetCode, url: "https://leetcode.com/problems/palindrome-partitioning/" }
    problem: |
      String ko aise pieces mein kaato ki **har piece palindrome** ho. Saare tareeke do.

      Example: `"aab"` → `[["a", "a", "b"], ["aa", "b"]]`
    intuition: |
      Decision: **agla piece kitna lamba?** `start` se `end` tak har length try karo:
      - `s[start..end]` palindrome nahi → **skip** (pruning — is raaste koi jawab nahi).
      - Palindrome → piece path mein, `bt(end + 1)`, phir hatao.
      - `start == length` → poora kat gaya → result.

      > [!tip]
      > Palindrome check baar-baar same substrings par hota hai — `isPal[i][j]` DP table pehle bana lo (O(n²)), phir check O(1). Interview follow-up.
    dryRun: |
      `"aab"`

      | start | Piece | Palindrome? | Path |
      |---|---|---|---|
      | 0 | a | ✓ | a |
      | 1 | a | ✓ | a a |
      | 2 | b | ✓ | a a b → **mila** |
      | 1 | ab | ✗ | skip |
      | 0 | aa | ✓ | aa |
      | 2 | b | ✓ | aa b → **mila** |
      | 0 | aab | ✗ | skip |
    viz: { tracer: palPartTrace }
    code: ex3-pal-partition
    complexity:
      time: O(n · 2ⁿ)
      space: "O(n) stack"
      why: "Har gap par kaato/na kaato (2ⁿ⁻¹), har check O(n)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "\"Saare\" subsets / combinations / permutations / arrangements chahiye."
    - "Constraint wali search — Sudoku, N-Queens, word search."
    - "n chhota (≤ 15–20) aur exponential theek hai."
    - "Partition / split ke saare tareeke."
  avoid:
    - "Sirf COUNT chahiye ya best value — often DP (overlapping subproblems)."
    - "n bada (10⁵) — exponential kabhi nahi chalega; greedy/DP socho."
    - "Ek hi jawab chahiye aur greedy se mil jaata hai."
  signals:
    - keyword: "all subsets / power set"
      think: "Loop structure, start index, har node result."
    - keyword: "all combinations that sum to target"
      think: "Sort + remain + break pruning."
    - keyword: "partition string so that each part …"
      think: "Har length ka piece try, valid ho to recurse."
    - keyword: "n ≤ 15 / 20 in constraints"
      think: "2ⁿ ya n! chal jaayega — backtracking."

