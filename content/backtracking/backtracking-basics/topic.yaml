# 10. Common galtiyan & edge cases
mistakes:
  - title: "Path ki copy nahi daali"
    type: logic
    wrong: |
      `res.add(path)` → saari entries ek hi list → aakhir mein sab khaali.
    right: |
      `res.add(path.toList())` / `new ArrayList<>(path)`.
  - title: "Un-choose bhool gaye"
    type: logic
    wrong: |
      `path.add(x); bt(...)` aur hatana bhool gaye → agla option purane kachre ke saath.
    right: |
      Har `add` ke baad recursion, phir `removeAt(size − 1)`.
  - title: "start index nahi rakha"
    type: logic
    wrong: |
      Har call `0` se loop → same combination alag orders mein dobara.
    right: |
      Combinations/subsets mein `start` pass karo; permutations mein `used` array.
  - title: "Pruning mein continue vs break"
    type: logic
    wrong: |
      Sorted candidates par `c[i] > remain` hone par `continue` — kaam karta hai par bekaar iterations.
    right: |
      Sorted ho to `break` (aage sab bade). Unsorted ho to sirf `continue`.
  - title: "Khaali input"
    type: empty
    wrong: |
      Khaali array ke subsets mein `[[]]` bhool gaye (sirf `[]` return).
    right: |
      Khaali set bhi subset hai — loop structure har call par path add karta hai, to `[[]]` apne aap.

# 11. Interview corner
interview:
  questions:
    - q: "Backtracking aur brute force mein fark?"
      a: |
        Brute force saare candidates poore bana ke check karta hai. Backtracking ek-ek decision lete time galat raasta pehchaan ke poori branch kaat deta hai (pruning) — wahi exponential, par practically bahut tez.
    - q: "Backtracking ka template batao."
      a: |
        bt(state): base par result mein copy; har option: valid? choose → bt(next) → un-choose.
    - q: "Subsets ki complexity?"
      a: |
        2ⁿ subsets, har copy O(n) → O(n · 2ⁿ). Space O(n) stack (output alag).
    - q: "Combination Sum mein duplicates combinations kaise roke?"
      followUp: true
      a: |
        start index: sirf i se aage options. [2,3] bana, [3,2] kabhi nahi (3 ke baad 2 nahi aata).
    - q: "Combination Sum II (har number ek baar, input mein duplicates)?"
      followUp: true
      a: |
        Sort; bt(i + 1); same level par same value skip: if (i > start && c[i] == c[i − 1]) continue.
    - q: "Backtracking kab DP ban jaata hai?"
      a: |
        Jab sirf count/best chahiye aur same state (index, remain) baar-baar aaye — memo lagao. Saare jawab LIST karne hon to backtracking hi.
    - q: "Palindrome check fast kaise?"
      a: |
        isPal[i][j] = s[i] == s[j] && isPal[i+1][j−1] — O(n²) precompute, phir O(1).
    - q: "Iterative subsets?"
      a: |
        Result = [[]]; har item ke liye existing har subset mein item jod ke naye add. Ya bitmask 0..2ⁿ − 1.
  mayAsk:
    - "Subsets II (duplicates)."
    - "Combination Sum II / III."
    - "Letter Case Permutation."
    - "Generate Parentheses."

