# 13. Quick revision
revision:
  summary:
    - "Backtracking = choose → explore → un-choose (DFS on decision tree)."
    - "Result mein path ki COPY daalo."
    - "Subsets/combinations: start index; reuse allowed → bt(i), warna bt(i + 1)."
    - "Pruning: invalid option → continue; sorted aur aage sab invalid → break."
    - "Parameter state (Int) ho to undo apne aap; shared list ho to removeAt."
  cheatsheet: |
    ```kotlin
    val res = mutableListOf<List<Int>>(); val path = mutableListOf<Int>()
    fun bt(start: Int, remain: Int) {
        if (remain == 0) { res.add(path.toList()); return }
        for (i in start until c.size) {
            if (c[i] > remain) break          // prune (sorted)
            path.add(c[i])                    // choose
            bt(i, remain - c[i])              // explore (i = reuse, i+1 = no reuse)
            path.removeAt(path.size - 1)      // un-choose
        }
    }
    ```
  quiz:
    - q: "[1, 2, 3] ke kitne subsets?"
      options: ["6", "7", "8", "9"]
      answer: 2
      explain: "2³ = 8 (khaali including)."
    - q: "res.add(path) (bina copy) ka result?"
      options: ["Sahi", "Saari entries same list — aakhir mein khaali", "Compile error", "Duplicates"]
      answer: 1
      explain: "Ek hi object ka reference."
    - q: "Combination Sum mein same number dobara lene ke liye agli call?"
      options: ["bt(i + 1, …)", "bt(i, …)", "bt(0, …)", "bt(start, …)"]
      answer: 1
      explain: "i se hi — same number phir option."
    - q: "\"aab\" ke palindrome partitions kitne?"
      options: ["1", "2", "3", "4"]
      answer: 1
      explain: "[a, a, b] aur [aa, b]."
    - q: "Backtracking ki space (output chhod ke)?"
      options: ["O(1)", "O(depth)", "O(2ⁿ)", "O(n!)"]
      answer: 1
      explain: "Recursion stack + path = depth."

