# 13. Quick revision
revision:
  summary:
    - "Rakhne se pehle check (pruning), wapas jaate waqt undo."
    - "Saare raaste → unmark; sirf pahunch (flood/islands) → unmark nahi."
    - "N-Queens: row-wise; cols, r − c + n, r + c arrays → O(1) check."
    - "Sudoku: pehla khaali cell, digits try; koi nahi chala → false (pichhla galat)."
    - "Grid DFS: pehle bounds, phir value; gehri recursion ka dhyaan."
  cheatsheet: |
    ```kotlin
    // N-Queens
    for (c in 0 until n) {
        if (cols[c] || d1[r - c + n] || d2[r + c]) continue
        mark(true); place(r + 1); mark(false)
    }
    // grid path (saare raaste)
    fun dfs(r: Int, c: Int, k: Int): Boolean {
        if (k == L) return true
        if (out(r, c) || b[r][c] != w[k]) return false
        val ch = b[r][c]; b[r][c] = '#'
        val ok = dirs.any { (dr, dc) -> dfs(r + dr, c + dc, k + 1) }
        b[r][c] = ch; return ok
    }
    ```
  quiz:
    - q: "4-Queens ke kitne solutions?"
      options: ["1", "2", "4", "0"]
      answer: 1
      explain: "Do boards (ek doosre ka mirror)."
    - q: "Cell (2, 5) aur (4, 3) — same ↙ diagonal (r + c)?"
      options: ["Haan", "Nahi"]
      answer: 0
      explain: "2 + 5 = 7 = 4 + 3."
    - q: "Flood fill mein visited ka nishaan?"
      options: ["Alag boolean grid zaroori", "Naya rang hi kaafi", "Stack", "Kuch nahi chahiye"]
      answer: 1
      explain: "Rang badalne ke baad wo cell purane rang wala nahi rehta."
    - q: "Word search mein wapas aate waqt letter kyun rakhte hain?"
      options: ["Speed", "Doosre raaston/starts ke liye cell phir use ho sake", "Memory", "Zaroori nahi"]
      answer: 1
      explain: "Warna galat false."
    - q: "Sudoku 9x9 mein cell (4, 7) ka box kahan se shuru?"
      options: ["(3, 6)", "(4, 7)", "(1, 2)", "(3, 7)"]
      answer: 0
      explain: "4 / 3 × 3 = 3, 7 / 3 × 3 = 6."

