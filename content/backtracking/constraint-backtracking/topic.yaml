# 10. Common galtiyan & edge cases
mistakes:
  - title: "Unmark bhool gaye (saare raaste wale problem mein)"
    type: logic
    wrong: |
      Word search mein `#` lagaya par wapas letter nahi rakha → doosre start ke liye cell gayab, galat false.
    right: |
      Recursion ke baad asli value wapas.
  - title: "Flood fill mein same rang"
    type: logic
    wrong: |
      newColor == oldColor → infinite recursion.
    right: |
      Shuru mein `if (old == color) return image`.
  - title: "Bounds check order"
    type: off-by-one
    wrong: |
      `board[r][c] != word[k] || r < 0` → pehle hi index bahar crash.
    right: |
      Pehle bounds (`r in 0 until m`), phir value.
  - title: "Diagonal index negative"
    type: off-by-one
    wrong: |
      `d1[r - c]` → r < c par negative index.
    right: |
      `d1[r - c + n]` (array size 2n).
  - title: "Sudoku box ka shuru"
    type: off-by-one
    wrong: |
      Box start `r / 3` (0-2) maana — wo box number hai, cell index nahi.
    right: |
      `r / 3 * 3` (0, 3, 6).

# 11. Interview corner
interview:
  questions:
    - q: "N-Queens mein conflict O(1) mein kaise check?"
      a: |
        cols[c], d1[r − c + n], d2[r + c] boolean arrays. Row-wise rakhte hain to row conflict hota hi nahi.
    - q: "Word search mein visited array ki jagah kya?"
      a: |
        Board cell ko '#' se badal do aur wapas rakh do — extra memory nahi. Par input badalta hai (interview mein bolo).
    - q: "Flood fill mein unmark kyun nahi?"
      a: |
        Hum sirf pahunch rahe hain (har cell ek baar paint), saare raaste nahi gin rahe. Unmark karte to exponential ho jaata.
    - q: "Sudoku solver tez kaise?"
      followUp: true
      a: |
        Rows/cols/boxes ke bitmask/boolean arrays; sabse kam options wala cell pehle (MRV); naked singles pehle bhar do.
    - q: "N-Queens II (sirf count)?"
      followUp: true
      a: |
        Same backtracking, board ki jagah counter. Bitmask se aur tez: available = ~(cols | d1 | d2) & mask.
    - q: "Word Search II (bahut saare words)?"
      a: |
        Har word ke liye alag search slow. Words ka Trie banao, ek DFS mein Trie ke saath chalo (Trie chapter).
    - q: "Grid DFS mein recursion depth problem?"
      a: |
        1000x1000 grid par recursion 10⁶ gehri → StackOverflowError. Iterative stack ya BFS lo.
    - q: "Maze mein shortest path chahiye to?"
      a: |
        Backtracking nahi — BFS (har cell ek baar, pehli baar pahunchna = sabse chhota).
  mayAsk:
    - "N-Queens II."
    - "Valid Sudoku."
    - "Path with Maximum Gold."
    - "Unique Paths III."

