# 13. Quick revision
revision:
  summary:
    - "parent[] se groups; find = leader, union = leaders jodo."
    - "Path compression + union by size → har op ≈ O(1) (α(n))."
    - "union false = pehle se jude = undirected cycle / faltu edge."
    - "Components: n se shuru, har safal union par -1."
    - "Kruskal MST: edges sort, alag groups jodne wali lo, n - 1 par ruko."
  cheatsheet: |
    ```kotlin
    val parent = IntArray(n) { it }; val size = IntArray(n) { 1 }
    fun find(x: Int): Int { if (parent[x] != x) parent[x] = find(parent[x]); return parent[x] }
    fun union(a: Int, b: Int): Boolean {
        var ra = find(a); var rb = find(b); if (ra == rb) return false
        if (size[ra] < size[rb]) { val t = ra; ra = rb; rb = t }
        parent[rb] = ra; size[ra] += size[rb]; return true
    }
    // Kruskal: edges.sortBy { it[0] }; for (e in edges) if (union(e[1], e[2])) { cost += e[0]; if (++used == n - 1) break }
    ```
  quiz:
    - q: "a aur b same group mein hain — kaise check?"
      options: ["parent[a] == parent[b]", "find(a) == find(b)", "a == b", "size[a] == size[b]"]
      answer: 1
      explain: "Leader (root) compare karo; parent sirf ek kadam upar hai."
    - q: "union(a, b) ne false lautaya. Graph ke liye matlab?"
      options: ["Error", "a-b edge cycle banati hai", "a aur b alag components", "Graph directed hai"]
      answer: 1
      explain: "Dono pehle se jude the — ye edge ek aur rasta = cycle."
    - q: "Path compression + union by size ke saath ek operation?"
      options: ["O(n)", "O(log n) worst", "O(α(n)) ≈ O(1) amortized", "O(n log n)"]
      answer: 2
      explain: "Inverse Ackermann — kisi bhi practical n ke liye ≤ 4."
    - q: "5 nodes, 3 safal unions (aur 2 bekaar). Kitne groups?"
      options: ["0", "2", "3", "5"]
      answer: 1
      explain: "5 - 3 = 2. Bekaar unions kuch nahi ghatate."
    - q: "Kruskal mein edge (u, v) kab chhodte hain?"
      options: ["Jab weight bada ho", "Jab u aur v pehle se ek group mein", "Jab u == 0", "Kabhi nahi"]
      answer: 1
      explain: "Same group = cycle banegi; MST mein cycle nahi."

