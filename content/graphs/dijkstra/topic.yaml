# 13. Quick revision
revision:
  summary:
    - "Dijkstra: weights ≥ 0; sabse paas wala (min-heap top) pakka, padosi relax."
    - "Heap mein (node, dist) jodi; poll ke baad 'd > dist[u] → skip' (lazy deletion)."
    - "O((V + E) log V). Dense graph par array version O(V²)."
    - "Path: relax par parent[v] = u. Ek target: heap se nikle to ruko."
    - "Relax rule badal sakta hai (max for effort, gunaa for probability) jab tak 'aage badhne par behtar na ho'."
  cheatsheet: |
    ```kotlin
    val dist = IntArray(n) { Int.MAX_VALUE }; dist[s] = 0
    val pq = PriorityQueue<IntArray>(compareBy { it[1] }); pq.add(intArrayOf(s, 0))
    while (pq.isNotEmpty()) {
        val (u, d) = pq.poll()
        if (d > dist[u]) continue
        for ((v, w) in adj[u]) if (d + w < dist[v]) { dist[v] = d + w; pq.add(intArrayOf(v, dist[v])) }
    }
    ```
  quiz:
    - q: "Dijkstra kis condition mein galat ho sakta hai?"
      options: ["Directed graph", "Negative edge weights", "Disconnected graph", "Cycle wala graph"]
      answer: 1
      explain: "Negative weight se 'pakka' node baad mein sasta ho sakta hai. Directed, cycles, disconnected — sab theek."
    - q: "Heap se (u=3, d=9) nikla, par dist[3] = 7. Kya karein?"
      options: ["Relax karo", "Skip karo", "dist[3] = 9", "Error"]
      answer: 1
      explain: "Purani entry — 3 pehle hi 7 par pakka hua aur relax ho chuka."
    - q: "Binary heap ke saath Dijkstra ki complexity?"
      options: ["O(V + E)", "O(V²)", "O((V + E) log V)", "O(V × E)"]
      answer: 2
      explain: "Max E pushes, har push/poll log V."
    - q: "Saare edges ka weight 1 hai. Sabse achha tareeka?"
      options: ["Dijkstra", "BFS", "Bellman-Ford", "Floyd-Warshall"]
      answer: 1
      explain: "Barabar weights → BFS O(V + E), heap ki zaroorat nahi."
    - q: "Path With Minimum Effort mein relax ka niyam?"
      options: ["dist[u] + diff", "max(dist[u], diff)", "min(dist[u], diff)", "dist[u] × diff"]
      answer: 1
      explain: "Raste ka effort = sabse bada kadam → max. Aage badhne par kabhi ghatta nahi, isliye Dijkstra chalta hai."

