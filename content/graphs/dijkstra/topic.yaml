meta:
  id: dijkstra
  chapter: graphs
  title: Dijkstra
  subtitle: Weighted graph mein sabse sasta rasta — min-heap se "sabse paas wala pehle"
  level: advanced
  minutes: 50
  prereqs: [bfs, priority-queue]
  tags: [dijkstra, shortest-path, weighted-graph, priority-queue, greedy]

# 1. Ye kya hai?
what:
  body: |
    **Dijkstra's algorithm** ek source se baaki saare nodes tak **sabse sasta rasta** (weights ka kam se kam jod) nikalta hai — jab saare weights **≥ 0** hon.

    Idea:
    - `dist[src] = 0`, baaki ∞.
    - Bache hue nodes mein jo **abhi sabse paas** hai, uski doori **pakki**. (Weights negative nahi, to kisi aur raste se ghoom ke aana usse sasta nahi ho sakta.)
    - Uske padosiyon ko **relax** karo: `dist[u] + w < dist[v]` → `dist[v]` ghatao.

    "Sabse paas" baar baar chahiye → **min-heap (PriorityQueue)**. BFS ki queue ki jagah heap — bas itna fark.

    > [!yaad]
    > Dijkstra = BFS + weights + heap. Negative weight ho to Dijkstra galat ho sakta hai (Bellman-Ford lo).
  analogy: |
    **Shaadi ka card baantna, petrol bachana:**
    Ghar se nikle. Jo rishtedaar sabse paas (kam km) hai, pehle uske ghar. Wahan pahunch ke dekho: "is ghar se kin rishtedaaron tak ab kam km lagega?" — notebook mein unki doori sudharo. Phir notebook mein jo sabse paas (abhi tak na gaye) hai, wahan.

    Notebook = dist[]. "Sabse paas kaun" turant batane wali diary = min-heap.

# 2. Kyun chahiye?
why:
  body: |
    BFS edges ginta hai. Par asli duniya mein edges barabar nahi hoti — sadak 2 km ki bhi, 20 km ki bhi. **Kam sadkein ≠ kam kharcha.**

    | Tareeka | Kab sahi | Time |
    |---|---|---|
    | BFS | saare weights barabar | O(V + E) |
    | **Dijkstra** | weights ≥ 0 | **O((V + E) log V)** |
    | Bellman-Ford | negative weights bhi | O(V × E) |
    | Saare raste try | — | exponential |

    Maps, network routing, game pathfinding — sab isi par (ya iske upgrade A* par) chalte hain.

    > [!socho]
    > Ek node heap mein do baar aa sakta hai — (3:9) aur baad mein (3:8). Purani wali entry hataate kyun nahi?
    >
    > Java ke heap se beech ki entry hatana O(n) hai. Sasta tareeka: nayi daal do, aur purani jab nikle to `d > dist[u]` dekh ke skip (lazy deletion).

# 3. Visual intro
visual:
  body: |
    Pehle dekho BFS kaunsa rasta chunta (sabse kam sadkein) aur asli sasta rasta kaunsa hai. Phir Dijkstra nodes ko **paas se door** ke order mein pakka karta hai — har node par badge uski final doori.
  viz: { tracer: whyTrace }

# 4. Kaise kaam karta hai
how:
  body: |
    ```text
    dist = [∞...]; dist[src] = 0; pq = [(src, 0)]
    jab tak pq khaali nahi:
        (u, d) = pq.poll()            // sabse kam d
        agar d > dist[u]: skip         // purani entry
        har (v, w) in adj[u]:
            agar d + w < dist[v]:      // relax
                dist[v] = d + w; pq.add((v, dist[v]))
    ```

    Pehli baar jab u heap se (non-stale) nikalta hai, `dist[u]` final hai. Isliye "sirf ek target" chahiye to wahi pe ruk sakte ho.

    > [!galti]
    > `dist` ko `Int.MAX_VALUE` rakh ke `dist[u] + w` kiya bina check → overflow, negative number, sab galat. Ya to pehle `dist[u] != INF` check, ya Long / bada-par-safe INF (jaise `1e9`) lo.
  viz: { tracer: dijkstraTrace }
  code: how

# 5. Operations table
operations:
  - op: "Dijkstra (heap + adjacency list)"
    time: "O((V + E) log V)"
    space: "O(V + E)"
    why: "Har relax ek push (max E), har push/poll log(heap) ≈ log V. Adjacency + dist + heap."
  - op: "Dijkstra (array, bina heap)"
    time: "O(V²)"
    space: O(V)
    why: "Har baar V nodes mein se min dhoondhna. Dense graph (E ≈ V²) par yahi behtar."
  - op: "Ek target tak (early stop)"
    time: "O((V + E) log V) worst"
    space: O(V)
    why: "Target heap se nikla to ruk jao — aksar kaafi jaldi."
  - op: "Path reconstruct"
    time: "O(V)"
    space: O(V)
    why: "Relax par parent[v] = u; target se parent pakad ke ulta."
  - op: "Grid par (R × C)"
    time: "O(RC log(RC))"
    space: "O(RC)"
    why: "Har cell node, 4 padosi."

# 6. Code
code:
  - title: Kitne alag SABSE SASTE raste? — Dijkstra + ways[]
    file: count-paths
    note: |
      Har node ke liye `ways[v]` = src se v tak kitne alag sabse saste raste.
      - `nd < dist[v]`: naya sabse sasta mila → purane ways bekaar → `ways[v] = ways[u]`.
      - `nd == dist[v]`: utna hi sasta doosra rasta → `ways[v] += ways[u]`.

      Sahi kyun: u heap se nikalta hai tab tak uske saare "pehle wale" (kam dist) nikal chuke, to `ways[u]` poora hai. Weights > 0 zaroori.

      Bade weights → `Long`, jawab `% (10⁹ + 7)` (LeetCode 1976 jaisa).

# 7. Examples
examples:
  - id: cheapest-path
    level: easy
    title: Sabse sasta rasta — kharcha aur rasta dono
    problem: |
      Directed graph, har edge par kharcha (≥ 0). src se dst tak sabse sasta rasta: kharcha aur nodes ki list lautao (`"kharcha: a -> b -> c"`). Rasta na ho to `"rasta nahi"`.

      Example: `0→1:2, 0→2:6, 1→2:3, 1→3:8, 2→3:2, 2→4:7, 3→4:1, 3→5:6, 4→5:2`, 0 se 5 → **10: 0 -> 1 -> 2 -> 3 -> 4 -> 5**
    intuition: |
      How wala Dijkstra + **parent[]** (BFS jaisa): jab bhi `dist[v]` sasta ho, `parent[v] = u`. Aakhri baar jo set hua wahi sabse saste raste ka pichhla node.

      dst heap se nikla → ruk jao (uski doori pakki). Phir dst se parent pakad ke src tak, list ulti.

      Dekho: 5 edges wala rasta (10) 3 edges wale (0→2→4→5 = 15) se sasta hai.

      > [!galti]
      > Parent sirf pehli baar (BFS ki tarah) set kiya. Dijkstra mein dist kai baar sudharta hai — parent bhi har sudhar par badlo.
    dryRun: |
      | Pakka (u, d) | Sasta hua | parent |
      |---|---|---|
      | (0, 0) | 1: 2, 2: 6 | 1←0, 2←0 |
      | (1, 2) | 2: 6 → 5, 3: 10 | 2←1, 3←1 |
      | (2, 5) | 3: 10 → 7, 4: 12 | 3←2, 4←2 |
      | (3, 7) | 4: 12 → 8, 5: 13 | 4←3, 5←3 |
      | (4, 8) | 5: 13 → 10 | 5←4 |
      | (5, 10) | dst — ruko | 5 ← 4 ← 3 ← 2 ← 1 ← 0 |
    viz: { tracer: pathTrace }
    code: ex1-cheapest-path
    complexity:
      time: "O((V + E) log V)"
      space: "O(V + E)"
      why: "Normal Dijkstra; parent array aur path O(V) extra."

  - id: network-delay
    level: medium
    title: Signal sab tak kitni der mein? (Network Delay Time)
    source: { name: Network Delay Time, platform: LeetCode, url: "https://leetcode.com/problems/network-delay-time/" }
    problem: |
      n nodes (1 se n). `times[i] = [u, v, w]`: u se v tak signal ko w time lagta hai (directed). Node k se signal bheja. Saare nodes tak signal pahunchne mein kitna time? Koi node kabhi na pahunche to -1.

      Example: `[[1,2,4],[1,3,1],[3,2,2],[2,4,1],[3,5,7],[4,5,3]]`, n = 5, k = 1 → **7**
    intuition: |
      Har node tak signal sabse jaldi kab pahunchega = k se uski **shortest distance**. Signal har raste par saath chalta hai, to node tak pehla pahuncha hi kaafi.

      Sab tak pahunchne ka time = sabse **late** wale node ka time = `max(dist)`. Koi `dist` ∞ reh gaya → -1.

      Nodes 1 se n → arrays `n + 1` size ke.

      > [!galti]
      > Jawab mein `dist` ka jod le liya (sab raston ka total). Signal ek saath sab taraf jaata hai — jawab max hai, sum nahi.
    dryRun: |
      | Pakka | Time | Sasta hua |
      |---|---|---|
      | 1 | 0 | 2: 4, 3: 1 |
      | 3 | 1 | 2: 4 → 3, 5: 8 |
      | 2 | 3 | 4: 4 |
      | 4 | 4 | 5: 8 → 7 |
      | 5 | 7 | — |
      | max | | **7** |
    viz: { tracer: delayTrace }
    code: ex2-network-delay
    complexity:
      time: "O((V + E) log V)"
      space: "O(V + E)"
      why: "Ek Dijkstra + dist par ek max loop."

  - id: min-effort
    level: tricky
    title: Pahaadi grid mein sabse aasaan rasta (Path With Minimum Effort)
    source: { name: Path With Minimum Effort, platform: LeetCode, url: "https://leetcode.com/problems/path-with-minimum-effort/" }
    problem: |
      Grid mein har cell ki height. Upar-baayein se neeche-daayein jaana hai (4 dishayein). Raste ka **effort** = raste ke kisi bhi do lagaataar cells ki height ke farak ka **maximum**. Sabse kam effort wala rasta — uska effort batao.

      Example: `[[1,2,8],[4,9,3],[2,3,4]]` → **3** (1 → 4 → 2 → 3 → 4)
    intuition: |
      Grid = graph, cells nodes, padosi edges, weight = |height farak|. Par rasta ka "kharcha" **jod nahi, max** hai.

      Dijkstra phir bhi chalta hai! Sirf relax badlo: `ne = max(effort[u], |h[v] - h[u]|)`. Kyun? Max bhi "raste mein aage badhne par kabhi ghatta nahi" — jaise jod. Isliye jo cell heap se pehle nikla, uska effort pakka.

      Manzil heap se nikle → wahi jawab.

      Doosra tareeka: effort par **binary search** (kya effort ≤ X mein pahunch sakte? → BFS). O(RC log maxH).

      > [!galti]
      > BFS / DFS se "pehla mila rasta" le liya — wo kam effort wala zaroori nahi. Ya `effort = e + farak` (jod) likh diya — sawaal max ka hai.
    dryRun: |
      | Nikla (cell, effort) | Sudhre padosi |
      |---|---|
      | (0,0), 0 | (1,0): 3, (0,1): 1 |
      | (0,1), 1 | (1,1): 7, (0,2): 6 |
      | (1,0), 3 | (2,0): 3, (1,1): 5 |
      | (2,0), 3 | (2,1): 3 |
      | (2,1), 3 | (1,1): 6 → nahi (5 hai), (2,2): 3 |
      | (2,2), 3 | manzil → **3** |
    viz: { tracer: effortTrace }
    code: ex3-min-effort
    complexity:
      time: "O(RC log(RC))"
      space: "O(RC)"
      why: "RC nodes, har ek ke 4 padosi; har push/poll log(RC)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Weighted graph (weights ≥ 0) mein ek source se sabse sasta / jaldi rasta."
    - "'Minimum cost / time / effort' aur raste ka kharcha har kadam par badhta (ya same rehta) hai."
    - "Grid jahan har move ka alag kharcha (Dijkstra on grid)."
    - "State graph — (node, kuch extra) states, weights ≥ 0 (jaise fuel, stops)."
  avoid:
    - "Saare weights barabar → BFS (log V bachta hai)."
    - "Negative weights → Bellman-Ford (ya SPFA); negative cycle check bhi wahi."
    - "Saare jodon (all pairs) ki doori, chhota V → Floyd-Warshall O(V³)."
    - "DAG → topo order + relax, O(V + E), heap nahi chahiye."
  signals:
    - keyword: "minimum cost / time / distance, weights alag"
      think: "Dijkstra: dist + min-heap + stale skip."
    - keyword: "signal / delay / sab tak kab pahunchega"
      think: "Dijkstra, jawab = max(dist)."
    - keyword: "path ka cost = max edge (effort, minimax)"
      think: "Dijkstra with max() relax, ya binary search + BFS."
    - keyword: "at most K stops / fuel limit"
      think: "State mein extra cheez (node, stops) — Bellman-Ford K rounds ya Dijkstra on states."

# 9. Real-world
realWorld:
  - where: "Google Maps / Ola-Uber ETA"
    how: "Chauraahe nodes, sadkein weighted edges (traffic wala time). Dijkstra / A* (Dijkstra + 'manzil kitni door' ka andaza)."
  - where: "Internet routing (OSPF protocol)"
    how: "Har router poore network ka map rakh ke Dijkstra se har destination ka sabse sasta next-hop nikalta hai."
  - where: "Games (pathfinding)"
    how: "Daldal / pahaad mehenga, sadak sasti — grid par Dijkstra / A*."
  - where: "Flight / train booking 'sabse sasta'"
    how: "Shehar nodes, flights edges (kiraya weight). Stops ki limit ho to state mein stops bhi."
  - where: "Logistics (delivery)"
    how: "Warehouse se har pin code tak sabse kam time / kharcha."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "INF + w overflow"
    type: overflow
    wrong: |
      `dist = Int.MAX_VALUE`; `dist[u] + w` → negative ban ke sabse "sasta" lagta hai.
    right: |
      Sirf heap se nikle nodes relax karo (unka dist finite hai), ya INF = 1e9 / Long lo. Bade weights ke jod → Long.
  - title: "Stale entry skip nahi ki"
    type: logic
    wrong: |
      Purani (u, 9) entry bhi process ki jab dist[u] = 8 ho chuka — extra kaam, aur counting wale sawaalon (ways) mein galat jawab.
    right: |
      `if (d > dist[u]) continue` — poll ke turant baad.
  - title: "Negative weight par Dijkstra"
    type: logic
    wrong: |
      Edge weight -4 bhi hai, phir bhi Dijkstra — "pakka" maana node baad mein sasta ho sakta tha.
    right: |
      Negative weights → Bellman-Ford (V - 1 rounds har edge relax). Negative cycle → shortest path defined hi nahi.
  - title: "Heap mein dist nahi, node daala"
    type: logic
    wrong: |
      `PriorityQueue<Int>(compareBy { dist[it] })` — baad mein dist badla to heap ka order nahi badalta (heap ko pata hi nahi).
    right: |
      Entry ke saath us waqt ka dist daalo: `(node, dist)` jodi. Comparator usi number par.
  - title: "Unreachable ko 0 / INF hi lauta diya"
    type: empty
    wrong: |
      Network delay mein ek node tak rasta nahi, par max mein INF aa gaya (2147483647).
    right: |
      Aakhir mein check: koi dist INF → -1 (ya jo sawaal maange).
  - title: "Nodes 1..n par size n"
    type: off-by-one
    wrong: |
      `IntArray(n)` aur node n → index out of bounds.
    right: |
      1-based nodes → `n + 1` size, loop `1..n`.

# 11. Interview corner
interview:
  questions:
    - q: "Dijkstra kaise kaam karta hai? Sahi kyun hai?"
      a: |
        Har baar sabse kam dist wala unvisited node pakka karo aur padosi relax karo. Sahi kyun: weights ≥ 0, to kisi aur (abhi ke dist se bade) node se ghoom ke aana sasta nahi ho sakta — greedy choice safe hai.
    - q: "Complexity?"
      a: |
        Binary heap ke saath O((V + E) log V). Array se min dhoondhein to O(V²) — dense graph par behtar. Fibonacci heap se O(E + V log V) (theory).
    - q: "Negative weights mein kya dikkat?"
      a: |
        Ek node 'pakka' maan liya, par baad mein negative edge se sasta rasta mil sakta hai. Bellman-Ford O(VE) lo; negative cycle ho to shortest path hi nahi.
    - q: "Lazy deletion kya hai?"
      a: |
        Decrease-key ki jagah nayi entry push; purani jab nikle to `d > dist[u]` dekh ke skip. Heap max E entries tak, complexity same.
    - q: "BFS vs Dijkstra?"
      a: |
        Saare weights barabar → BFS (queue, O(V + E)). Alag weights → Dijkstra (heap). 0/1 weights → 0-1 BFS (deque).
    - q: "Sirf ek target ka shortest path?"
      a: |
        Target heap se nikle to ruk jao — tab tak uski doori pakki. A* aur tez: heap ka key = dist + andaza(target tak), andaza kabhi asli se zyada na ho.
    - q: "Path kaise nikaaloge?"
      a: |
        Relax par parent[v] = u. Target se parent pakad ke src tak, ulta.
    - q: "Cheapest Flights Within K Stops mein seedha Dijkstra kyun fail?"
      followUp: true
      a: |
        Sasta par zyada stops wala rasta pehle pakka ho jaata hai, aur kam stops wala mehenga rasta (jo limit mein hai) chhoot jaata hai. State (node, stops) rakho, ya Bellman-Ford K + 1 rounds.
    - q: "Saare jodon ki shortest distance?"
      followUp: true
      a: |
        Har node se Dijkstra: O(V (V + E) log V). Chhota V → Floyd-Warshall O(V³), negative weights bhi (cycle nahi).
  mayAsk:
    - "Cheapest Flights Within K Stops."
    - "Swim in Rising Water (minimax Dijkstra)."
    - "Number of Ways to Arrive at Destination (Dijkstra + count)."
    - "Path with Maximum Probability (max-heap, gunaa)."

