meta:
  id: topological-sort
  chapter: graphs
  title: Topological Sort
  subtitle: Pehle kya, baad mein kya — dependencies ka sahi order (aur cycle pakadna)
  level: intermediate
  minutes: 45
  prereqs: [bfs, dfs]
  tags: [topological-sort, kahn, dag, in-degree, directed-cycle, course-schedule]

# 1. Ye kya hai?
what:
  body: |
    Directed graph mein edge **u → v** ka matlab: "pehle u, phir v". **Topological order** = saare nodes ki aisi line jisme **har arrow aage ki taraf** jaaye.

    Ye sirf **DAG** (Directed Acyclic Graph — directed, bina cycle) mein possible hai. Cycle (a → b → a) mein koi "pehla" ho hi nahi sakta.

    2 tareeke, dono O(V + E):
    1. **Kahn's algorithm (BFS):** jiski **in-degree 0** (koi wait nahi) use nikalo; uske baad walon ki in-degree ghatao; jo 0 ho jaaye wo queue mein.
    2. **DFS:** node ka postorder (saare "baad wale" khatam hone ke baad) list mein daalo; aakhir mein list **ulti**.

    Bonus: dono tareeke **cycle** bhi pakadte hain — Kahn mein kuch nodes kabhi free nahi hote; DFS mein "gray" (raste wala) node dobara milta hai.

    > [!yaad]
    > Ek DAG ke **kai** sahi topological orders ho sakte hain. Interview mein "koi bhi ek" return karna kaafi hota hai, jab tak special order na maanga ho.
  analogy: |
    **Subah taiyaar hona:** baniyan se pehle shirt nahi, mozey se pehle joote nahi, par ghadi kabhi bhi. Ye conditions arrows hain.

    Kahn ka tareeka: "abhi kya pehen sakta hoon jiski koi condition baaki nahi?" — wo pehno, phir dekho kaun naya free hua. Conditions ghoom kar khud par aa jaayein (joote se pehle mozey, mozey se pehle joote) → taiyaar ho hi nahi sakte = cycle.

# 2. Kyun chahiye?
why:
  body: |
    Jahan bhi "ye kaam us kaam ke baad" hai, wahan topological sort:
    - College courses aur prerequisites — kis order mein padhein?
    - Build systems (Gradle, Make) — kaunsa module pehle compile?
    - npm / pip install — dependencies pehle
    - Excel formulas — kaunsa cell pehle calculate ho
    - Project planning — kaam ka schedule

    Saare orders try karna = n! (6 kaam = 720, 20 kaam = 2.4 × 10¹⁸). Topological sort O(V + E) mein ek sahi order de deta hai — ya bata deta hai ki possible hi nahi (cycle).

    > [!socho]
    > Kahn's algorithm mein queue ki jagah stack le lo. Kya order phir bhi sahi rahega?
    >
    > Haan! Sirf in-degree 0 wale hi bahar aate hain — kis order mein, farak nahi padta. Order alag hoga, par sahi. Heap lo to sabse chhota (lexicographic) order milta hai (code section).

# 3. Visual intro
visual:
  body: |
    Upar bikhre hue kaam, badge = kitne kaamon ka wait (in-degree). Jiska wait 0 hai wo neeche line mein aata hai. Aakhir mein dekho: line mein **har arrow left se right**. Ek ulti edge daal ke cycle bana ke dekho — kuch nodes kabhi neeche nahi aayenge.
  viz: { tracer: lineupTrace }

# 4. Kaise kaam karta hai
how:
  body: |
    **Kahn's algorithm:**
    1. Har edge u → v: `adj[u].add(v)`, `indeg[v]++`.
    2. Saare `indeg == 0` wale queue mein.
    3. Queue se u nikalo → order mein. Har `v` in `adj[u]`: `indeg[v]--`; 0 ho gaya → queue mein.
    4. Aakhir mein `order.size < n` → cycle (bache nodes ek doosre ka wait karte reh gaye).

    Ye BFS hi hai — bas "visited" ki jagah "in-degree 0 hua?" ka rule.

    > [!galti]
    > Edge ki disha ulti padh li. `[course, pre]` mein arrow **pre → course** hai. Ulta banaoge to order bhi ulta aayega (aur in-degree galat nodes ki).
  viz: { tracer: kahnTrace }
  code: how

# 5. Operations table
operations:
  - op: "Kahn's algorithm"
    time: "O(V + E)"
    space: "O(V + E)"
    why: "Adjacency list + indeg array; har node ek baar queue mein, har edge ek baar ghatai."
  - op: "DFS (ulta postorder)"
    time: "O(V + E)"
    space: O(V)
    why: "Har node ek DFS mein ek baar; color + recursion stack."
  - op: "Directed cycle check"
    time: "O(V + E)"
    space: O(V)
    why: "Kahn: order.size < n. DFS: gray node dobara mila."
  - op: "Sabse chhota (lexicographic) order"
    time: "O(V log V + E)"
    space: O(V)
    why: "Queue ki jagah min-heap — har add / poll log V."
  - op: "Level-wise (semesters / rounds)"
    time: "O(V + E)"
    space: O(V)
    why: "Kahn mein har round ka queue.size — levels count = DAG ka sabse lamba rasta."

# 6. Code
code:
  - title: Sabse chhota topological order — queue ki jagah min-heap
    file: smallest-order
    note: |
      Kahn mein free nodes kisi bhi order mein nikal sakte hain. **PriorityQueue** lo → hamesha sabse chhota free node pehle → lexicographically sabse chhota order.

      Same graph: queue se `[0, 5, 1, 2, 3, 4]`, heap se `[0, 1, 2, 3, 5, 4]`. Dono sahi.

      Cost: har add / poll O(log V) → O(V log V + E). "Smallest / alphabetical order" maange (Alien Dictionary variants) tab kaam aata hai.

# 7. Examples
examples:
  - id: can-finish
    level: easy
    title: Saare courses ho sakte hain? (Course Schedule)
    source: { name: Course Schedule, platform: LeetCode, url: "https://leetcode.com/problems/course-schedule/" }
    problem: |
      n courses (0 se n - 1). `[a, b]` ka matlab: course a se **pehle** course b karna zaroori. Kya saare courses kisi order mein poore ho sakte hain?

      Example: n = 4, `[[1,0],[2,0],[3,1],[3,2]]` → **true** (0, phir 1 aur 2, phir 3)
    intuition: |
      Sawaal asal mein: **kya graph mein directed cycle hai?** Cycle hai → kuch courses ek doosre ka wait karte rahenge → false.

      Kahn chalao aur bas count karo kitne courses queue se nikle. `done == n` → true. Order store karne ki zaroorat bhi nahi.

      Arrow ki disha: `[a, b]` → **b → a** (pehle b). Yahi sabse common galti hai.

      > [!tip]
      > `--indeg[next] == 0` ek line mein ghatana + check — par samajh ke likho: pehle ghatta hai, phir compare.
    dryRun: |
      | Nikala | in-degree badle | Queue | done |
      |---|---|---|---|
      | shuru | 0:0, 1:1, 2:1, 3:2 | 0 | 0 |
      | 0 | 1 → 0, 2 → 0 | 1, 2 | 1 |
      | 1 | 3 → 1 | 2 | 2 |
      | 2 | 3 → 0 | 3 | 3 |
      | 3 | — | — | 4 = n → **true** |
    viz: { tracer: canFinishTrace }
    code: ex1-can-finish
    complexity:
      time: "O(V + E)"
      space: "O(V + E)"
      why: "Graph banana O(E); har course ek baar queue mein, har prerequisite ek baar ghata."

  - id: semesters
    level: medium
    title: Kam se kam kitne semester? (level-wise Kahn)
    problem: |
      n courses (0 se n - 1). `[a, b]` = pehle a, phir b. Ek semester mein **jitne chaho** courses le sakte ho, bas unke saare pehle wale courses pichhle semesters mein ho chuke hon. Kam se kam kitne semester lagenge? Possible na ho to -1.

      Example: n = 7, `[[0,2],[1,2],[2,3],[2,4],[3,5],[4,5]]` → **4**
    intuition: |
      Ek semester = jitne courses abhi free hain, **sab** ek saath. Ye Kahn ka **level by level** form hai (BFS ka `queue.size` wala pattern):
      - Round shuru: `semesters++`, queue mein jitne hain sab is semester.
      - Unke baad wale jo free hue → agle round mein.

      Jawab = levels ki count = DAG ka **sabse lamba rasta** (nodes mein). Course 6 jaisa akela course pehle hi semester mein chala jaata hai — wo jawab nahi badhata.

      > [!galti]
      > Har nikale course par `semesters++` kar diya → ye courses count kar raha hai, semesters nahi. Level ke shuru mein `queue.size` le ke ek hi baar badhao.
    dryRun: |
      | Semester | Courses | Free hue |
      |---|---|---|
      | 1 | 0, 1, 6 | 2 |
      | 2 | 2 | 3, 4 |
      | 3 | 3, 4 | 5 |
      | 4 | 5 | — → **4** |
    viz: { tracer: semestersTrace }
    code: ex2-semesters
    complexity:
      time: "O(V + E)"
      space: "O(V + E)"
      why: "Normal Kahn hi — sirf rounds count kiye. Har node ek baar, har edge ek baar."

  - id: three-colors
    level: tricky
    title: Course order DFS se — 3 color se cycle pakdo (Course Schedule II)
    source: { name: Course Schedule II, platform: LeetCode, url: "https://leetcode.com/problems/course-schedule-ii/" }
    problem: |
      Example 1 jaisa hi, par ab ek **sahi order** return karo (koi bhi ek). Cycle ho to khaali array. Is baar DFS se karo.

      Example: n = 6, `[[1,0],[2,0],[3,1],[3,2],[4,3],[4,5]]` → **[5, 0, 2, 1, 3, 4]** (ek sahi jawab)
    intuition: |
      **DFS postorder:** node tab list mein jaata hai jab uske **saare baad wale** ho chuke. To list mein har node apne baad walon ke **baad** hai → list **ulti** karo = topological order.

      **Cycle kaise?** Undirected wala "visited + parent nahi" yahan galat hai (0 → 1, 0 → 2, 1 → 2 mein 2 do raston se milta hai par cycle nahi). Isliye 3 color:
      - **white (0):** abhi chhua nahi.
      - **gray (1):** DFS ke **abhi ke raste** par (stack mein).
      - **black (2):** poora ho gaya.

      Gray node dobara mila = abhi ke raste par wapas = **cycle**. Black mila = kisi aur raste se pehle hi poora, koi dikkat nahi.

      > [!galti]
      > Sirf `visited` boolean rakha aur visited mila to cycle maan liya → black (poore) nodes par bhi galat "cycle". Gray aur black alag rakhna hi poora trick hai.
    dryRun: |
      | Step | Color | Postorder |
      |---|---|---|
      | dfs(0) → 1 → 3 → 4 | 0,1,3,4 gray | |
      | 4 ke baad koi nahi | 4 black | 4 |
      | 3, phir 1 poore | black | 4, 3, 1 |
      | 0 → 2 (3 black, skip) | 2 black | 4, 3, 1, 2 |
      | 0 poora | black | 4, 3, 1, 2, 0 |
      | dfs(5) (4 black) | 5 black | 4, 3, 1, 2, 0, 5 |
      | ulta | | **[5, 0, 2, 1, 3, 4]** |
    viz: { tracer: colorsTrace }
    code: ex3-three-colors
    complexity:
      time: "O(V + E)"
      space: "O(V + E)"
      why: "Har node ek baar gray → black, har edge ek baar dekhi. Adjacency list + color + stack."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "'Pehle X phir Y' jaisi conditions (prerequisites, dependencies) aur ek valid order chahiye."
    - "Directed graph mein cycle hai ya nahi (deadlock, circular dependency)."
    - "Rounds / semesters / stages — kam se kam kitne (level-wise Kahn)."
    - "DAG par DP (sabse lamba rasta, raste count karna) — topo order mein process karo."
  avoid:
    - "Undirected graph — wahan topological order ka matlab hi nahi; cycle ke liye DFS + parent / union-find."
    - "Edges par weights aur 'sabse sasta rasta' general graph mein → Dijkstra (DAG ho to topo + DP bhi chalega)."
    - "Conditions nahi, bas connectivity poochhi → BFS / DFS / union-find."
  signals:
    - keyword: "prerequisites / course schedule / dependencies"
      think: "Kahn: in-degree 0 se shuru; done == n?"
    - keyword: "build order / task order / install order"
      think: "Topological sort; cycle ho to error."
    - keyword: "directed graph mein cycle"
      think: "Kahn count, ya DFS 3 color (gray dobara mila)."
    - keyword: "alien dictionary / order of letters"
      think: "Adjacent words ke pehle alag letter se edge, phir topo sort."

# 9. Real-world
realWorld:
  - where: "Gradle / Maven / Bazel build"
    how: "Modules ki dependency graph ka topo order = compile order. Circular dependency = build error."
  - where: "npm / pip install"
    how: "Packages pehle install jinpar baaki depend karte hain."
  - where: "Excel / Google Sheets recalculation"
    how: "Cell formulas doosre cells par depend karte hain — topo order mein recalculate; cycle = 'circular reference' warning."
  - where: "University course planner"
    how: "Prerequisite chart se semester wise plan — level-wise Kahn."
  - where: "Data pipelines (Airflow DAGs)"
    how: "Har task tab chalta hai jab uske upstream tasks ho chuke — scheduler topo order follow karta hai."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Edge ki disha ulti"
    type: logic
    wrong: |
      `[course, pre]` se `adj[course].add(pre)` bana diya.
    right: |
      "Pehle pre" → arrow **pre → course** → `adj[pre].add(course)`, `indeg[course]++`.
  - title: "Cycle check bhool gaye"
    type: logic
    wrong: |
      Kahn ka order seedha return kar diya — cycle hone par adhoora order (kuch nodes gayab).
    right: |
      `if (order.size < n) return emptyList()` (ya false / -1).
  - title: "Akele nodes (koi edge nahi) chhoot gaye"
    type: empty
    wrong: |
      Sirf edges mein aaye nodes ki in-degree dekhi → bina edge wala course order mein hi nahi.
    right: |
      `for (v in 0 until n)` — saare nodes; jinki koi edge nahi unki in-degree 0, wo shuru mein hi queue mein.
  - title: "Directed cycle ke liye visited boolean"
    type: logic
    wrong: |
      DFS mein "visited mila → cycle" — diamond (0 → 1 → 3, 0 → 2 → 3) mein galat true.
    right: |
      3 color: sirf **gray** (abhi ke raste wala) dobara mile to cycle.
  - title: "DFS postorder ulta karna bhool gaye"
    type: logic
    wrong: |
      Postorder hi return kar diya → har node apne baad walon ke BAAD — order bilkul ulta.
    right: |
      `post.reversed()` — ya stack mein push karke pop karo.
  - title: "Duplicate edges"
    type: other
    wrong: |
      Same `[a, b]` 2 baar → in-degree 2, par adj mein bhi 2 baar — Kahn theek chalta hai. Par agar adj ko Set bana diya aur indeg 2 baar badhaya → node kabhi free nahi hota.
    right: |
      adj aur indeg ko ek saath consistent rakho (dono list, ya dono dedupe).

# 11. Interview corner
interview:
  questions:
    - q: "Topological sort kya hai aur kab possible hai?"
      a: |
        Directed graph ke nodes ki line jisme har edge u → v mein u pehle. Sirf DAG mein possible; cycle ho to nahi.
    - q: "Kahn's algorithm samjhao. Complexity?"
      a: |
        In-degree count karo, 0 wale queue mein; nikalo, baad walon ki in-degree ghatao, 0 hone par queue mein. O(V + E) time, O(V + E) space.
    - q: "Kahn se cycle kaise pakdoge?"
      a: |
        Aakhir mein order mein n se kam nodes. Bache nodes ki in-degree kabhi 0 nahi hui — wo cycle mein (ya cycle ke baad) hain.
    - q: "DFS se topological sort kaise?"
      a: |
        Postorder mein node list mein daalo (saare neighbor khatam hone ke baad), aakhir mein list ulti. Cycle ke liye 3 color.
    - q: "Directed cycle mein visited boolean kyun kaafi nahi?"
      a: |
        Ek node 2 alag raston se aa sakta hai bina cycle ke (diamond). Cycle tabhi jab node abhi ke DFS raste par ho — isliye gray (in-stack) alag state.
    - q: "Kya topological order unique hota hai?"
      a: |
        Zaroori nahi. Unique tabhi jab Kahn mein har step queue mein sirf ek node ho (matlab order mein har pair ke beech edge ho — Hamiltonian path).
    - q: "Minimum semesters / parallel time kaise?"
      a: |
        Kahn level by level — levels ki count. Har course ka time alag ho to: finish[v] = max(finish[u]) + time[v], topo order mein (Parallel Courses III).
    - q: "Alien Dictionary kaise solve karoge?"
      followUp: true
      a: |
        Continuous words ke pehle alag letter se edge (a ka letter → b ka letter). Agar lamba word apne prefix se pehle aaye → invalid. Phir topo sort; cycle → invalid.
    - q: "DAG mein sabse lamba rasta?"
      followUp: true
      a: |
        Topo order mein chalo: dist[v] = max(dist[v], dist[u] + w). General graph mein ye NP-hard hai, DAG mein O(V + E).
  mayAsk:
    - "Course Schedule II (order return karo)."
    - "Alien Dictionary."
    - "Find All Possible Recipes from Given Supplies."
    - "Parallel Courses / Parallel Courses III."

