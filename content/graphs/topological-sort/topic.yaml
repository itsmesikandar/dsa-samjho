# 13. Quick revision
revision:
  summary:
    - "Topological order: har edge u → v mein u pehle. Sirf DAG mein."
    - "Kahn: in-degree 0 queue mein; nikalo, baad walon ki in-degree ghatao. O(V + E)."
    - "order.size < n → cycle. [a, b] 'a se pehle b' = arrow b → a."
    - "DFS: ulta postorder. Directed cycle = gray (raste wala) node dobara mila."
    - "Level-wise Kahn = semesters / rounds; heap se lexicographic order."
  cheatsheet: |
    ```kotlin
    for ((u, v) in edges) { adj[u].add(v); indeg[v]++ }
    val q = ArrayDeque<Int>(); for (v in 0 until n) if (indeg[v] == 0) q.addLast(v)
    while (q.isNotEmpty()) { val u = q.removeFirst(); order.add(u)
        for (v in adj[u]) if (--indeg[v] == 0) q.addLast(v) }
    if (order.size < n) /* cycle */
    // DFS: color 0 white, 1 gray, 2 black; gray mila = cycle; black hote hi post.add(u); ans = post.reversed()
    ```
  quiz:
    - q: "Topological order kis graph mein possible hai?"
      options: ["Koi bhi graph", "Sirf undirected", "Directed acyclic graph (DAG)", "Sirf tree"]
      answer: 2
      explain: "Cycle mein koi pehla node nahi — isliye sirf DAG."
    - q: "Kahn ke baad order mein 4 nodes, graph mein 6. Matlab?"
      options: ["Graph disconnected", "Cycle hai", "Galat code", "2 nodes isolated"]
      answer: 1
      explain: "Bache 2 nodes ki in-degree kabhi 0 nahi hui — cycle. (Isolated nodes to shuru mein hi queue mein jaate.)"
    - q: "prerequisites [3, 1] ka matlab 'course 3 se pehle 1'. Edge?"
      options: ["3 → 1", "1 → 3", "Dono", "Undirected 1 — 3"]
      answer: 1
      explain: "Pehle 1, phir 3 → arrow 1 → 3."
    - q: "DFS 3 color mein cycle kab?"
      options: ["White node mila", "Black node mila", "Gray node mila", "Koi bhi visited mila"]
      answer: 2
      explain: "Gray = abhi ke raste par. Usse wapas milna = back edge = cycle. Black alag raste se poora hua node hai."
    - q: "Kahn's algorithm ki time complexity?"
      options: ["O(V)", "O(V + E)", "O(V log V)", "O(V × E)"]
      answer: 1
      explain: "Har node ek baar queue mein, har edge ek baar in-degree ghatati hai."

