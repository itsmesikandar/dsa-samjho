# 13. Quick revision
revision:
  summary:
    - "slow 1, fast 2 — dono head se; condition fast != null && fast.next != null."
    - "Fast end par → slow beech mein."
    - "Mil gaye → circle (faasla har kadam 1 ghatta hai)."
    - "Circle start: milne ke baad p = head, p aur slow 1-1 kadam (a = kc − b)."
    - "i → nums[i] graph banao to array problems bhi cycle problems."
  cheatsheet: |
    ```kotlin
    // middle / cycle
    var s = head; var f = head
    while (f != null && f.next != null) {
        s = s?.next; f = f.next?.next
        if (s === f) { /* cycle */ }
    }
    // cycle start
    var p = head; while (p !== s) { p = p?.next; s = s?.next }
    // nth from end
    var fast: ListNode? = dummy; for (i in 0..n) fast = fast?.next
    var slow: ListNode? = dummy; while (fast != null) { fast = fast.next; slow = slow?.next }
    slow?.next = slow?.next?.next
    ```
  quiz:
    - q: "1 → 2 → 3 → 4 → 5 → 6 mein slow/fast (fast != null && fast.next != null) se middle?"
      options: ["3", "4", "2", "5"]
      answer: 1
      explain: "Even length mein doosra beech wala."
    - q: "Circle mein fast slow ko pakadta kyun hai?"
      options: ["Fast tez hai", "Faasla har kadam 1 ghatta hai, skip nahi hota", "Random hai", "Hamesha nahi pakadta"]
      answer: 1
      explain: "Faasla k, k−1, … 0."
    - q: "Cycle start dhoondhne ke liye milne ke baad kya?"
      options: ["fast ko head par, 2-2 kadam", "Ek pointer head par, dono 1-1 kadam", "Length gino", "Reverse karo"]
      answer: 1
      explain: "a = kc − b."
    - q: "Find Duplicate [3, 1, 3, 4, 2] mein head kaun sa index?"
      options: ["0", "1", "3", "4"]
      answer: 0
      explain: "Values 1..n hain, index 0 par koi arrow nahi aata."
    - q: "Loop condition mein sirf fast != null likha. Kya hoga?"
      options: ["Kuch nahi", "fast.next.next par null crash", "Infinite loop", "Galat middle"]
      answer: 1
      explain: "fast.next null ho sakta hai."

