# 13. Quick revision
revision:
  summary:
    - "Doubly: prev + next; node haath mein ho to O(1) delete."
    - "Delete: p.next = n, n.prev = p (dono!)."
    - "Sentinels (dummy head/tail) = koi null check / special case nahi."
    - "LRU = HashMap(key → node) + doubly list; evict tail.prev, map se bhi."
    - "Circular: aakhri.next = pehla; loop ginti ya start se roko."
  cheatsheet: |
    ```kotlin
    // sentinels
    head.next = tail; tail.prev = head
    // unlink
    node.prev!!.next = node.next; node.next!!.prev = node.prev
    // add after head
    n.next = head.next; n.prev = head; head.next!!.prev = n; head.next = n
    // LRU get: map[key] -> unlink -> addFront
    // LRU put (full): lru = tail.prev; unlink(lru); map.remove(lru.key)
    ```
  quiz:
    - q: "Doubly mein node haath mein ho to delete ki complexity?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n²)"]
      answer: 0
      explain: "prev aur next dono node ke paas hain."
    - q: "LRU cache mein kaunsa node evict hota hai (H naya, T purana)?"
      options: ["head.next", "tail.prev", "Random", "Sabse bada key"]
      answer: 1
      explain: "T ke theek pehle = sabse purana use hua."
    - q: "Sentinel nodes ka fayda?"
      options: ["Kam memory", "Pehle/aakhri node ke special cases khatam", "Fast search", "Sorting"]
      answer: 1
      explain: "Har asli node ke dono taraf koi node hota hai."
    - q: "Josephus n = 5, k = 2 — sabse pehle kaun bahar?"
      options: ["1", "2", "5", "3"]
      answer: 1
      explain: "1 se ginti: 1, 2 → 2 bahar."
    - q: "Circular list traverse mein ruke kab?"
      options: ["cur == null", "cur wapas start par aaye", "cur.value == 0", "Kabhi nahi"]
      answer: 1
      explain: "Circle mein null nahi aata."

