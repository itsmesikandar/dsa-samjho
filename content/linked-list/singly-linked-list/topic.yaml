# 13. Quick revision
revision:
  summary:
    - "Node = value + next; head se null tak chain."
    - "get(i) O(n); node haath mein ho to insert/delete O(1)."
    - "Insert: naya.next = prev.next PEHLE, phir prev.next = naya."
    - "Delete: pichhle node se cur.next = cur.next.next; head case alag (ya dummy)."
    - "Node compare = same object (===), value nahi."
  cheatsheet: |
    ```kotlin
    class ListNode(var value: Int, var next: ListNode? = null)

    var cur = head; while (cur != null) { /* use */ cur = cur.next }   // traverse
    node.next = prev.next; prev.next = node                           // insert after prev
    prev.next = prev.next?.next                                       // delete after prev
    head = ListNode(x, head)                                          // addFirst
    ```
  quiz:
    - q: "Linked list mein index 5 tak pahunchne ka time?"
      options: ["O(1)", "O(log n)", "O(5) yaani O(i)", "O(n²)"]
      answer: 2
      explain: "Head se 5 kadam chalna padta hai."
    - q: "prev ke baad node daalna — pehli line kya?"
      options: ["prev.next = node", "node.next = prev.next", "node = prev", "head = node"]
      answer: 1
      explain: "Pehle naya node aage ki list pakde, warna wo kho jaayegi."
    - q: "Intersection mein do nodes 'same' kab?"
      options: ["Value same ho", "Same object (reference) ho", "Index same ho", "next same ho"]
      answer: 1
      explain: "Alag nodes ki value bhi same ho sakti hai."
    - q: "addLast O(1) kaise?"
      options: ["size variable", "tail pointer", "Recursion", "Sort"]
      answer: 1
      explain: "tail.next = naya; tail = naya."
    - q: "999 + 1 (Add Two Numbers) mein result kitne digits?"
      options: ["3", "4", "1", "2"]
      answer: 1
      explain: "1000 — aakhri carry naya digit banata hai."

