# 13. Quick revision
revision:
  summary:
    - "prev = null, cur = head; nxt bachao → cur.next = prev → prev = cur, cur = nxt; return prev."
    - "Recursive: baaki ulta, head.next.next = head, head.next = null (O(n) stack)."
    - "Palindrome: middle + second half reverse + compare."
    - "Sublist: dummy, before, piece ulta, 2 joints."
    - "k-group: k step check, prev = groupNext se reverse, groupPrev.next = kth."
  cheatsheet: |
    ```kotlin
    fun reverse(head: ListNode?): ListNode? {
        var prev: ListNode? = null; var cur = head
        while (cur != null) { val n = cur.next; cur.next = prev; prev = cur; cur = n }
        return prev
    }
    // sublist [l, r]: before = dummy + (l-1) step; reverse (r-l+1) nodes;
    // before.next = prev; start.next = cur
    ```
  quiz:
    - q: "Reverse ke loop mein sabse pehli line?"
      options: ["cur.next = prev", "nxt = cur.next", "prev = cur", "cur = nxt"]
      answer: 1
      explain: "Aage ka raasta pehle bachao."
    - q: "Loop ke baad naya head kaun?"
      options: ["head", "cur", "prev", "null"]
      answer: 2
      explain: "cur null hai; prev purana aakhri node."
    - q: "Recursive reverse ki space?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n²)"]
      answer: 2
      explain: "n stack frames."
    - q: "1→2→3→4→5, left = 2, right = 4 ka result?"
      options: ["1→4→3→2→5", "4→3→2→1→5", "1→2→5→4→3", "5→4→3→2→1"]
      answer: 0
      explain: "Sirf 2..4 ulta."
    - q: "k = 3, list 1..5 — k-group result?"
      options: ["3→2→1→5→4", "3→2→1→4→5", "1→2→3→4→5", "5→4→3→2→1"]
      answer: 1
      explain: "Aakhri 4, 5 (k se kam) waise hi."

