# 13. Quick revision
revision:
  summary:
    - "Dummy: head se pehle nakli node; return dummy.next."
    - "Tail se banao: tail.next = x; tail = x; aakhir mein tail.next = null."
    - "Merge: chhota (<=) jodo; bacha hissa ek link."
    - "Partition/odd-even: 2 dummy lists, phir jodo — stable."
    - "Reorder = middle + reverse + weave; sort list = middle + recurse + merge."
  cheatsheet: |
    ```kotlin
    val dummy = ListNode(0); var tail = dummy
    while (p != null && q != null) {
        if (p.value <= q.value) { tail.next = p; p = p.next } else { tail.next = q; q = q.next }
        tail = tail.next!!
    }
    tail.next = p ?: q
    return dummy.next

    // partition: L, M dummies -> append -> m.next = null -> l.next = M.next
    // reorder: middle -> reverse(slow.next); slow.next = null -> weave
    ```
  quiz:
    - q: "Dummy node use karne ke baad kya return karte hain?"
      options: ["dummy", "dummy.next", "tail", "head"]
      answer: 1
      explain: "Dummy nakli hai; asli list uske baad."
    - q: "Merge mein ek list khatam — doosri ke bache nodes?"
      options: ["Ek-ek loop se jodo", "tail.next = bacha hissa (ek link)", "Chhod do", "Sort karo"]
      answer: 1
      explain: "Bacha hissa pehle se judi sorted chain hai."
    - q: "Partition List mein more ke tail ka next null kyun?"
      options: ["Speed ke liye", "Purana link circle bana sakta hai", "Sorting ke liye", "Zaroori nahi"]
      answer: 1
      explain: "Aakhri node apna purana next leke aata hai."
    - q: "1 → 2 → 3 → 4 reorder ka result?"
      options: ["1 → 4 → 2 → 3", "4 → 3 → 2 → 1", "1 → 3 → 2 → 4", "1 → 2 → 4 → 3"]
      answer: 0
      explain: "L0, L3, L1, L2."
    - q: "Sort List mein fast = head.next se kyun?"
      options: ["Fast hota hai", "2 nodes ko 1 + 1 mein todne ke liye", "Cycle ke liye", "Stability"]
      answer: 1
      explain: "Warna slow doosre par rukta aur ek hissa khaali reh jaata — infinite recursion."

