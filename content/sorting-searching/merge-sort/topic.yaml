# 13. Quick revision
revision:
  summary:
    - "Todo (mid), dono halves sort (recursion), merge (two pointers)."
    - "Hamesha O(n log n); space O(n); stable (merge mein <=)."
    - "Merge: chhota aage wala lo; bache hue copy; tmp se wapas."
    - "Merge ke time cross count: inversions (+ mid − i + 1), reverse pairs (alag pass)."
    - "Linked list + stable + guarantee → merge sort."
  cheatsheet: |
    ```kotlin
    fun sort(a: IntArray, l: Int, r: Int, t: IntArray) {
        if (l >= r) return
        val m = (l + r) / 2
        sort(a, l, m, t); sort(a, m + 1, r, t)
        var i = l; var j = m + 1; var k = l
        while (i <= m && j <= r) t[k++] = if (a[i] <= a[j]) a[i++] else a[j++]
        while (i <= m) t[k++] = a[i++]
        while (j <= r) t[k++] = a[j++]
        for (p in l..r) a[p] = t[p]
    }
    // inversions: else-branch mein count += m - i + 1
    ```
  quiz:
    - q: "8 items par merge sort ke kitne levels (todne ke)?"
      options: ["2", "3", "4", "8"]
      answer: 1
      explain: "8 → 4 → 2 → 1: log₂ 8 = 3."
    - q: "Merge sort ki worst case time?"
      options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      answer: 1
      explain: "Har case same — pieces hamesha aadhe."
    - q: "Merge mein a[i] < a[j] (strict) likha to kya bigdega?"
      options: ["Galat sort", "Stability", "Complexity", "Kuch nahi"]
      answer: 1
      explain: "Barabar par right wala pehle chala jaata hai."
    - q: "Left = [3, 7, 9], right = [5]. Merge mein 5 jaate time kitne inversions jude?"
      options: ["1", "2", "3", "0"]
      answer: 1
      explain: "Left ke bache 7, 9 dono 5 se bade → +2."
    - q: "Merge sort ki extra space (array version)?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      answer: 2
      explain: "tmp array n ka (+ O(log n) stack)."

