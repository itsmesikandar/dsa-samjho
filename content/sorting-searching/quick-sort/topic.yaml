# 13. Quick revision
revision:
  summary:
    - "Pivot → partition (chhote left, bade right) → dono taraf recursion."
    - "Average O(n log n), worst O(n²); in-place; unstable."
    - "Pivot beech/random; duplicates → 3-way / Hoare."
    - "Dutch flag: low/mid/high; 2 par mid mat badhao."
    - "Quickselect: sirf ek taraf → avg O(n); target = n − k."
  cheatsheet: |
    ```kotlin
    fun partition(a: IntArray, l: Int, r: Int): Int {
        swap(a, (l + r) / 2, r); val pv = a[r]; var s = l
        for (i in l until r) if (a[i] < pv) { swap(a, i, s); s++ }
        swap(a, s, r); return s
    }
    fun qs(a: IntArray, l: Int, r: Int) {
        if (l >= r) return
        val p = partition(a, l, r); qs(a, l, p - 1); qs(a, p + 1, r)
    }
    // Dutch flag: 0 -> swap(low++, mid++); 1 -> mid++; 2 -> swap(mid, high--)
    ```
  quiz:
    - q: "Partition ke baad pivot ke baare mein kya pakka hai?"
      options: ["Wo array ka median hai", "Wo apni final sorted jagah par hai", "Wo index 0 par hai", "Kuch nahi"]
      answer: 1
      explain: "Left sab chhote, right sab bade — yahi uski sorted jagah."
    - q: "Sorted array, pivot = pehla item. Complexity?"
      options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
      answer: 2
      explain: "Har baar ek taraf khaali → n levels."
    - q: "Dutch flag mein a[mid] = 2 par kya karte hain?"
      options: ["swap(mid, high); mid++; high--", "swap(mid, high); high--", "mid++", "swap(low, mid); low++"]
      answer: 1
      explain: "High se aaya item abhi dekhna baaki hai."
    - q: "n = 10, k-th largest k = 3 — quickselect ka target index (0-based, badhta order)?"
      options: ["2", "3", "7", "8"]
      answer: 2
      explain: "n − k = 7."
    - q: "Kaunsa quick sort ka fayda NAHI hai?"
      options: ["In-place", "Cache-friendly", "Stable", "Average fast"]
      answer: 2
      explain: "Quick sort unstable hai."

