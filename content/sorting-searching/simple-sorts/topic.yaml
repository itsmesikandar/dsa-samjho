meta:
  id: simple-sorts
  chapter: sorting-searching
  title: "Bubble, Selection, Insertion Sort"
  subtitle: Teen seedhe O(n²) sorts — kaise chalte hain, kab kaam aate hain, aur kyun interview mein poochte hain
  level: beginner
  minutes: 35
  prereqs: [array, big-o-time]
  tags: [sorting, bubble-sort, selection-sort, insertion-sort, stable, inversions]

# 1. Ye kya hai?
what:
  body: |
    **Sorting** = items ko order mein lagana (chhote se bade, ya ulta). Teen sabse simple tareeke:

    | Sort | Idea ek line mein |
    |---|---|
    | **Bubble** | Padosi jodi galat order mein? Swap. Har pass mein sabse bada end tak chala jaata hai. |
    | **Selection** | Bache hue mein se **sabse chhota** dhoondho, use aage rakh do. |
    | **Insertion** | Ek-ek item uthao, pichhle **sorted hisse** mein sahi jagah ghusa do. |

    Teeno **in-place** (O(1) extra memory) aur worst case **O(n²)**.

    > [!yaad]
    > **Stable sort** = barabar values ka purana order bana rahe. Bubble aur insertion stable hain; selection **nahi** (lamba swap barabar wale ko kood jaata hai).
  analogy: |
    **Taash ke patte haath mein lagana** = insertion sort. Naya patta uthaya, haath ke sorted patton mein sahi jagah sarka diya.

    **School assembly mein line lagana** = selection sort. Teacher poori line mein sabse chhota bachcha dhoondhti hai, use aage bulati hai. Phir baaki mein se sabse chhota…

    **Soda ke bulbule** = bubble sort. Bada bulbula dheere-dheere upar (end tak) aata hai.

# 2. Kyun chahiye?
why:
  body: |
    Real code mein tum `sort()` hi likhoge (O(n log n)). Phir ye kyun seekhein?

    - **Insertion sort sach mein use hota hai:** chhote arrays (≤ ~20 items) aur **lagbhag sorted** data par ye sabse fast hai. Java/Kotlin ka built-in sort (TimSort) andar chhote tukdon ke liye insertion sort hi chalata hai.
    - **Ideas baar-baar aate hain:** selection = "k chhote dhoondho", bubble ke swaps = **inversions**, insertion = "sorted list mein naya item daalo".
    - Interview mein **complexity, stability, best/worst case** poochte hain — inhi se samjho.

    > [!socho]
    > Array **pehle se sorted** hai. Kaun sa sort sabse jaldi pakdega?
    >
    > **Insertion** (ya `swapped` flag wala bubble): har item ek compare mein "theek hai" → O(n). Selection phir bhi poora O(n²) chalega — use pata hi nahi chalta ki array sorted hai.

# 3. Visual intro
visual:
  body: |
    **Bubble sort** bars par. Peele = compare ho rahe padosi, laal/narangi = swap, hare = pakki jagah.

    Dekho: har pass ke baad sabse bada bacha bar end par pahunch jaata hai. Apna array daal ke try karo — sorted array par ek pass mein ruk jaata hai.
  viz: { tracer: bubbleBars }

# 4. Kaise kaam karta hai
how:
  body: |
    **Insertion sort** (teeno mein sabse kaam ka):

    1. Index 0 akela — sorted.
    2. `i = 1` se: `key = a[i]` uthao (jagah khaali).
    3. Left mein jab tak item `> key`, use ek jagah **daayein khiskao**.
    4. Jahan ruke, wahan `key` rakho.

    Ab `0..i` sorted. Aage badho.

    > [!tip]
    > `a[j] > key` (strict `>`) se barabar items aage nahi kudte — isliye insertion sort **stable** hai. `>=` likha to stability toot jaayegi.
  viz: { tracer: insertionTrace }
  code: how

# 5. Operations table
operations:
  - op: "Bubble sort (swapped flag ke saath)"
    time: "Best O(n), worst O(n²)"
    space: O(1)
    why: "Stable. Sorted input par ek pass mein ruk jaata hai."
  - op: "Selection sort"
    time: "Hamesha O(n²)"
    space: O(1)
    why: "Unstable. Swaps sirf n − 1 — jab write mehenga ho tab kaam ka."
  - op: "Insertion sort"
    time: "Best O(n), worst O(n²)"
    space: O(1)
    why: "Stable, adaptive (lagbhag sorted par fast), online (items aate-aate sort)."
  - op: "Insertion sort, k-sorted input"
    time: O(n·k)
    space: O(1)
    why: "Har item max k jagah khiskta hai."
  - op: "Shifts / adjacent swaps ki ginti"
    time: "= inversions"
    space: "lagu nahi"
    why: "Har adjacent swap thik ek ulta jodi theek karta hai."
  - op: "Built-in sort (TimSort / Dual-Pivot Quicksort)"
    time: O(n log n)
    space: "O(n) / O(log n)"
    why: "Real code mein yahi — Sorting in practice topic."

# 6. Code
code:
  - title: Bubble sort (jaldi rukne wala)
    file: bubble
    note: |
      `swapped` flag ke bina bubble sort sorted array par bhi poora O(n²) chalta. Flag se best case O(n). Andar ka loop `n − 1 − pass` tak — end ke `pass` items pehle se pakke hain.
  - title: Selection sort
    file: selection
    note: |
      Har pass mein ek hi swap. Isliye total swaps ≤ n − 1 — jab memory mein likhna mehenga ho (flash memory) tab ye pasand kiya jaata tha. Par compares hamesha n²/2.

# 7. Examples
examples:
  - id: height-checker
    level: easy
    title: Line mein kitne students galat jagah?
    source: { name: Height Checker, platform: LeetCode, url: "https://leetcode.com/problems/height-checker/" }
    problem: |
      Students ki heights ek line mein di hain. Line **badhte order** mein honi chahiye. Kitne students apni sahi jagah par **nahi** khade?

      Example: `[1, 1, 4, 2, 1, 3]` → **3**
    intuition: |
      "Sahi jagah" = sorted line mein jo hona chahiye. To:
      1. Ek **copy** banao aur sort karo (asli mat chhedo — usse compare karna hai).
      2. Dono ko index-by-index milao; jahan alag, `count++`.

      Yahan sort ke liye selection sort likha hai (practice). Asli code mein `heights.sorted()` likho.

      > [!tip]
      > Heights 1..100 tak hain → **counting sort**: har height kitni baar aayi gino, phir order mein bharo. O(n + 100) = O(n). Chhoti range = counting sort socho.
    dryRun: |
      | Index | heights | expected | Sahi? |
      |---|---|---|---|
      | 0 | 1 | 1 | ✓ |
      | 1 | 1 | 1 | ✓ |
      | 2 | 4 | 1 | ✗ |
      | 3 | 2 | 2 | ✓ |
      | 4 | 1 | 3 | ✗ |
      | 5 | 3 | 4 | ✗ → **3** |
    viz: { tracer: heightTrace }
    code: ex1-height
    complexity:
      time: O(n²)
      space: O(n)
      why: "Selection sort O(n²) + copy O(n). Built-in sort se O(n log n), counting sort se O(n)."

  - id: count-swaps
    level: medium
    title: Kitne adjacent swaps lagenge? (inversions)
    source: { name: Inversion of Array, platform: GFG, url: "https://www.geeksforgeeks.org/problems/inversion-of-array-1587115620/1" }
    problem: |
      Sirf **padosi** items ko swap kar sakte ho. Array sort karne mein **kam se kam** kitne swaps lagenge?

      Example: `[2, 4, 1, 3, 5]` → **3**
    intuition: |
      **Inversion** = aisa jodi `(i, j)` jahan `i < j` par `a[i] > a[j]` (ulta order). `[2, 4, 1, 3, 5]` mein: (2,1), (4,1), (4,3) → 3.

      Ek adjacent swap **thik ek** inversion khatam karta hai (sirf un do ka order badla, baaki sab ke saath relative order wahi). Sorted array mein 0 inversions. To:

      **minimum swaps = inversions**, aur bubble sort exactly utne hi swaps karta hai.

      > [!socho]
      > n = 10⁵ ho to? Bubble O(n²) = 10¹⁰ — bahut slow. **Merge sort** ke merge step mein inversions O(n log n) mein gine jaate hain — Merge Sort topic ka example.
    dryRun: |
      `[2, 4, 1, 3, 5]`

      | Pass | Swap | Array | swaps |
      |---|---|---|---|
      | 1 | 4 ↔ 1 | 2 1 4 3 5 | 1 |
      | 1 | 4 ↔ 3 | 2 1 3 4 5 | 2 |
      | 2 | 2 ↔ 1 | 1 2 3 4 5 | **3** |
    viz: { tracer: swapsTrace }
    code: ex2-swaps
    complexity:
      time: O(n²)
      space: O(n)
      why: "Bubble sort copy par; har compare O(1). Merge sort se O(n log n)."

  - id: nearly-sorted
    level: tricky
    title: Lagbhag sorted array (har item k door)
    source: { name: Nearly sorted, platform: GFG, url: "https://www.geeksforgeeks.org/problems/nearly-sorted-1587115620/1" }
    problem: |
      Array lagbhag sorted hai: har item apni **sahi (sorted) jagah se zyada se zyada `k` door** hai. Ise sort karo.

      Example: `[6, 5, 3, 2, 8, 10, 9]`, k = 3 → `[2, 3, 5, 6, 8, 9, 10]`
    intuition: |
      General sort O(n log n). Par yahan **extra jaankari** hai — har item paas hi hai. Kaun sa sort isse fayda uthata hai?

      **Insertion sort:** har key utna hi peeche khiskti hai jitne bade items uske left mein hain. k-sorted mein wo **≤ k** hain (warna key apni jagah se k se zyada door hoti). To andar ka loop ≤ k → **O(n·k)**.

      k chhota (jaise 3) → lagbhag **O(n)**!

      > [!tip]
      > k bada ho to **min-heap of size k + 1** → O(n log k). Heap chapter (Top-K) mein. Interview mein dono batao: k chhota → insertion, k bada → heap.

      > [!galti]
      > "Lagbhag sorted" sun ke quick sort mat lagao — simple pivot (pehla/aakhri item) sorted data par O(n²) ho jaata hai.
    dryRun: |
      | key | Peeche khiska | Array ke baad |
      |---|---|---|
      | 5 | 1 (6) | 5 6 3 2 8 10 9 |
      | 3 | 2 (6, 5) | 3 5 6 2 8 10 9 |
      | 2 | 3 (6, 5, 3) | 2 3 5 6 8 10 9 |
      | 8, 10 | 0 | – |
      | 9 | 1 (10) | **2 3 5 6 8 9 10** |
    viz: { tracer: nearlyTrace }
    code: ex3-nearly
    complexity:
      time: O(n·k)
      space: O(1)
      why: "Har item ke liye andar ka loop max k baar."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Array bahut chhota hai (≤ ~20) — insertion sort ka overhead sabse kam."
    - "Data lagbhag sorted hai ya items ek-ek karke aa rahe hain — insertion sort."
    - "Swaps / writes mehenge hain — selection sort (max n − 1 swaps)."
    - "Inversions ya 'adjacent swaps' ginne hain — bubble ka idea (bade n par merge sort)."
  avoid:
    - "n bada (> 10⁴) aur random data — O(n²) TLE; built-in sort lo."
    - "Stable sort chahiye — selection mat lo."
    - "Values ki range chhoti hai — counting sort O(n + range)."
  signals:
    - keyword: "nearly sorted, each element at most k away"
      think: "Insertion O(n·k) ya heap O(n log k)."
    - keyword: "minimum adjacent swaps"
      think: "= inversions count."
    - keyword: "small fixed range values (0..100)"
      think: "Counting sort."
    - keyword: "sort in place, O(1) space, n chhota"
      think: "Insertion sort."

# 9. Real-world
realWorld:
  - where: "Java / Kotlin sort"
    how: "TimSort andar 32-64 size ke chhote tukdon ko insertion sort se sort karta hai, phir merge."
  - where: "Taash / card games apps"
    how: "Haath ke patte lagana — naya patta aate hi insertion."
  - where: "Leaderboard (live)"
    how: "Ek player ka score badla — sirf wo item apni nayi jagah tak khiskao (insertion step), poora sort nahi."
  - where: "Embedded / flash memory"
    how: "Likhna mehenga — selection sort kam se kam writes karta hai."
  - where: "Rankings comparison"
    how: "Do logon ki movie ranking kitni alag? Inversions gino (Kendall tau distance)."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Bubble mein inner loop poora n tak"
    type: off-by-one
    wrong: |
      `for (j in 0 until n)` → `a[j + 1]` index bahar (crash), aur pakke items par bekaar compare.
    right: |
      `for (j in 0 until n - 1 - pass)`.
  - title: "swapped flag bhool gaye"
    type: logic
    wrong: |
      Sorted array par bhi poore n − 1 passes → best case O(n²).
    right: |
      Pass mein swap nahi hua → `break`.
  - title: "Insertion mein >= likha"
    type: logic
    wrong: |
      `while (j >= 0 && a[j] >= key)` — barabar items bhi khiske → stability gayi, extra kaam.
    right: |
      Strict `>` — barabar item par ruk jao, key uske baad baithe.
  - title: "Insertion mein key ko pehle save nahi kiya"
    type: logic
    wrong: |
      Shift karte waqt `a[i]` overwrite ho gaya, phir `a[j + 1] = a[i]` galat value.
    right: |
      Shuru mein `val key = a[i]`.
  - title: "Khaali ya 1 item ka array"
    type: empty
    right: |
      Teeno sorts ke loops (`1 until n`, `0 until n - 1`) n = 0 ya 1 par khud skip ho jaate hain — alag check nahi chahiye. Bas `a[n - 1]` jaisa index seedha mat padhna jab n = 0 ho.

# 11. Interview corner
interview:
  questions:
    - q: "Teeno simple sorts ki best / worst complexity?"
      a: |
        Bubble (flag ke saath): best O(n), worst O(n²). Selection: hamesha O(n²). Insertion: best O(n), worst O(n²). Teeno O(1) space.
    - q: "Stable sort kya hai? Kaunse stable hain?"
      a: |
        Barabar keys ka original order bana rahe. Bubble, insertion stable; selection nahi. Stability tab zaroori jab pehle ek field se sort kiya ho aur ab doosre se karna ho.
    - q: "Lagbhag sorted data ke liye kaunsa simple sort?"
      a: |
        Insertion — adaptive hai: kaam = O(n + inversions). k-sorted par O(n·k).
    - q: "Selection sort kab better hai?"
      a: |
        Jab swaps/writes mehenge hon — max n − 1 swaps. Warna nahi.
    - q: "Inversions kya hain aur bubble sort se rishta?"
      followUp: true
      a: |
        i < j, a[i] > a[j] wale jode. Har adjacent swap ek inversion hataata hai, to bubble ke swaps = inversions. O(n log n) ginti merge sort se.
    - q: "Built-in sort andar insertion sort kyun use karta hai?"
      a: |
        Chhote n par O(n²) ka constant chhota hai, recursion/merge ka overhead nahi. TimSort chhote runs insertion se banata hai.
    - q: "Insertion sort online kyun kehte hain?"
      a: |
        Saara data pehle se nahi chahiye — har naya item aate hi sorted hisse mein daal sakte ho.
    - q: "Kya comparison sort O(n log n) se tez ho sakta hai?"
      followUp: true
      a: |
        Nahi (worst case) — n! orders mein se ek chunna hai, har compare 2 raaste → log₂(n!) ≈ n log n compares. Counting/radix sort comparison nahi karte, isliye O(n) ho sakte hain.
  mayAsk:
    - "Sort Colors (0, 1, 2) ek pass mein."
    - "Insertion Sort List (linked list par)."
    - "Selection sort stable kaise banaoge? (swap ki jagah shift)"
    - "Bubble sort ka ek pass kya guarantee karta hai?"

