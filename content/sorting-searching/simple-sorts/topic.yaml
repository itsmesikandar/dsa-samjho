# 13. Quick revision
revision:
  summary:
    - "Bubble: padosi swap, best O(n) flag se; selection: min dhoondho, hamesha O(n²); insertion: sorted hisse mein ghusao."
    - "Teeno O(1) space. Bubble + insertion stable, selection nahi."
    - "Insertion = adaptive: O(n + inversions), k-sorted par O(n·k)."
    - "Adjacent swaps = inversions."
    - "Real code: built-in sort; chhote/lagbhag sorted: insertion."
  cheatsheet: |
    ```kotlin
    // insertion
    for (i in 1 until a.size) {
        val key = a[i]; var j = i - 1
        while (j >= 0 && a[j] > key) { a[j + 1] = a[j]; j-- }
        a[j + 1] = key
    }
    // selection
    for (i in 0 until n - 1) {
        var m = i
        for (j in i + 1 until n) if (a[j] < a[m]) m = j
        a[i] = a[m].also { a[m] = a[i] }
    }
    // bubble: for pass, for j in 0 until n-1-pass, swap if a[j] > a[j+1]; no swap -> break
    ```
  quiz:
    - q: "Pehle se sorted array par kaunsa sort O(n²) hi lega?"
      options: ["Insertion", "Bubble (flag ke saath)", "Selection", "Teeno O(n)"]
      answer: 2
      explain: "Selection har baar poora bacha hissa scan karta hai."
    - q: "[3, 1, 2] mein kitne inversions?"
      options: ["1", "2", "3", "0"]
      answer: 1
      explain: "(3,1) aur (3,2)."
    - q: "Kaunsa sort stable NAHI hai?"
      options: ["Bubble", "Insertion", "Selection", "Teeno stable"]
      answer: 2
      explain: "Lamba swap barabar values ka order badal sakta hai: [2a, 2b, 1] → [1, 2b, 2a]."
    - q: "Har item max 2 door hai (k = 2), n = 10⁶. Insertion sort?"
      options: ["O(n²) — slow", "O(n·k) ≈ 2×10⁶ — fast", "O(n log n)", "Kaam nahi karega"]
      answer: 1
      explain: "Andar ka loop max k baar."
    - q: "Bubble sort ke ek pass ke baad pakka kya pata hai?"
      options: ["Sabse chhota pehle", "Sabse bada end par", "Array sorted", "Kuch nahi"]
      answer: 1
      explain: "Bada item har swap mein aage jaata hai, end tak."

