# 13. Quick revision
revision:
  summary:
    - "Har variation = monotonic predicate ka pehla T."
    - "First-true: lo = 0, hi = n, lo < hi; T → hi = mid; F → lo = mid + 1; return lo."
    - "lower = pehla ≥ x; upper = pehla > x; ginti = upper − lower."
    - "First/last: lower aur upper − 1 (pehle check ki target hai)."
    - "Rotated: a[lo] <= a[mid] → left sorted; target uski range mein? Wahin jao."
  cheatsheet: |
    ```kotlin
    fun firstTrue(lo0: Int, hi0: Int, p: (Int) -> Boolean): Int {
        var lo = lo0; var hi = hi0          // hi0 = "koi nahi"
        while (lo < hi) {
            val m = lo + (hi - lo) / 2
            if (p(m)) hi = m else lo = m + 1
        }
        return lo
    }
    val lower = firstTrue(0, n) { a[it] >= x }
    val upper = firstTrue(0, n) { a[it] > x }
    // rotated: if (a[lo] <= a[mid]) left sorted else right sorted
    ```
  quiz:
    - q: "[1, 3, 3, 3, 5] — lowerBound(3) aur upperBound(3)?"
      options: ["1 aur 3", "1 aur 4", "0 aur 4", "1 aur 5"]
      answer: 1
      explain: "Pehla 3 index 1; pehla > 3 (5) index 4."
    - q: "First-true template mein mid T ho to?"
      options: ["lo = mid + 1", "hi = mid", "hi = mid − 1", "return mid"]
      answer: 1
      explain: "Mid khud pehla T ho sakta hai."
    - q: "Koi bhi item ≥ x nahi — lowerBound kya dega?"
      options: ["−1", "0", "n", "n − 1"]
      answer: 2
      explain: "hi = n se shuru; lo n tak pahunchta hai = 'koi nahi'."
    - q: "[6, 7, 1, 2, 3, 4, 5], lo = 0, hi = 6, mid = 3 — kaunsa half sorted?"
      options: ["Left", "Right", "Dono", "Koi nahi"]
      answer: 1
      explain: "a[lo] = 6 > a[mid] = 2 → right half [2..5] sorted."
    - q: "Sorted array mein 7 kitni baar — formula?"
      options: ["lower(7) − upper(7)", "upper(7) − lower(7)", "upper(7) + 1", "lower(8)"]
      answer: 1
      explain: "Pehla > 7 minus pehla ≥ 7."

