# 13. Quick revision
revision:
  summary:
    - "Answer ek number + 'x chalega?' monotonic → answer ki range par binary search."
    - "Range: lo = pakka kam/sabse chhota possible, hi = pakka chalega."
    - "Minimize → first-true (hi = mid). Maximize → last-true (mid upar round, lo = mid)."
    - "Feasible often greedy O(n): Koko ghante, ship din, pairs count."
    - "Time O(n log R); ceil = (p − 1)/k + 1; totals Long."
  cheatsheet: |
    ```kotlin
    // minimize
    var lo = LOW; var hi = HIGH            // HIGH pakka feasible
    while (lo < hi) {
        val m = lo + (hi - lo) / 2
        if (feasible(m)) hi = m else lo = m + 1
    }
    // maximize
    while (lo < hi) {
        val m = lo + (hi - lo + 1) / 2
        if (feasible(m)) lo = m else hi = m - 1
    }
    // ship check
    var d = 1; var load = 0
    for (x in w) { if (load + x > cap) { d++; load = 0 }; load += x }
    ```
  quiz:
    - q: "Koko, piles [3, 6, 7, 11]: speed 4 par kitne ghante?"
      options: ["6", "8", "10", "7"]
      answer: 1
      explain: "⌈3/4⌉ + ⌈6/4⌉ + ⌈7/4⌉ + ⌈11/4⌉ = 1 + 2 + 2 + 3 = 8."
    - q: "Ship packages mein hi kya rakhte hain?"
      options: ["max(weights)", "sum(weights)", "days", "n"]
      answer: 1
      explain: "Sab ek din mein — pakka feasible."
    - q: "\"Maximize the minimum distance\" mein mid kaise?"
      options: ["lo + (hi − lo) / 2", "lo + (hi − lo + 1) / 2", "(lo + hi) / 2 − 1", "hi − 1"]
      answer: 1
      explain: "Last-true: upar round, warna lo = mid par atak jaate."
    - q: "Answer range 1..10⁹, check O(n). Total?"
      options: ["O(n · 10⁹)", "O(n log 10⁹) ≈ 30n", "O(log n)", "O(n²)"]
      answer: 1
      explain: "~30 checks."
    - q: "Binary search on answer ki zaroori condition?"
      options: ["Input sorted ho", "feasible(x) monotonic ho", "Answer 0 ho sakta ho", "n chhota ho"]
      answer: 1
      explain: "F…F T…T pattern chahiye; input sorted hona zaroori nahi."

