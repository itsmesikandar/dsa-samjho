# 13. Quick revision
revision:
  summary:
    - "Sorted + beech dekho + aadha hatao = O(log n)."
    - "Closed template: lo <= hi, mid ± 1."
    - "mid = lo + (hi − lo) / 2 (overflow se bachao)."
    - "Nahi mila to lo = insert position."
    - "2D: i → (i / cols, i % cols); unknown size: hi double karo."
  cheatsheet: |
    ```kotlin
    fun bs(a: IntArray, t: Int): Int {
        var lo = 0; var hi = a.size - 1
        while (lo <= hi) {
            val m = lo + (hi - lo) / 2
            when {
                a[m] == t -> return m
                a[m] < t  -> lo = m + 1
                else      -> hi = m - 1
            }
        }
        return -1      // ya insert position: lo
    }
    // built-in: a.binarySearch(x)  -> nahi mila: -(ins) - 1
    ```
  quiz:
    - q: "10⁶ sorted items mein binary search ke max step (approx)?"
      options: ["10", "20", "1000", "10⁶"]
      answer: 1
      explain: "log₂ 10⁶ ≈ 20."
    - q: "[2, 4, 6, 8], target 5 — loop ke baad lo?"
      options: ["1", "2", "3", "-1"]
      answer: 1
      explain: "5 ki jagah index 2 (4 aur 6 ke beech)."
    - q: "lo <= hi template mein a[mid] < target par kya?"
      options: ["lo = mid", "lo = mid + 1", "hi = mid", "hi = mid − 1"]
      answer: 1
      explain: "mid dekh liya, wo answer nahi — use bhi hatao."
    - q: "3×4 matrix, line index 7 kahan hai?"
      options: ["(1, 3)", "(2, 1)", "(1, 2)", "(0, 7)"]
      answer: 0
      explain: "7 / 4 = 1, 7 % 4 = 3."
    - q: "arr.binarySearch(25) ne −3 diya. Insertion point?"
      options: ["3", "2", "−2", "4"]
      answer: 1
      explain: "−(−3 + 1) = 2."

