# 13. Quick revision
revision:
  summary:
    - "Binary tree: har node ke max 2 bachche; root, leaf, height, subtree."
    - "Mantra: f(node) = combine(f(left), f(right), node); base = null."
    - "Bottom-up (return) vs top-down (parameter)."
    - "Complexity O(n) time, O(h) space; h = log n (balanced) se n (skewed)."
    - "Input format: level order, # = null; queue se build."
  cheatsheet: |
    ```kotlin
    fun height(r: TreeNode?): Int = if (r == null) 0 else 1 + maxOf(height(r.left), height(r.right))
    fun invert(r: TreeNode?): TreeNode? { if (r == null) return null
        val l = invert(r.left); r.left = invert(r.right); r.right = l; return r }
    fun dfs(n: TreeNode?, info: Int) { if (n == null) return
        /* use info */ dfs(n.left, newInfo); dfs(n.right, newInfo) }    // top-down
    ```
  quiz:
    - q: "[1, 2, 3, 4] (level order) ki height (nodes mein)?"
      options: ["2", "3", "4", "1"]
      answer: 1
      explain: "1 → 2 → 4: 3 nodes."
    - q: "Leaf kaun?"
      options: ["Jiska left null", "Jiske dono bachche null", "Root", "Jiska right null"]
      answer: 1
      explain: "Koi bachcha nahi."
    - q: "Skewed tree (n nodes) mein recursion ki space?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n²)"]
      answer: 2
      explain: "Height = n."
    - q: "Perfect tree height 4 (nodes mein) ke kitne nodes?"
      options: ["8", "15", "16", "4"]
      answer: 1
      explain: "2⁴ − 1 = 15."
    - q: "'Raaste ka max' kaise bhejoge?"
      options: ["Global variable", "Parameter (top-down)", "Return value", "Queue"]
      answer: 1
      explain: "Har raaste ka apna max — parameter."

