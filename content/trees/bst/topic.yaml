# 13. Quick revision
revision:
  summary:
    - "BST: har node par left subtree sab chhote, right subtree sab bade (poora subtree)."
    - "Inorder = sorted. Search / insert / delete = O(h)."
    - "Insert: search raasta, null par naya leaf; node.left = insert(node.left, key)."
    - "Delete: leaf / ek bachcha / do bachche (successor copy + delete)."
    - "Validate: range (lo, hi) Long mein. Sorted insert = line → TreeMap (Red-Black) use karo."
  cheatsheet: |
    ```kotlin
    fun insert(n: TreeNode?, k: Int): TreeNode {
        if (n == null) return TreeNode(k)
        if (k < n.value) n.left = insert(n.left, k)
        else if (k > n.value) n.right = insert(n.right, k)
        return n
    }
    fun valid(n: TreeNode?, lo: Long, hi: Long): Boolean =
        n == null || (n.value > lo && n.value < hi &&
            valid(n.left, lo, n.value.toLong()) && valid(n.right, n.value.toLong(), hi))
    // delete, 2 bachche: s = right ka leftmost; n.value = s.value; n.right = delete(n.right, s.value)
    ```
  quiz:
    - q: "BST [8, 3, 10, 1, 6] ka inorder?"
      options: ["[8, 3, 10, 1, 6]", "[1, 3, 6, 8, 10]", "[1, 6, 3, 10, 8]", "[8, 3, 1, 6, 10]"]
      answer: 1
      explain: "BST ka inorder hamesha sorted."
    - q: "1, 2, 3, 4, 5 order mein insert kiya. Search ka worst time?"
      options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"]
      answer: 2
      explain: "Har node right mein — line ban gayi, h = n."
    - q: "[5, 1, 6, #, #, 3, 7] valid BST hai?"
      options: ["Haan", "Nahi — 3 right subtree mein 5 se chhota", "Nahi — 1 galat jagah", "Haan, kyunki 3 < 6"]
      answer: 1
      explain: "Poore right subtree ko 5 se bada hona chahiye."
    - q: "Do bachchon wale node ko delete karte waqt kiski value copy karte hain?"
      options: ["Left bachcha", "Right bachcha", "Inorder successor (right ka min)", "Root"]
      answer: 2
      explain: "Successor (ya predecessor) — order bana rehta hai, height nahi badhti."
    - q: "Naya node insert ke baad hamesha kya hota hai?"
      options: ["Root", "Leaf", "Do bachchon wala", "Kahin bhi"]
      answer: 1
      explain: "Search raaste par pehli null jagah — wahan leaf banta hai."

