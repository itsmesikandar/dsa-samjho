meta:
  id: level-order
  chapter: trees
  title: Level Order (BFS)
  subtitle: Queue se tree ko level by level padho — upar se neeche, har level left se right
  level: intermediate
  minutes: 35
  prereqs: [binary-tree-basics, queue]
  tags: [tree, bfs, queue, level-order]

# 1. Ye kya hai?
what:
  body: |
    **Level order** (BFS — Breadth First Search) = tree ko **level by level** padhna. Pehle root (level 0), phir uske bachche (level 1), phir unke bachche (level 2)… har level **left se right**.

    Tree `[3, 9, 20, #, #, 15, 7]` → `[[3], [9, 20], [15, 7]]`

    Iska tool hai **queue** (FIFO): jo pehle aaya wo pehle niklega. Node nikalo, uske bachche queue ke **peeche** lagao — wo apne level ke baaki nodes ke baad hi aayenge.

    > [!yaad]
    > DFS = stack (ya recursion) → pehle **deep**. BFS = queue → pehle **wide** (saare paas wale).
  analogy: |
    **Shaadi ka family photo:**
    Photographer pehle daada-daadi ko bulata hai (level 0), phir unke bachchon ko (level 1), phir poton ko (level 2). Har line mein log left se right khade hote hain.

    Bulane ki list ek line (queue) hai — jise bulaya uske bachchon ke naam list ke **aakhir** mein likh do.

# 2. Kyun chahiye?
why:
  body: |
    Kuch sawaal **level** ke baare mein hote hain — DFS se ye awkward hain:
    - Har level ka average / max / sum.
    - Right side view (har level ka aakhri).
    - **Min depth** — sabse paas wali leaf. BFS pehli leaf par ruk jaata hai; DFS ko poora tree dekhna padta hai.
    - Zigzag, width, cousins (same level, alag parent).

    Aur ye **graph BFS** ka chhota form hai — shortest path (har edge ka weight same) yahi idea hai.

    > [!socho]
    > Recursion se level order ho sakta hai?
    >
    > Haan — DFS mein `depth` saath bhejo aur `res[depth].add(value)`. Order sahi aata hai (har level mein left pehle visit). Par "pehli leaf par ruko" jaise early stop BFS hi deta hai.

# 3. Visual intro
visual:
  body: |
    Har level ko alag color. `L0`, `L1`… = root se kitne step door. Level order = inhe upar se neeche padhna.
  viz: { tracer: levelsIntro }

# 4. Kaise kaam karta hai
how:
  body: |
    1. Queue mein root daalo.
    2. Jab tak queue khaali nahi:
       - `size = queue.size` — **abhi** queue mein jitne hain, utne hi is level ke hain.
       - `size` baar: aage se nikalo, value level list mein, bachche (left phir right) peeche daalo.
       - Level list result mein jodo.

    **Size pehle kyun note karte hain?** Loop ke beech naye bachche queue mein judte hain. Agar har baar `queue.size` dekhte to agle level ke nodes bhi is level mein count karte.

    > [!tip]
    > Level ki zaroorat nahi (bas order chahiye)? Size wala andar ka loop hata do — simple `while (q.isNotEmpty())` kaafi hai.
  viz: { tracer: bfsTrace }
  code: how

# 5. Operations table
operations:
  - op: "Level order (list of levels)"
    time: O(n)
    space: "O(w) — w = max width"
    why: "Har node ek baar queue mein, ek baar bahar. Queue mein max ek-do level."
  - op: "Har level ka avg / max / sum"
    time: O(n)
    space: O(w)
    why: "Level loop ke andar hisaab."
  - op: "Min depth (BFS)"
    time: "O(n) worst"
    space: O(w)
    why: "Pehli leaf par ruk jaata hai — often bahut jaldi."
  - op: "Right / left side view"
    time: O(n)
    space: O(w)
    why: "Level ka aakhri / pehla."
  - op: "Max width (positions ke saath)"
    time: O(n)
    space: O(w)
    why: "Har node ke saath ek number."
  - op: "Zigzag"
    time: O(n)
    space: O(w)
    why: "Har doosre level ki list ulti (ya deque mein aage se daalo)."

# 6. Code
code:
  - title: Har level ka average
    file: average
    note: |
      Wahi level loop — bas values list mein daalne ki jagah `sum` mein jodo, aakhir mein `sum / size`.

      `[3, 9, 20, #, #, 15, 7]` → `[3.0, 14.5, 11.0]`. Sum ko `Long` rakha — bahut bade values jodne par `Int` overflow ho sakta hai.

# 7. Examples
examples:
  - id: min-depth
    level: easy
    title: Sabse paas wali leaf kitni door?
    source: { name: Minimum Depth of Binary Tree, platform: LeetCode, url: "https://leetcode.com/problems/minimum-depth-of-binary-tree/" }
    problem: |
      Root se **sabse paas wali leaf** tak raaste mein kitne nodes hain? (Leaf = jiske dono bachche null.)

      Example: `[1, 2, 3, 4, 5, #, 6, 7, #, #, #, 8]` → **3** (1 → 2 → 5)
    intuition: |
      BFS level by level jaata hai. Jo **pehli leaf** mile, wo sabse kam depth par hai — wahin `return depth`. Neeche ke levels dekhne ki zaroorat hi nahi.

      DFS se bhi hota hai (`1 + min(left, right)`), par poora tree ghoomna padta hai.

      > [!galti]
      > DFS mein seedha `1 + min(minDepth(left), minDepth(right))` likha. Ek bachcha null ho to wo 0 deta hai — par null **leaf nahi** hai! Ek side null ho to doosri side ka hi lo.
    dryRun: |
      | depth | Level ke nodes | Leaf? |
      |---|---|---|
      | 1 | 1 | nahi |
      | 2 | 2, 3 | nahi, nahi |
      | 3 | 4, 5, 6 | 4 nahi, **5 haan** → 3 |

      7 aur 8 (depth 4) dekhe hi nahi.
    viz: { tracer: minDepthTrace }
    code: ex1-min-depth
    complexity:
      time: O(n)
      space: O(w)
      why: "Worst case (leaf sabse neeche) saare nodes; often jaldi ruk jaata hai."

  - id: right-view
    level: medium
    title: Right se dekho to kya dikhega?
    source: { name: Binary Tree Right Side View, platform: LeetCode, url: "https://leetcode.com/problems/binary-tree-right-side-view/" }
    problem: |
      Tree ke **right** khade ho kar dekho. Har level ka sirf ek node dikhega. Upar se neeche woh values batao.

      Example: `[1, 2, 3, #, 5, #, 4, 6]` → `[1, 3, 4, 6]`
    intuition: |
      Har level ka **aakhri** node (`k == size − 1`) dikhega — baaki uske peeche chhup jaate hain.

      > [!galti]
      > "Bas right-right chalte jao" → galat! Upar example mein 6 ek **left** bachcha hai, par apne level par akela hai, isliye dikhta hai. Level ka aakhri chahiye, right pointer nahi.

      DFS version: pehle **right** bachcha visit karo; har depth par jo pehla node aaye wo view mein (`if (depth == res.size) res.add`).
    dryRun: |
      | Level | Nodes | Aakhri |
      |---|---|---|
      | 0 | 1 | 1 |
      | 1 | 2, 3 | 3 |
      | 2 | 5, 4 | 4 |
      | 3 | 6 | **6** (left bachcha!) |
    viz: { tracer: rightViewTrace }
    code: ex2-right-view
    complexity:
      time: O(n)
      space: O(w)
      why: "Har node ek baar."

  - id: max-width
    level: tricky
    title: Tree ki sabse wide level
    source: { name: Maximum Width of Binary Tree, platform: LeetCode, url: "https://leetcode.com/problems/maximum-width-of-binary-tree/" }
    problem: |
      Level ki **width** = sabse left aur sabse right node ke beech ki saari jagahen — **beech ke khaali (null) bhi count kiye jaate hain**. Sabse badi width batao.

      Example: `[1, 3, 2, 5, #, #, 9, 6, #, 7]` → **7** (level 3: 6 aur 7 ke beech 5 khaali)
    intuition: |
      Nodes count karna kaafi nahi — khaali jagah bhi chahiye. Har node ko **position number** do, jaise complete tree mein (array wala heap):
      - Root = 0.
      - Left bachcha = `2i`, right = `2i + 1`.

      Width = `aakhri position − pehli position + 1`.

      > [!galti]
      > Positions har level par double hote hain → 30-40 level deep tree mein `Long` bhi overflow. Fix: har level par `first` ghatao, taaki level 0 se shuru ho.
    dryRun: |
      | Level | Nodes (position) | Width |
      |---|---|---|
      | 0 | 1 (0) | 1 |
      | 1 | 3 (0), 2 (1) | 2 |
      | 2 | 5 (0), 9 (3) | 4 |
      | 3 | 6 (0), 7 (6) | **7** |

      9 ka position 3 → uska left bachcha 7 = 2 × 3 = 6.
    viz: { tracer: widthTrace }
    code: ex3-width
    complexity:
      time: O(n)
      space: O(w)
      why: "Har node ek baar, saath mein ek number."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Sawaal mein 'level', 'row', 'depth wise' → BFS."
    - "Sabse paas / min depth / pehla mila to ruko → BFS."
    - "Same level ke nodes ko jodna (next pointer, cousins)."
  avoid:
    - "Root se leaf ka raasta / path sum → DFS (raasta stack mein rehta hai)."
    - "Bahut wide tree aur memory tight → DFS (O(h) vs O(w))."
    - "Subtree se jawab chahiye (height, diameter) → postorder DFS."
  signals:
    - keyword: "level / row / each depth"
      think: "BFS + size snapshot."
    - keyword: "minimum depth / nearest leaf"
      think: "BFS, pehli leaf par return."
    - keyword: "right view / left view / zigzag"
      think: "Level ka aakhri / pehla / ulta."
    - keyword: "width including nulls"
      think: "Position index 2i, 2i + 1; har level par normalize."

# 9. Real-world
realWorld:
  - where: "Social network"
    how: "'People you may know' — pehle 1st connections, phir 2nd degree. Level = kitne log door."
  - where: "File explorer search"
    how: "Pehle current folder ki files, phir ek level andar — paas wali file jaldi milti hai."
  - where: "Org chart"
    how: "CEO, phir uske direct reports, phir unke — level wise report."
  - where: "Game AI"
    how: "Chess / puzzle mein pehle 1 move wale positions, phir 2 move — sabse kam move wala hal."
  - where: "UI / Android view tree"
    how: "Accessibility ya layout inspector — screen ke views ko layer by layer dikhana."

# 10. Common galtiyan & edge cases
mistakes:
  - title: "Level size loop ke andar padha"
    type: logic
    wrong: |
      `for (k in 0 until q.size)` — loop chalte time `q.size` badhta hai → agle level ke nodes is level mein.
    right: |
      Loop se pehle `val size = q.size`, phir `repeat(size)`.
  - title: "Null bachche queue mein daale"
    type: "null"
    wrong: |
      `q.add(n.left)` bina check → null nikla to `n.value` par crash.
    right: |
      `n.left?.let { q.addLast(it) }` — sirf asli node daalo.
  - title: "Khaali tree"
    type: empty
    wrong: |
      Root null aur seedha `q.add(root)` → NullPointer ya galat `[[]]`.
    right: |
      Shuru mein `if (root == null) return emptyList()`.
  - title: "Width mein position overflow"
    type: overflow
    wrong: |
      Positions `2i` bina normalize → deep tree mein numbers 2^depth tak.
    right: |
      Har level par `i - first` — har level 0 se count karo.
  - title: "Stack se BFS"
    type: logic
    wrong: |
      Queue ki jagah stack (`removeLast`) use kiya → DFS ban gaya, level order toota.
    right: |
      `ArrayDeque` mein `addLast` + `removeFirst` (FIFO).

# 11. Interview corner
interview:
  questions:
    - q: "BFS vs DFS tree mein — kab kya?"
      a: |
        BFS (queue): level wale sawaal, min depth, paas wala pehle. DFS (recursion/stack): raasta, subtree se jawab, kam memory jab tree wide ho.
    - q: "Level order ki space?"
      a: |
        O(w) — w = sabse wide level. Complete tree mein aakhri level ~n/2, to O(n). Skewed tree mein O(1).
    - q: "size pehle kyun save karte ho?"
      a: |
        Loop ke beech bachche judte hain; save kiya size = sirf is level ke nodes.
    - q: "Zigzag level order?"
      followUp: true
      a: |
        Wahi BFS; ek flag har level par flip karo. Flag on ho to level list ulti (ya `addFirst` deque mein).
    - q: "Har node ka 'next' pointer apne level ke right node par — O(1) space?"
      followUp: true
      a: |
        Upar wala level already jud chuka hai — uski chain par chalo aur neeche wale level ke bachche jodo. Queue nahi chahiye.
    - q: "Level order recursion se?"
      a: |
        DFS with depth: `if (depth == res.size) res.add(mutableListOf()); res[depth].add(v)`. Left pehle visit karo.
    - q: "Bottom-up level order?"
      a: |
        Normal BFS, aakhir mein result reverse (ya har level `addFirst`).
    - q: "Tree serialize kaise karoge?"
      a: |
        BFS mein values likho, null ke liye `#`. Wapas banate time queue mein parent, string se 2-2 values left/right.
  mayAsk:
    - "Binary Tree Zigzag Level Order."
    - "Populating Next Right Pointers."
    - "Cousins in Binary Tree."
    - "Largest Value in Each Tree Row."

