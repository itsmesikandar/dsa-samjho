# 13. Quick revision
revision:
  summary:
    - "Pre N L R, In L N R, Post L R N — likhne ki jagah ka farak."
    - "BST inorder = sorted."
    - "Iterative inorder: left push → pop visit → right."
    - "Pre + In (ya Post + In) se tree; HashMap se O(n)."
    - "Flatten: left subtree ka rightmost → purana right; left ko right banao."
  cheatsheet: |
    ```kotlin
    // iterative inorder
    var cur = root; val st = ArrayDeque<TreeNode>()
    while (cur != null || st.isNotEmpty()) {
        while (cur != null) { st.addLast(cur); cur = cur.left }
        val n = st.removeLast(); visit(n); cur = n.right
    }
    // iterative preorder
    st.addLast(root); while (st.isNotEmpty()) { val n = st.removeLast(); visit(n)
        n.right?.let(st::addLast); n.left?.let(st::addLast) }
    ```
  quiz:
    - q: "Tree [1, 2, 3] ka postorder?"
      options: ["1 2 3", "2 1 3", "2 3 1", "3 2 1"]
      answer: 2
      explain: "Left (2), right (3), phir node (1)."
    - q: "BST ka kaunsa traversal sorted deta hai?"
      options: ["Preorder", "Inorder", "Postorder", "Level order"]
      answer: 1
      explain: "Left (chhote) → node → right (bade)."
    - q: "Iterative preorder mein pehle kise push karte hain?"
      options: ["Left", "Right", "Root ke baad koi farak nahi", "Dono saath"]
      answer: 1
      explain: "Stack LIFO — left pehle nikalna chahiye."
    - q: "Preorder [3, 9, 20], inorder [9, 3, 20] — root ka left?"
      options: ["20", "9", "null", "3"]
      answer: 1
      explain: "Inorder mein 3 ke left 9."
    - q: "Morris traversal ki space?"
      options: ["O(n)", "O(h)", "O(1)", "O(log n)"]
      answer: 2
      explain: "Temporary threads, koi stack nahi."

