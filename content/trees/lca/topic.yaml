# 13. Quick revision
revision:
  summary:
    - "LCA = p aur q ka sabse neeche wala common ancestor; node apna ancestor khud."
    - "Binary tree: p/q mila to khud return karo; dono taraf se aaya → yahi LCA; warna jo aaya. O(n)."
    - "BST: dono chhote → left, dono bade → right, warna yahi. O(h)."
    - "Distance = LCA se p + LCA se q."
    - "Maan ke chalta hai p, q dono hain; bahut queries → binary lifting."
  cheatsheet: |
    ```kotlin
    fun lca(n: TreeNode?, p: Int, q: Int): TreeNode? {
        if (n == null || n.value == p || n.value == q) return n
        val l = lca(n.left, p, q); val r = lca(n.right, p, q)
        return if (l != null && r != null) n else l ?: r
    }
    // BST: while (cur) { dono < cur → left; dono > cur → right; warna return cur }
    // dist = depth(lca, p) + depth(lca, q)
    ```
  quiz:
    - q: "Tree [3, 5, 1, 6, 2, 0, 8, #, #, 7, 4] mein LCA(6, 4)?"
      options: ["3", "5", "2", "6"]
      answer: 1
      explain: "6 = 5 ka left, 4 = 5 ke right (2) ke neeche — raaste 5 par alag."
    - q: "LCA(5, 4) usi tree mein?"
      options: ["3", "5", "2", "4"]
      answer: 1
      explain: "4 to 5 ke neeche hai — node apna ancestor khud."
    - q: "BST mein LCA ki complexity?"
      options: ["O(1)", "O(h)", "O(n)", "O(n log n)"]
      answer: 1
      explain: "Value se direction — sirf ek raasta neeche."
    - q: "DFS mein ek node par left se x aur right se y aaya. Matlab?"
      options: ["x LCA hai", "y LCA hai", "Ye node LCA hai", "LCA upar hai"]
      answer: 2
      explain: "p aur q alag taraf — raaste yahin milte hain."
    - q: "Distance(7, 0) — LCA 3, 3 se 7 = 3 edges, 3 se 0 = 2 edges?"
      options: ["3", "5", "6", "2"]
      answer: 1
      explain: "Raasta LCA par mudta hai: 3 + 2."

