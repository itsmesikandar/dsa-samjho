# 13. Quick revision
revision:
  summary:
    - "Bottom-up = postorder: bachchon se lo, milao, upar bhejo. O(n) time, O(h) stack."
    - "Return value = parent ko kya chahiye; jawab alag ho to global best."
    - "Balanced: height ya -1 — ek pass, -1 milte hi ruko."
    - "Diameter: best = l + r, return 1 + max(l, r). Max path: gain = max(0, ·), best MIN se."
    - "Ek number kam pade → pair return (take, skip) = tree DP."
  cheatsheet: |
    ```kotlin
    var best = 0
    fun go(n: TreeNode?): Int {
        if (n == null) return 0
        val l = go(n.left); val r = go(n.right)
        best = maxOf(best, l + r)   // jo yahan mudta hai
        return 1 + maxOf(l, r)      // parent ko ek taraf
    }
    // balanced: l/r == -1 ya |l - r| > 1 → return -1
    // pair: return intArrayOf(take, skip)
    ```
  quiz:
    - q: "Naive balanced check (har node par height) ka worst time?"
      options: ["O(n)", "O(n log n) hamesha", "O(n × h), worst O(n²)", "O(h)"]
      answer: 2
      explain: "Har node apne har ancestor ke liye dobara gina jaata hai."
    - q: "Diameter function parent ko kya return karta hai?"
      options: ["l + r", "1 + max(l, r)", "best", "l + r + 1"]
      answer: 1
      explain: "Parent ke liye raasta ek taraf se hi aa sakta hai. l + r sirf best ke liye."
    - q: "Tree [1, 2, 3, 4, 5] ka diameter (edges)?"
      options: ["2", "3", "4", "5"]
      answer: 1
      explain: "4 → 2 → 1 → 3 (ya 5 → 2 → 1 → 3) = 3 edges."
    - q: "Max path sum mein best ki shuruaati value?"
      options: ["0", "root.value", "Int.MIN_VALUE", "-1"]
      answer: 2
      explain: "Sab negative ho to bhi sahi max milna chahiye. (root.value bhi chal jaata, par MIN sabse simple.)"
    - q: "House Robber III mein node kya return karta hai?"
      options: ["Sirf max", "(take, skip) pair", "Height", "Loote gaye ghar ki list"]
      answer: 1
      explain: "Parent loote to bachche ka skip chahiye, na loote to max — dono chahiye."

