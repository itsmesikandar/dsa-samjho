# 13. Quick revision
revision:
  summary:
    - "Window = continuous k items. Slide: add(a[r]), remove(a[r − k])."
    - "Window range r − k + 1..r. O(n) time, summary jitna space."
    - "Sum/count/freq slide hote hain; max/min ke liye deque."
    - "Anagram = count array barabar; window size = |p|."
    - "Edges se k uthao = beech ki n − k window ka min (complement)."
  cheatsheet: |
    ```kotlin
    var sum = 0
    for (i in 0 until k) sum += a[i]
    var best = sum
    for (r in k until a.size) {
        sum += a[r] - a[r - k]   // in, out
        best = maxOf(best, sum)
    }

    // anagram: need[26], have[26]
    have[s[r] - 'a']++
    if (r >= k) have[s[r - k] - 'a']--
    if (r >= k - 1 && have.contentEquals(need)) res.add(r - k + 1)
    ```
  quiz:
    - q: "Window r par khatam hoti hai (size k). Bahar jaane wala index?"
      options: ["r − k", "r − k + 1", "r − 1", "r + k"]
      answer: 0
      explain: "Nayi window r − k + 1..r hai, to r − k bahar gaya."
    - q: "[3, 1, 4, 1, 5], k = 2 — max window sum?"
      options: ["5", "6", "7", "9"]
      answer: 1
      explain: "Windows: 4, 5, 5, 6 → 6 (1 + 5)."
    - q: "Window ka maximum seedha slide kyun nahi hota?"
      options: ["Max nikaalna O(1) hai", "Max bahar gaya to naya max bina dekhe pata nahi", "Max hamesha last item hota hai", "Hota hai, koi dikkat nahi"]
      answer: 1
      explain: "Sum ghata sakte ho, max ko 'undo' nahi kar sakte — deque chahiye."
    - q: "Find All Anagrams mein window size?"
      options: ["s.length", "p.length", "26", "Variable"]
      answer: 1
      explain: "Anagram ki length p jitni hi hogi."
    - q: "[1, 2, 3, 4, 5, 6, 1], k = 3 cards edges se. Kaunsi window ka min sum dhoondhte hain?"
      options: ["Size 3", "Size 4", "Size 7", "Size 1"]
      answer: 1
      explain: "n − k = 4 cards bachenge — wahi window."

