# 7. Examples
examples:
  - id: reverse-vowels
    level: easy
    title: Sirf vowels ulte karo
    source: { name: Reverse Vowels of a String, platform: LeetCode, url: "https://leetcode.com/problems/reverse-vowels-of-a-string/" }
    problem: |
      Ek string mein sirf **vowels** (a, e, i, o, u — capital bhi) ka order ulta karo. Baaki letters apni jagah rahein.

      Example: `"hello"` → `"holle"`
    intuition: |
      Normal reverse jaisa — l aur r se swap. Bas pehle dono ko apna-apna **agla vowel** dhoondhne do (consonants skip).

      - `l` aage badhta hai jab tak vowel na mile.
      - `r` peeche aata hai jab tak vowel na mile.
      - Dono vowels → swap, dono andar.

      > [!galti]
      > Skip loops mein `l < r` check zaroori — string mein vowel hi na ho to pointers bahar chale jaayenge.
    dryRun: |
      `"hello"` → h e l l o

      | l | r | Kya hua | String |
      |---|---|---|---|
      | 0 → 1 | 4 | h skip; e aur o vowels | |
      | 1 | 4 | swap e ↔ o | h o l l e |
      | 2 | 3 | l, l skip → mil gaye | **holle** |
    viz: { tracer: vowelsRevTrace }
    code: ex1-vowels
    complexity:
      time: O(n)
      space: O(n)
      why: "Har char ek baar; String immutable hai, isliye char array copy O(n)."

  - id: container
    level: medium
    title: Container with most water
    source: { name: Container With Most Water, platform: LeetCode, url: "https://leetcode.com/problems/container-with-most-water/" }
    problem: |
      Deewaron ki unchaiyan di hain (har index par ek deewar). Do deewarein chuno jinke beech **sabse zyada paani** aaye. Paani = chhoti deewar × dono ki doori.

      Example: `[1, 8, 6, 2, 5, 4, 8, 3, 7]` → **49** (index 1 aur 8: min(8, 7) × 7)
    intuition: |
      Brute force: saare pairs → O(n²).

      Shuru karo sabse **chaudi** jodi se (l = 0, r = end). Ab kaunsi deewar hatayein?

      **Chhoti deewar hatao.** Kyun? Area chhoti deewar se limit hai. Agar chhoti ko rakh ke doosri ko andar laao, to doori kam hogi aur unchai chhoti wali se upar ja hi nahi sakti — area kabhi nahi badhega. To chhoti deewar ke saath ab koi bhi jodi fayde ki nahi — use hata do.

      > [!tip]
      > Ye "greedy + two pointers" ka classic hai. Interview mein **kyun chhoti hatate hain** ye proof bolna zaroori hai — sirf code nahi.
    dryRun: |
      | l | r | h[l] | h[r] | Area | best | Hatao |
      |---|---|---|---|---|---|---|
      | 0 | 8 | 1 | 7 | 1 × 8 = 8 | 8 | l (1 chhota) |
      | 1 | 8 | 8 | 7 | 7 × 7 = 49 | **49** | r |
      | 1 | 7 | 8 | 3 | 3 × 6 = 18 | 49 | r |
      | 1 | 6 | 8 | 8 | 8 × 5 = 40 | 49 | r |
      | … | | | | | 49 | |
    viz: { tracer: containerTrace }
    code: ex2-container
    complexity:
      time: O(n)
      space: O(1)
      why: "Har kadam ek deewar hatti; sirf do pointers aur best."

  - id: three-sum
    level: tricky
    title: 3Sum — saare unique triplets jinka sum 0
    source: { name: 3Sum, platform: LeetCode, url: "https://leetcode.com/problems/3sum/" }
    problem: |
      Ek array mein se saare **unique** triplets `[a, b, c]` dhoondho jinka sum 0 ho. Same triplet do baar nahi aana chahiye.

      Example: `[-1, 0, 1, 2, -1, -4]` → `[[-1, -1, 2], [-1, 0, 1]]`
    intuition: |
      Brute force: teen loops → O(n³).

      **Trick:** array **sort** karo. Phir har `i` ko pehla number fix karo — baaki do ka sum `−a[i]` chahiye. Ye ab ek **sorted Two Sum** hai → two pointers, O(n).

      Total: n × O(n) = **O(n²)**.

      **Duplicates se bachna** (sabse tricky hissa):
      - `a[i]` pichle `a[i−1]` jaisa ho → skip (same triplets dobara banenge).
      - Triplet milne ke baad `l` ko aage badhao jab tak same value hai.

      > [!galti]
      > HashSet mein triplets daal ke duplicates hatana bhi chalta hai, par interviewer sorted-skip wala clean tareeka expect karta hai.
    dryRun: |
      Sorted: `[-4, -1, -1, 0, 1, 2]`

      | i (a[i]) | Need | Two pointers result |
      |---|---|---|
      | 0 (−4) | 4 | koi pair nahi |
      | 1 (−1) | 1 | (−1, 2) ✓, (0, 1) ✓ |
      | 2 (−1) | – | pichle jaisa → skip |
      | 3 (0) | 0 | koi nahi |
    viz: { tracer: threeSumTrace }
    code: ex3-three-sum
    complexity:
      time: O(n²)
      space: "O(1) extra (sort aur output chhod ke)"
      why: "Sort O(n log n), phir har i par ek two-pointer pass O(n)."

# 8. Kab use karein / kab NAHI
when:
  use:
    - "Array **sorted** hai (ya sort kar sakte ho) aur pair/triplet ka sum chahiye."
    - "Dono kinaron ko milaana hai — reverse, palindrome."
    - "Ek pointer hilane se kuch options pakka bekaar ho jaate hain (container, trapping rain water)."
  avoid:
    - "Array unsorted hai aur original indexes chahiye (Two Sum I) — sort se index kho jaate hain; HashMap lo."
    - "Contiguous subarray ka sum/length chahiye — wo sliding window (same direction) hai."
    - "Negative numbers ke saath subarray sum — prefix + HashMap."
  signals:
    - keyword: "sorted array, pair with sum"
      think: "l = 0, r = n − 1; sum chhota → l++, bada → r--."
    - keyword: "palindrome / reverse in place"
      think: "Dono kinaron se milao/swap."
    - keyword: "3Sum / 4Sum / k-sum"
      think: "Sort + (k−2) loops + two pointers; duplicates skip."
    - keyword: "max area / trapped water between bars"
      think: "Chhoti side wala pointer andar."

