meta:
  id: two-pointers-opposite
  chapter: two-pointers-window
  title: Two Pointers (dono kinaron se)
  subtitle: Ek pointer shuru se, ek end se — har kadam par aadhe options khatam
  level: intermediate
  minutes: 35
  prereqs: [array, problem-solving]
  tags: [two-pointers, sorted, opposite-ends, 3sum]

# 1. Ye kya hai?
what:
  body: |
    **Two pointers (opposite ends)** = do index — `l` array ke **shuru** mein, `r` **end** mein. Har kadam par kisi ek ko **andar** ki taraf khiskao, jab tak dono mil na jaayein.

    ```kotlin
    var l = 0
    var r = arr.size - 1
    while (l < r) {
        // arr[l] aur arr[r] dekh ke faisla:
        // l++ ya r-- (ya dono)
    }
    ```

    Kahan kaam aata hai:
    - **Sorted array** mein pair dhoondhna (sum = target)
    - **Reverse / palindrome** (dono kinare milaana)
    - **Container / area** jaise problems
    - **3Sum** (ek fix + baaki do par two pointers)

    > [!yaad]
    > Har kadam par ek pointer hilta hai → zyada se zyada n kadam → **O(n)**, aur extra memory **O(1)**.
  analogy: |
    **Shaadi mein do log dulhan ke liye perfect joda dhoondh rahe hain** — ek line chhote se bade height ki. Ek dost line ke shuru se, ek end se.

    Jodi zyada lambi lag rahi hai? Lambe wale ko hatao (r--). Bahut chhoti? Chhote ko hatao (l++). Har baar ek insaan line se hat jaata hai — jaldi hi jawab mil jaata hai, sabko sabse milwaane ki zaroorat nahi.

# 2. Kyun chahiye?
why:
  body: |
    Pairs wale problems ka brute force **O(n²)** hota hai (har pair check). Two pointers usse **O(n)** bana deta hai — bina extra memory ke (HashMap O(n) memory leta).

    Shart: data mein koi **order** ho (sorted), ya problem ka structure aisa ho ki ek pointer hilane se kuch options **pakka bekaar** ho jaayein.

    > [!socho]
    > Sorted array mein sum bahut bada aaya (`arr[l] + arr[r] > target`). `r--` hi kyun, `l++` kyun nahi?
    >
    > `l++` karne se sum aur **bada** hoga (sorted!). Aur `arr[l]` sabse chhota bacha hai — jab uske saath bhi `arr[r]` zyada hai, to `arr[r]` kisi ke saath kaam nahi aayega. Isliye `arr[r]` ko hatana safe hai.

# 3. Visual intro
visual:
  body: |
    Neeche grid mein **saare pairs** ke sums hain (row = i, column = j). Brute force sab cells dekhta hai.

    Two pointers har kadam par **poori ek row ya column** hata deta hai (grey) — isliye sirf ~n kadam lagte hain. Ye "kyun sahi hai" ka asli saboot hai.
  viz: { tracer: pairGrid }

# 4. Kaise kaam karta hai
how:
  body: |
    Example: **sorted array ke squares, sorted order mein** (negative numbers bhi hain).

    `[-4, -1, 0, 3, 10]` ke squares `[16, 1, 0, 9, 100]` — order toot gaya. Sort karoge to O(n log n).

    **Observation:** sabse bada square hamesha **kisi kinare** par hoga (sabse negative ya sabse positive). To:
    1. `l` aur `r` dono kinaron par.
    2. Jiska `|value|` bada, uska square result ke **end** mein likho, us pointer ko andar karo.
    3. Result ko peeche se bharo.

    > [!tip]
    > "Sabse bada/chhota kahan milega?" ka jawab **kinare** ho to opposite two pointers socho.
  viz: { tracer: squaresTrace }
  code: how

