# 10. Common galtiyan & edge cases
mistakes:
  - title: "Unsorted array par opposite two pointers"
    type: logic
    wrong: |
      `[3, 1, 4, 2]`, target 5 par seedha l/r → galat faisle (sum ka order ka koi matlab nahi).
    right: |
      Pehle sort (agar original index nahi chahiye), warna HashMap.
  - title: "`while (l <= r)` jab pair chahiye"
    type: off-by-one
    wrong: |
      `l <= r` → l == r par ek hi element ko do baar use kar liya.
    right: |
      Pair ke liye `l < r`.
  - title: "3Sum mein duplicates"
    type: logic
    wrong: |
      `[-1, -1, 0, 1]` → `[-1, 0, 1]` do baar aaya.
    right: |
      `if (i > 0 && a[i] == a[i−1]) continue`, aur found ke baad `l` ko same values se aage badhao.
  - title: "Sum overflow"
    type: overflow
    right: |
      Values 10⁹ ke paas → `a[l] + a[r]` Int overflow. `.toLong()` karke jodo.
  - title: "Skip loops mein bounds check bhoolna"
    type: off-by-one
    wrong: |
      `while (!isVowel(c[l])) l++` — vowel hi nahi hai to l string ke bahar.
    right: |
      `while (l < r && !isVowel(c[l])) l++`.

# 11. Interview corner
interview:
  questions:
    - q: "Opposite two pointers kab kaam karta hai?"
      a: |
        Jab data sorted ho ya structure aisa ho ki har kadam par ek pointer hilane se kuch options pakka bekaar ho jaayein. Tab O(n²) → O(n).
    - q: "Sorted Two Sum mein ye approach sahi kyun hai (proof)?"
      a: |
        Sum bada: arr[l] sabse chhota bacha hai, phir bhi zyada → arr[r] kisi ke saath target nahi bana sakta → hata do. Sum chhota: symmetric argument se arr[l] hata do. Koi valid pair kabhi nahi hata.
    - q: "Container with most water mein chhoti deewar kyun hatate ho?"
      followUp: true
      a: |
        Area = min(h) × width. Chhoti deewar rakhi to width ghategi aur min upar nahi jaayega — area kabhi nahi badhega. Isliye chhoti deewar ke saare remaining pairs bekaar — hata do.
    - q: "3Sum ki complexity aur duplicates kaise sambhaale?"
      a: |
        Sort + har i par two pointers = O(n²). Same a[i] skip, aur triplet milne par l ko same values se aage.
    - q: "Two Sum (unsorted, index chahiye) mein two pointers kyun nahi?"
      a: |
        Sort karne se original index kho jaate hain (pair of value-index sort kar sakte ho, par O(n log n)). HashMap O(n) seedha.
    - q: "4Sum kaise karoge?"
      followUp: true
      a: |
        Sort + do loops (i, j) + two pointers → O(n³). Duplicates har level par skip. Sum Long mein (overflow).
    - q: "Trapping rain water two pointers se?"
      a: |
        leftMax, rightMax rakho; jis side ka max chhota, us side ka paani pakka = max − height; wo pointer andar. O(n), O(1).
    - q: "Opposite pointers aur same-direction pointers mein fark?"
      a: |
        Opposite: dono kinaron se andar (pairs, palindrome). Same direction: dono aage badhte (read/write, sliding window, fast/slow).
  mayAsk:
    - "3Sum Closest."
    - "Valid Palindrome II (ek char hata sakte ho)."
    - "Boats to Save People."
    - "Sort Colors (Dutch flag — teen pointers)."

