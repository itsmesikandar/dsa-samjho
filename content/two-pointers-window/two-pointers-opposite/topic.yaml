# 13. Quick revision
revision:
  summary:
    - "l shuru se, r end se; har kadam ek pointer andar; O(n), O(1)."
    - "Sorted pair sum: chhota → l++, bada → r--."
    - "Proof: hilaaya gaya element kisi bache hue ke saath kaam nahi aata."
    - "Container: chhoti deewar hatao. 3Sum: sort + fix i + two pointers, duplicates skip."
    - "Unsorted + index chahiye → HashMap; contiguous subarray → sliding window."
  cheatsheet: |
    ```kotlin
    var l = 0; var r = a.size - 1
    while (l < r) {
        val s = a[l] + a[r]
        when {
            s == target -> return ...
            s < target  -> l++
            else        -> r--
        }
    }
    // 3Sum: sort; for i { if (i>0 && a[i]==a[i-1]) continue; two pointers on i+1..n-1 }
    ```
  quiz:
    - q: "Sorted [1, 3, 5, 8], target 11. Pehla step (l=0, r=3) ke baad kya?"
      options: ["l++", "r--", "Answer mil gaya", "Dono hilao"]
      answer: 0
      explain: "1 + 8 = 9 < 11 — sum chhota hai, badi value chahiye → l++."
    - q: "Container with most water mein kaunsi deewar hatate hain?"
      options: ["Badi", "Chhoti", "Random", "Beech wali"]
      answer: 1
      explain: "Chhoti deewar area ko limit karti hai."
    - q: "3Sum ki best complexity (is approach se)?"
      options: ["O(n)", "O(n log n)", "O(n²)", "O(n³)"]
      answer: 2
      explain: "Sort + har i par O(n)."
    - q: "Pair ke liye loop condition?"
      options: ["l <= r", "l < r", "l != 0", "r > 0"]
      answer: 1
      explain: "l == r ek hi element hai."
    - q: "Unsorted array, original indexes chahiye (Two Sum). Best?"
      options: ["Opposite two pointers", "HashMap", "Sliding window", "Binary search"]
      answer: 1
      explain: "Sort karne se index kho jaate hain."

