# 13. Quick revision
revision:
  summary:
    - "Reader r har item, writer w sirf kaam ke items; dono sirf aage."
    - "w â‰¤ r hamesha â€” isliye in-place overwrite safe. O(n), O(1)."
    - "Dedupe: likhe hue a[w âˆ’ 1] se compare; max k copies: a[w âˆ’ k]."
    - "Merge in-place: khaali jagah end mein â†’ peeche se bharo, while (j >= 0)."
    - "Loop mein removeAt = O(nÂ²) + skip bug. Read/write lo."
  cheatsheet: |
    ```kotlin
    // filter in-place
    var w = 0
    for (r in a.indices) if (keep(a[r])) a[w++] = a[r]
    // a[0 until w] = answer

    // sorted, max k copies
    for (x in a) if (w < k || x != a[w - k]) a[w++] = x

    // merge nums2 into nums1 (peeche se)
    var i = m - 1; var j = n - 1; var k = m + n - 1
    while (j >= 0) nums1[k--] = if (i >= 0 && nums1[i] > nums2[j]) nums1[i--] else nums2[j--]
    ```
  quiz:
    - q: "Read/write pointers mein kaunsi baat hamesha sach hai?"
      options: ["w â‰¤ r", "w > r", "w == r", "w aur r ulti direction mein"]
      answer: 0
      explain: "Writer kabhi reader se aage nahi jaata â€” isliye overwrite safe."
    - q: "[0, 0, 1, 1, 2] par removeDuplicates kya return karega?"
      options: ["2", "3", "5", "1"]
      answer: 1
      explain: "Unique: 0, 1, 2 â†’ 3."
    - q: "Merge Sorted Array mein nums1 mein peeche se kyun likhte hain?"
      options: ["Fast hota hai", "Aage se likhne par unread numbers overwrite ho jaate", "Sorted descending chahiye", "nums2 bada hai"]
      answer: 1
      explain: "Khaali jagah end mein hai; peeche se likhna safe hai."
    - q: "Max 2 copies wale dedupe mein naye x ko kisse compare karte hain?"
      options: ["a[r âˆ’ 1]", "a[r âˆ’ 2]", "a[w âˆ’ 2]", "a[w]"]
      answer: 2
      explain: "Likhe hue hisse se â€” 2 peeche wala same hai to ye teesri copy hogi."
    - q: "Loop ke andar list.removeAt(i) ki complexity?"
      options: ["O(n)", "O(n log n)", "O(nÂ²)", "O(1)"]
      answer: 2
      explain: "Har remove O(n) khiskata hai, n baar."

